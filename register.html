<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account - KALI LIFE ECOSYSTEM</title>

<style>

/* ==========================================
   KALI LIFE ECOSYSTEM
   USER REGISTRATION
   PREMIUM FINAL DESIGN
========================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background:
        linear-gradient(
            135deg,
            #14532d,
            #166534,
            #0f172a
        );
}

/* ==========================================
   REGISTER CARD
========================================== */

.container {
    width: 100%;
    max-width: 430px;
    background: #ffffff;
    padding: 32px;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

/* ==========================================
   HEADER
========================================== */

.logo {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: #166534;
    margin-bottom: 6px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    font-size: 14px;
    margin-bottom: 25px;
}

h2 {
    text-align: center;
    color: #0f172a;
    font-size: 22px;
    margin-bottom: 22px;
}

/* ==========================================
   FORM GROUP
========================================== */

.form-group {
    margin-bottom: 17px;
}

label {
    display: block;
    margin-bottom: 7px;
    color: #334155;
    font-size: 14px;
    font-weight: bold;
}

/* ==========================================
   INPUT
========================================== */

input {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    background: #ffffff;
    color: #0f172a;
    font-size: 15px;
    outline: none;
    transition: 0.2s;
}

input::placeholder {
    color: #94a3b8;
}

input:focus {
    border-color: #16a34a;
    box-shadow:
        0 0 0 3px rgba(22,163,74,0.12);
}

/* ==========================================
   PASSWORD AREA
========================================== */

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 65px;
}

.show-password {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: #166534;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

/* ==========================================
   PASSWORD STRENGTH
========================================== */

.password-strength {
    margin-top: 7px;
    font-size: 12px;
    color: #64748b;
}

/* ==========================================
   REGISTER BUTTON
========================================== */

.register-btn {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border: none;
    border-radius: 9px;
    background: #16a34a;
    color: #ffffff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.register-btn:hover {
    background: #15803d;
}

.register-btn:disabled {
    background: #94a3b8;
    cursor: not-allowed;
}

/* ==========================================
   ERROR / SUCCESS
========================================== */

#error {
    min-height: 20px;
    margin-top: 13px;
    text-align: center;
    color: #dc2626;
    font-size: 14px;
    font-weight: bold;
}

.success {
    color: #15803d !important;
}

/* ==========================================
   LOGIN LINK
========================================== */

.login-link {
    display: block;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid #e2e8f0;
    text-align: center;
    text-decoration: none;
    color: #166534;
    font-size: 14px;
    font-weight: bold;
}

.login-link:hover {
    text-decoration: underline;
}

/* ==========================================
   SECURITY NOTE
========================================== */

.security-note {
    margin-top: 15px;
    padding: 10px;
    border-radius: 7px;
    background: #f0fdf4;
    color: #166534;
    text-align: center;
    font-size: 12px;
}

/* ==========================================
   MOBILE
========================================== */

@media (max-width: 500px) {

    body {
        padding: 12px;
    }

    .container {
        padding: 24px 20px;
        border-radius: 14px;
    }

    .logo {
        font-size: 24px;
    }

    h2 {
        font-size: 20px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="logo">
        KALI LIFE
    </div>

    <div class="subtitle">
        ECOSYSTEM
    </div>

    <h2>Create Account</h2>


    <div class="form-group">

        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            autocomplete="name">

    </div>


    <div class="form-group">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            autocomplete="email">

    </div>


    <div class="form-group">

        <label for="mobile">
            Mobile Number
        </label>

        <input
            type="tel"
            id="mobile"
            placeholder="10 digit mobile number"
            inputmode="numeric"
            maxlength="10"
            autocomplete="tel">

    </div>


    <div class="form-group">

        <label for="password">
            Password
        </label>

        <div class="password-box">

            <input
                type="password"
                id="password"
                placeholder="Minimum 8 characters"
                autocomplete="new-password"
                oninput="checkPasswordStrength()">

            <button
                type="button"
                class="show-password"
                onclick="togglePassword()"
                id="showPasswordBtn">
                Show
            </button>

        </div>

        <div
            id="passwordStrength"
            class="password-strength">
        </div>

    </div>


    <button
        type="button"
        class="register-btn"
        id="registerBtn"
        onclick="registerUser()">

        Create Account

    </button>


    <p id="error"></p>


    <a
        href="login.html"
        class="login-link">

        Already have an account? Login

    </a>


    <div class="security-note">

        🔐 Your password is handled by Firebase Authentication.

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* ==========================================
   FIREBASE CONFIGURATION
========================================== */

const firebaseConfig = {
    apiKey: "AIzaSyDqXcxTrI22Ju1Rj9mtbUSCjGkT7B_OxZo",
    authDomain: "kali-life-ecosystem.firebaseapp.com",
    projectId: "kali-life-ecosystem",
    storageBucket: "kali-life-ecosystem.firebasestorage.app",
    messagingSenderId: "734170546737",
    appId: "1:734170546737:web:26f79e1b4b19ebabfe0b10",
    measurementId: "G-LBEY0W7RX3"
};


/* ==========================================
   FIREBASE INITIALIZATION
========================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* ==========================================
   REGISTER USER
========================================== */

window.registerUser = async function () {

    const name =
        document.getElementById("name")
        .value
        .trim();

    const email =
        document.getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const mobile =
        document.getElementById("mobile")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    const error =
        document.getElementById("error");

    const button =
        document.getElementById("registerBtn");


    error.innerText = "";
    error.classList.remove("success");


    /* VALIDATION */

    if (name.length < 3) {

        error.innerText =
            "Please enter your full name.";

        return;
    }


    if (!email.includes("@")) {

        error.innerText =
            "Please enter a valid email address.";

        return;
    }


    if (!/^[0-9]{10}$/.test(mobile)) {

        error.innerText =
            "Mobile number must contain exactly 10 digits.";

        return;
    }


    if (password.length < 8) {

        error.innerText =
            "Password must be at least 8 characters.";

        return;
    }


    try {

        button.disabled = true;
        button.innerText =
            "Creating Account...";


        /* FIREBASE AUTH */

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            userCredential.user;


        /* UPDATE DISPLAY NAME */

        await updateProfile(user, {

            displayName: name

        });


        /* FIRESTORE USER PROFILE */

        await setDoc(
            doc(db, "users", user.uid),
            {

                uid: user.uid,

                name: name,

                email: email,

                mobile: mobile,

                role: "User",

                status: "Active",

                createdAt:
                    serverTimestamp()

            }
        );


        error.classList.add("success");

        error.innerText =
            "Registration Successful!";


        alert(
            "Registration Successful!"
        );


        window.location.href =
            "login.html";


    } catch (error) {

        console.error(error);


        if (
            error.code ===
            "auth/email-already-in-use"
        ) {

            error.innerText =
                "This email is already registered.";

        }

        else if (
            error.code ===
            "auth/invalid-email"
        ) {

            error.innerText =
                "Invalid email address.";

        }

        else if (
            error.code ===
            "auth/weak-password"
        ) {

            error.innerText =
                "Password is too weak.";

        }

        else {

            error.innerText =
                "Registration failed. Please try again.";

        }

        button.disabled = false;

        button.innerText =
            "Create Account";

    }

};


/* ==========================================
   SHOW / HIDE PASSWORD
========================================== */

window.togglePassword = function () {

    const password =
        document.getElementById("password");

    const button =
        document.getElementById(
            "showPasswordBtn"
        );


    if (password.type === "password") {

        password.type = "text";

        button.innerText = "Hide";

    } else {

        password.type = "password";

        button.innerText = "Show";

    }

};


/* ==========================================
   PASSWORD STRENGTH
========================================== */

window.checkPasswordStrength = function () {

    const password =
        document.getElementById("password")
        .value;

    const strength =
        document.getElementById(
            "passwordStrength"
        );


    if (password.length === 0) {

        strength.innerText = "";

    }

    else if (password.length < 8) {

        strength.innerText =
            "Password strength: Weak";

    }

    else if (
        password.length >= 8 &&
        /[A-Z]/.test(password) &&
        /[0-9]/.test(password)
    ) {

        strength.innerText =
            "Password strength: Strong";

    }

    else {

        strength.innerText =
            "Password strength: Medium";

    }

};

</script>

</body>

</html>
