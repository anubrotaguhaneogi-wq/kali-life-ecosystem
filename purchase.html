<\/div>\n  <div>\n    <label>Date<\/label>\n    <input type=\"text\" id=\"invoiceDate\" readonly>\n  <\/div>\n<\/div>\n\n<label>Sold By (Admin)<\/label>\n<input type=\"text\" id=\"soldByName\" readonly>\n\n<hr>\n\n<h3>Customer<\/h3>\n\n<label>Customer Name *<\/label>\n<input type=\"text\" id=\"customerName\" placeholder=\"Enter Customer Name\" autocomplete=\"off\">\n\n<label>Mobile Number *<\/label>\n<input type=\"tel\" id=\"customerMobile\" placeholder=\"Enter Mobile Number\">\n\n<label>Address<\/label>\n<textarea id=\"customerAddress\" rows=\"2\" placeholder=\"Enter Address\"><\/textarea>\n\n<hr>\n\n<h3>Product<\/h3>\n\n<label>Product Name *<\/label>\n<input type=\"text\" id=\"productName\" placeholder=\"Enter Product Name\" autocomplete=\"off\">\n\n<label>Quantity *<\/label>\n<input type=\"number\" id=\"quantity\" inputmode=\"decimal\" min=\"0\" step=\"any\" placeholder=\"Enter Quantity\">\n\n<div class=\"row\">\n  <div>\n    <label>Buying Price (per piece) *<\/label>\n    <input type=\"number\" id=\"buyPrice\" inputmode=\"decimal\" min=\"0\" step=\"any\" placeholder=\"Bought at\">\n  <\/div>\n  <div>\n    <label>Selling Price (per piece) *<\/label>\n    <input type=\"number\" id=\"sellingPrice\" inputmode=\"decimal\" min=\"0\" step=\"any\" placeholder=\"Sold at\">\n  <\/div>\n<\/div>\n\n<div class=\"calc\"><span>Total Sale<\/span><span id=\"totalView\">₹0<\/span><\/div>\n<div class=\"calc\"><span>Profit<\/span><span id=\"profitView\">₹0<\/span><\/div>\n<label>Your Role &amp; Commission Level<\/label>\n<input type=\"text\" id=\"roleView\" readonly value=\"Checking...\">\n\n<div class=\"calc\"><span id=\"commLabel\">Your Commission<\/span><span id=\"commView\">₹0<\/span><\/div>\n\n<label>Remarks<\/label>\n<textarea id=\"remarks\" rows=\"2\" placeholder=\"Remarks\"><\/textarea>\n\n<button type=\"button\" id=\"saveSales\">Save Sale<\/button>\n\n<hr>\n\n<h3>My Sales<\/h3>\n<div class=\"sum\">\n  <div>Total Sale<b id=\"sumSales\">₹0<\/b><\/div>\n  <div>Total Profit<b id=\"sumProfit\">₹0<\/b><\/div>\n  <div>Total Commission<b id=\"sumComm\">₹0<\/b><\/div>\n<\/div>\n<div id=\"list\"><p class=\"empty\">Loading...<\/p><\/div>\n\n<button type=\"button\" id=\"backBtn\" style=\"background:#1a2320;\">Back to Dashboard<\/button>\n<\/div>\n\n<script type=\"module\">\nimport { initializeApp } from \"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js\";\nimport { getAuth, onAuthStateChanged } from \"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js\";\nimport { getFirestore, collection, addDoc, getDocs, getDoc, doc, query, where }\n  from \"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js\";\n\n// 1) Paste your firebaseConfig from login.html here (exactly the same)\nconst firebaseConfig = {\n  apiKey: \"PASTE_HERE\",\n  authDomain: \"kali-life-ecosystem.firebaseapp.com\",\n  projectId: \"PASTE_HERE\",\n  storageBucket: \"PASTE_HERE\",\n  messagingSenderId: \"PASTE_HERE\",\n  appId: \"PASTE_HERE\"\n};\n\n// 2) Commission is on the TOTAL SALE amount, decided by the admin's role:\n//    Super Admin = 5%, Core Admin = 10%, Departmental Admin = 20%\nlet commPercent = 0;\nlet roleName = \"\";\nconst pct = () => commPercent;\n\nconst app = initializeApp(firebaseConfig);\nconst auth = getAuth(app);\nconst db = getFirestore(app);\n\nconst $ = (id) => document.getElementById(id);\nconst num = (id) => parseFloat($(id).value) || 0;\nconst money = (n) => \"₹\" + (Math.round(n * 100) / 100).toLocaleString(\"en-IN\");\nlet user = null;\n\n$(\"invoiceNumber\").value = \"INV-\" + Date.now();\n$(\"invoiceDate\").value = new Date().toLocaleString(\"en-IN\");\n$(\"backBtn\").addEventListener(\"click\", () => { location.href = \"admin-dashboard.html\"; });\n\nfunction calc() {\n  const qty = num(\"quantity\");\n  const total = qty * num(\"sellingPrice\");\n  const profit = total - qty * num(\"buyPrice\");\n  const comm = total * pct() / 100;\n  $(\"commLabel\").textContent = \"Your Commission (\" + pct() + \"% of total sale)\";\n  $(\"totalView\").textContent = money(total);\n  $(\"profitView\").textContent = money(profit);\n  $(\"commView\").textContent = money(comm);\n  return { total, profit, comm };\n}\n[\"quantity\", \"buyPrice\", \"sellingPrice\"].forEach(id => $(id).addEventListener(\"input\", calc));\ncalc();\n\nasync function detectRole() {\n  let data = null;\n  try {\n    const d = await getDoc(doc(db, \"users\", user.uid));\n    if (d.exists()) data = d.data();\n    if (!data && user.email) {\n      const q = await getDocs(query(collection(db, \"users\"), where(\"email\", \"==\", user.email)));\n      if (!q.empty) data = q.docs[0].data();\n    }\n  } catch (e) {\n    alert(\"Role not loaded: \" + e.code + \" - \" + e.message);\n  }\n  const raw = String((data && (data.role || data.userRole || data.adminRole || data.type)) || localStorage.getItem(\"userRole\") || \"\");\n  const r = raw.toLowerCase().replace(/[^a-z]/g, \"\");\n  roleName = raw;\n  if (r.includes(\"super\")) commPercent = 5;\n  else if (r.includes(\"core\")) commPercent = 10;\n  else if (r.includes(\"depart\")) commPercent = 20;\n  else commPercent = 0;\n  const nm = (data && (data.name || data.fullName)) || localStorage.getItem(\"userName\");\n  if (nm) $(\"soldByName\").value = nm;\n  $(\"roleView\").value = commPercent ? raw + \" - \" + commPercent + \"%\" : \"Role not found - cannot save\";\n  calc();\n}\n\nonAuthStateChanged(auth, async (u) => {\n  if (!u) { location.href = \"login.html\"; return; }\n  user = u;\n  $(\"soldByName\").value = u.displayName || u.email || u.uid;\n  await detectRole();\n  loadList();\n});\n\nasync function loadList() {\n  try {\n    const snap = await getDocs(query(collection(db, \"sales\"), where(\"soldBy\", \"==\", user.uid)));\n    const rows = snap.docs.map(d => d.data()).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));\n    let s = 0, p = 0, c = 0;\n    const list = $(\"list\");\n    list.innerHTML = \"\";\n    if (!rows.length) list.innerHTML = '<p class=\"empty\">No sales yet.<\/p>';\n    rows.forEach(r => {\n      s += r.totalSale || 0; p += r.profit || 0; c += r.commissionAmount || 0;\n      const div = document.createElement(\"div\");\n      div.className = \"item\";\n      const t = document.createElement(\"div\");\n      t.textContent = r.customerName + \" - \" + r.productName + \" x \" + r.quantity + \" = \" + money(r.totalSale);\n      const sm = document.createElement(\"small\");\n      sm.textContent = r.dateText + \" | Profit \" + money(r.profit) + \" | Commission \" + money(r.commissionAmount);\n      div.append(t, sm);\n      list.appendChild(div);\n    });\n    $(\"sumSales\").textContent = money(s);\n    $(\"sumProfit\").textContent = money(p);\n    $(\"sumComm\").textContent = money(c);\n  } catch (e) {\n    $(\"list\").innerHTML = \"\";\n    alert(\"List not loaded: \" + e.code + \" - \" + e.message);\n  }\n}\n\n$(\"saveSales\").addEventListener(\"click\", async () => {\n  const customerName = $(\"customerName\").value.trim();\n  const customerMobile = $(\"customerMobile\").value.trim();\n  const productName = $(\"productName\").value.trim();\n  const quantity = num(\"quantity\");\n  const buyPrice = num(\"buyPrice\");\n  const sellingPrice = num(\"sellingPrice\");\n\n  if (!customerName) return alert(\"Enter customer name\");\n  if (!customerMobile) return alert(\"Enter mobile number\");\n  if (!productName) return alert(\"Enter product name\");\n  if (!(quantity > 0)) return alert(\"Enter quantity\");\n  if (!(buyPrice > 0)) return alert(\"Enter buying price\");\n  if (!(sellingPrice > 0)) return alert(\"Enter selling price\");\n  if (!user) return alert(\"Please login again\");\n  if (!(pct() > 0)) return alert(\"Your role was not found, so commission cannot be set. Sale not saved.\");\n\n  const { total, profit, comm } = calc();\n  const now = new Date();\n  const btn = $(\"saveSales\");\n  btn.disabled = true;\n  btn.textContent = \"Saving...\";\n  try {\n    await addDoc(collection(db, \"sales\"), {\n      invoiceNumber: $(\"invoiceNumber\").value,\n      customerName, customerMobile,\n      customerAddress: $(\"customerAddress\").value.trim(),\n      productName, quantity, buyPrice, sellingPrice,\n      totalSale: total,\n      profit: profit,\n      commissionPercent: pct(),\n      commissionAmount: Math.round(comm * 100) / 100,\n      commissionStatus: \"pending\",\n      remarks: $(\"remarks\").value.trim(),\n      soldBy: user.uid,\n      soldByName: $(\"soldByName\").value,\n      soldByRole: roleName,\n      createdAt: now.getTime(),\n      dateText: now.toLocaleDateString(\"en-IN\")\n    });\n    alert(\"Sale saved successfully!\");\n    [\"customerName\",\"customerMobile\",\"customerAddress\",\"productName\",\"quantity\",\"buyPrice\",\"sellingPrice\",\"remarks\"]\n      .forEach(id => $(id).value = \"\");\n    $(\"invoiceNumber\").value = \"INV-\" + Date.now();\n    $(\"invoiceDate\").value = new Date().toLocaleString(\"en-IN\");\n    calc();\n    loadList();\n  } catch (e) {\n    alert(\"NOT saved: \" + e.code + \" - \" + e.message);\n  } finally {\n    btn.disabled = false;\n    btn.textContent = \"Save Sale\";\n  }\n});\n<\/script>\n<\/body>\n<\/html>\n", "commit": "Rebuild sales page: save to Firestore, sold-by admin, role-based commission (Super 5%, Core 10%, Dept 20%)"}, "purchase": {"name": "purchase.html", "code": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>KALI LIFE ECOSYSTEM - Purchase<\/title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}\nbody{background:#eef3f8;padding:20px;}\n.container{max-width:900px;margin:auto;background:#fff;padding:25px;border-radius:15px;box-shadow:0 0 20px rgba(0,0,0,.15);}\nh1{text-align:center;color:#006400;margin-bottom:10px;}\nh2{text-align:center;color:#0055aa;margin-bottom:25px;}\nh3{margin:18px 0 6px;color:#1a2320;}\nhr{margin:18px 0;border:0;border-top:1px solid  Price (per piece) *<\/label>\n    <input type=\"number\" id=\"buyPrice\" inputmode=\"decimal\" min=\"0\" step=\"any\" placeholder=\"Bought at\">\n  <\/div>\n<\/div>\n\n<div class=\"calc\"><span>Total Cost<\/span><span id=\"totalView\">₹0<\/span><\/div>\n\n<label>Remarks<\/label>\n<textarea id=\"remarks\" rows=\"2\" placeholder=\"Remarks\"><\/textarea>\n\n<button type=\"button\" id=\"savePurchase\">Save Purchase<\/button>\n\n<hr>\n\n<h3>My Purchases<\/h3>\n<div class=\"sum\">\n  <div>Entries<b id=\"sumCount\">0<\/b><\/div>\n  <div>Total Cost<b id=\"sumCost\">₹0<\/b><\/div>\n<\/div>\n<div id=\"list\"><p class=\"empty\">Loading...<\/p><\/div>\n\n<button type=\"button\" id=\"backBtn\" style=\"background:#1a2320;\">Back to Dashboard<\/button>\n<\/div>\n\n<script type=\"module\">\nimport { initializeApp } from \"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js\";\nimport { getAuth, onAuthStateChanged } from \"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js\";\nimport { getFirestore, collection, addDoc, getDocs, query, where }\n  from \"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js\";\n\n// Paste your firebaseConfig from login.html here (exactly the same)\nconst firebaseConfig = {\n  apiKey: \"PASTE_HERE\",\n  authDomain: \"kali-life-ecosystem.firebaseapp.com\",\n  projectId: \"PASTE_HERE\",\n  storageBucket: \"PASTE_HERE\",\n  messagingSenderId: \"PASTE_HERE\",\n  appId: \"PASTE_HERE\"\n};\n\n// Only Super Admin can enter purchases (same rule as the old page)\nif ((localStorage.getItem(\"userRole\") || \"\") !== \"Super Admin\") {\n  alert(\"Access Denied!\");\n  location.href = \"admin-dashboard.html\";\n}\n\nconst app = initializeApp(firebaseConfig);\nconst auth = getAuth(app);\nconst db = getFirestore(app);\n\nconst $ = (id) => document.getElementById(id);\nconst num = (id) => parseFloat($(id).value) || 0;\nconst money = (n) => \"₹\" + (Math.round(n * 100) / 100).toLocaleString(\"en-IN\");\nlet user = null;\n\n$(\"purchaseId\")
