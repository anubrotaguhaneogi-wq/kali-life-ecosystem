<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login - KALI LIFE ECOSYSTEM</title>

<style>

/* ==========================================
   KALI LIFE ECOSYSTEM
   ADMIN LOGIN
   PREMIUM FINAL DESIGN
========================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    background:
        linear-gradient(
            135deg,
            #064e3b,
            #166534,
            #0f172a
        );
}

/* ==========================================
   LOGIN CARD
========================================== */

.login-box {

    width: 100%;
    max-width: 430px;

    background: #ffffff;

    padding: 32px;

    border-radius: 20px;

    box-shadow:
        0 20px 50px rgba(0,0,0,0.28);

    text-align: center;
}

/* ==========================================
   BRAND
========================================== */

.logo {

    color: #166534;

    font-size: 28px;

    font-weight: bold;

    letter-spacing: 0.5px;

}

.subtitle {

    margin-top: 6px;

    color: #64748b;

    font-size: 13px;

}

/* ==========================================
   TITLE
========================================== */

.login-title {

    margin-top: 25px;
    margin-bottom: 22px;

    color: #0f172a;

    font-size: 22px;

}

/* ==========================================
   FORM GROUP
========================================== */

.form-group {

    text-align: left;

    margin-bottom: 17px;

}

label {

    display: block;

    margin-bottom: 7px;

    color: #334155;

    font-size: 14px;

    font-weight: bold;

}

/* ==========================================
   INPUT
========================================== */

input {

    width: 100%;

    padding: 14px;

    border: 1px solid #cbd5e1;

    border-radius: 9px;

    background: #ffffff;

    color: #0f172a;

    font-size: 15px;

    outline: none;

    transition: 0.2s;

}

input::placeholder {

    color: #94a3b8;

}

input:focus {

    border-color: #16a34a;

    box-shadow:
        0 0 0 3px rgba(22,163,74,0.12);

}

/* ==========================================
   PASSWORD
========================================== */

.password-box {

    position: relative;

}

.password-box input {

    padding-right: 70px;

}

.show-password {

    position: absolute;

    right: 10px;

    top: 50%;

    transform: translateY(-50%);

    border: none;

    background: transparent;

    color: #166534;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;

}

/* ==========================================
   LOGIN BUTTON
========================================== */

.login-btn {

    width: 100%;

    padding: 14px;

    margin-top: 5px;

    border: none;

    border-radius: 9px;

    background: #16a34a;

    color: #ffffff;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;

}

.login-btn:hover {

    background: #15803d;

}

.login-btn:disabled {

    background: #94a3b8;

    cursor: not-allowed;

}

/* ==========================================
   ERROR
========================================== */

#error {

    min-height: 20px;

    margin-top: 13px;

    color: #dc2626;

    font-size: 14px;

    font-weight: bold;

}

/* ==========================================
   SECURITY MESSAGE
========================================== */

.security-box {

    margin-top: 20px;

    padding: 11px;

    border-radius: 8px;

    background: #f0fdf4;

    color: #166534;

    font-size: 12px;

    line-height: 1.5;

}

/* ==========================================
   BACK HOME
========================================== */

.back-btn {

    display: block;

    margin-top: 18px;

    color: #166534;

    text-decoration: none;

    font-size: 14px;

    font-weight: bold;

}

.back-btn:hover {

    text-decoration: underline;

}

/* ==========================================
   FOOTER
========================================== */

.footer {

    margin-top: 18px;

    color: #94a3b8;

    font-size: 11px;

}

/* ==========================================
   MOBILE
========================================== */

@media (max-width: 500px) {

    body {

        padding: 12px;

    }

    .login-box {

        padding: 25px 20px;

        border-radius: 16px;

    }

    .logo {

        font-size: 24px;

    }

    .login-title {

        font-size: 20px;

    }

}

</style>

</head>


<body>


<div class="login-box">


    <!-- ======================================
         BRAND
    ======================================= -->

    <div class="logo">

        KALI LIFE ECOSYSTEM

    </div>


    <div class="subtitle">

        Administration & Management System

    </div>


    <h2 class="login-title">

        🔐 Admin Login

    </h2>


    <!-- ======================================
         USERNAME / EMAIL / MOBILE
    ======================================= -->

    <div class="form-group">

        <label for="username">

            Admin Email or Mobile

        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter Email or Mobile"
            autocomplete="username">

    </div>


    <!-- ======================================
         PASSWORD
    ======================================= -->

    <div class="form-group">

        <label for="password">

            Password

        </label>


        <div class="password-box">

            <input
                type="password"
                id="password"
                placeholder="Enter Admin Password"
                autocomplete="current-password">


            <button
                type="button"
                class="show-password"
                id="showPasswordBtn"
                onclick="togglePassword()">

                Show

            </button>

        </div>

    </div>


    <!-- ======================================
         LOGIN
    ======================================= -->

    <button
        type="button"
        class="login-btn"
        id="loginBtn"
        onclick="login()">

        Login

    </button>


    <p id="error"></p>


    <!-- ======================================
         SECURITY
    ======================================= -->

    <div class="security-box">

        🔐 Authorized Admin Access Only

        <br>

        Your role determines which
        dashboard and features you can access.

    </div>


    <a
        href="index.html"
        class="back-btn">

        ⬅ Back to Home

    </a>


    <div class="footer">

        © KALI LIFE ECOSYSTEM -
        Admin Management System

    </div>


</div>


<script>

/* ==========================================
   PASSWORD SHOW / HIDE
========================================== */

function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.getElementById(
            "showPasswordBtn"
        );


    if (
        password.type === "password"
    ) {

        password.type = "text";

        button.innerText = "Hide";

    }

    else {

        password.type = "password";

        button.innerText = "Show";

    }

}


/* ==========================================
   ADMIN LOGIN
========================================== */

function login() {

    const username =
        document.getElementById(
            "username"
        )
        .value
        .trim()
        .toLowerCase();


    const password =
        document.getElementById(
            "password"
        )
        .value;


    const error =
        document.getElementById(
            "error"
        );


    const button =
        document.getElementById(
            "loginBtn"
        );


    error.innerText = "";


    /* ======================================
       VALIDATION
    ======================================= */

    if (!username) {

        error.innerText =
            "Please enter Admin Email or Mobile.";

        return;

    }


    if (!password) {

        error.innerText =
            "Please enter Admin Password.";

        return;

    }


    /* ======================================
       LOAD ADMINS
    ======================================= */

    let admins = [];

    try {

        admins =
            JSON.parse(
                localStorage.getItem(
                    "admins"
                )
            ) || [];

    }

    catch (e) {

        error.innerText =
            "Admin data could not be loaded.";

        return;

    }


    /* ======================================
       FIND ADMIN
    ======================================= */

    const admin =
        admins.find(function(item) {

            const email =
                String(
                    item.email || ""
                )
                .trim()
                .toLowerCase();


            const mobile =
                String(
                    item.mobile || ""
                )
                .trim();


            return (
                email === username ||
                mobile === username
            );

        });


    if (!admin) {

        error.innerText =
            "Admin account not found.";

        return;

    }


    /* ======================================
       STATUS CHECK
    ======================================= */

    if (
        String(
            admin.status || ""
        ).toLowerCase() !== "active"
    ) {

        error.innerText =
            "This Admin account is inactive.";

        return;

    }


    /* ======================================
       PASSWORD CHECK
    ======================================= */

    if (
        String(
            admin.password || ""
        ) !== password
    ) {

        error.innerText =
            "Incorrect Admin password.";

        return;

    }


    /* ======================================
       LOGIN SESSION
    ======================================= */

    button.disabled = true;

    button.innerText =
        "Logging in...";


    localStorage.setItem(
        "isLoggedIn",
        "true"
    );


    localStorage.setItem(
        "userName",
        admin.fullName || "Administrator"
    );


    localStorage.setItem(
        "userMobile",
        admin.mobile || ""
    );


    localStorage.setItem(
        "userEmail",
        admin.email || ""
    );


    localStorage.setItem(
        "userRole",
        admin.role || "Admin"
    );


    localStorage.setItem(
        "adminId",
        admin.id || ""
    );


    localStorage.setItem(
        "adminReportsTo",
        admin.reportsTo || ""
    );


    /* ======================================
       ROLE BASED REDIRECT
    ======================================= */

    setTimeout(function() {

        if (
            admin.role ===
            "Super Admin"
        ) {

            window.location.href =
                "super-admin-dashboard.html";

        }

        else {

            window.location.href =
                "admin-dashboard.html";

        }

    }, 500);

}


/* ==========================================
   ENTER KEY LOGIN
========================================== */

document.getElementById(
    "password"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            login();

        }

    }
);

</script>


</body>

</html>
