/* =========================================================
   INITIALIZE FIREBASE
========================================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================================================
   COMMISSION SETTINGS
========================================================= */

const COMMISSION = {

    department: 20,

    core: 10,

    super: 5

};


/* =========================================================
   COMMON HELPERS
========================================================= */

const $ = id => document.getElementById(id);

let currentUser = null;

let currentAdmin = null;

let currentCoreAdmin = null;

let currentSuperAdmin = null;


/* Clean text */

function clean(v){

    return String(v ?? "").trim();

}


/* Normalize role */

function role(v){

    return clean(v)
        .toLowerCase()
        .replace(/\s+/g," ");

}


/* Check Department Admin */

function isDept(v){

    return role(v).includes("department admin");

}


/* Commission calculator */

function commission(amount,pct){

    return Number(
        (
            (Number(amount) || 0) *
            pct /
            100
        ).toFixed(2)
    );

}


/* Escape HTML */

function escapeHtml(v){

    return String(v ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* Message */

function message(text,type){

    $("message").textContent = text;

    $("message").className =
        "message " + type;

}


/* =========================================================
   AMOUNT CALCULATION
========================================================= */

function amountCalc(){

    const q =
        Number($("quantity").value) || 0;

    const r =
        Number($("rate").value) || 0;

    $("amount").value =
        q > 0 && r > 0
            ? (q * r).toFixed(2)
            : "";

}


$("quantity").addEventListener(
    "input",
    amountCalc
);

$("rate").addEventListener(
    "input",
    amountCalc
);


/* =========================================================
   MOBILE NUMBER VALIDATION
========================================================= */

$("customerMobile").addEventListener(
    "input",
    e => {

        e.target.value =
            e.target.value
            .replace(/\D/g,"")
            .slice(0,10);

    }
);


/* =========================================================
   FIND USER PROFILE
========================================================= */

async function profile(user){

    try{

        const direct =
            await getDoc(
                doc(
                    db,
                    "users",
                    user.uid
                )
            );

        if(direct.exists()){

            return {
                id: direct.id,
                data: direct.data()
            };

        }

    }catch(e){

        console.warn(
            "UID profile:",
            e.message
        );

    }


    if(user.email){

        try{

            const q =
                query(
                    collection(db,"users"),
                    where(
                        "email",
                        "==",
                        user.email
                    )
                );

            const s =
                await getDocs(q);

            if(!s.empty){

                return {
                    id: s.docs[0].id,
                    data: s.docs[0].data()
                };

            }

        }catch(e){

            console.warn(
                "Email profile:",
                e.message
            );

        }

    }


    return {
        id: user.uid,
        data: {}
    };

}


/* =========================================================
   FIND USER BY ID
========================================================= */

async function byId(value){

    if(!value) return null;


    try{

        const s =
            await getDoc(
                doc(
                    db,
                    "users",
                    value
                )
            );

        if(s.exists()){

            return {
                id:s.id,
                data:s.data()
            };

        }

    }catch(e){}


    try{

        const q =
            query(
                collection(db,"users"),
                where(
                    "uid",
                    "==",
                    value
                )
            );

        const s =
            await getDocs(q);

        if(!s.empty){

            return {
                id:s.docs[0].id,
                data:s.docs[0].data()
            };

        }

    }catch(e){}


    return null;

}


/* =========================================================
   LOAD ADMIN HIERARCHY
========================================================= */

async function loadHierarchy(user){

    const p =
        await profile(user);

    const d =
        p.data || {};


    /* Current Department Admin */

    currentAdmin = {

        uid:user.uid,

        docId:p.id,

        name:
            clean(d.name) ||
            user.displayName ||
            user.email ||
            user.uid,

        roleType:
            clean(
                d.roleType ||
                d.role ||
                "User"
            ),

        department:
            clean(d.department),

        reportsTo:
            clean(d.reportsTo),

        mobile:
            clean(d.mobile),

        email:
            clean(
                d.email ||
                user.email
            )

    };


    currentCoreAdmin = null;

    currentSuperAdmin = null;


    /* =====================================================
       FIND CORE ADMIN
    ===================================================== */

    if(
        isDept(
            currentAdmin.roleType
        )
    ){

        let coreRef =
            d.coreAdminId ||
            d.coreAdminUID ||
            d.reportsTo;


        if(coreRef){

            const cp =
                await byId(coreRef);

            if(cp){

                const cd =
                    cp.data || {};


                if(
                    role(
                        cd.roleType ||
                        cd.role
                    ).includes(
                        "core admin"
                    )
                ){

                    currentCoreAdmin = {

                        uid:cp.id,

                        name:
                            clean(cd.name) ||
                            "Core Admin",

                        roleType:
                            clean(
                                cd.roleType ||
                                cd.role
                            ) ||
                            "Core Admin",

                        department:
                            clean(cd.department),

                        reportsTo:
                            clean(cd.reportsTo),

                        email:
                            clean(cd.email)

                    };

                }

            }

        }


        /* =================================================
           FIND SUPER ADMIN
        ================================================= */

        if(
            currentCoreAdmin?.reportsTo
        ){

            const sp =
                await byId(
                    currentCoreAdmin.reportsTo
                );


            if(sp){

                const sd =
                    sp.data || {};


                currentSuperAdmin = {

                    uid:sp.id,

                    name:
                        clean(sd.name) ||
                        "Super Admin",

                    roleType:
                        clean(
                            sd.roleType ||
                            sd.role
                        ) ||
                        "Super Admin",

                    department:
                        clean(sd.department),

                    reportsTo:
                        clean(sd.reportsTo),

                    email:
                        clean(sd.email)

                };

            }

        }

    }


    /* =====================================================
       DISPLAY ADMIN INFORMATION
    ===================================================== */

    $("adminName").textContent =
        currentAdmin.name;

    $("adminId").textContent =
        currentAdmin.uid;

    $("role").textContent =
        currentAdmin.roleType;

    $("department").textContent =
        currentAdmin.department ||
        "Not Set";

    $("reportsTo").textContent =
        currentAdmin.reportsTo ||
        "Not Set";


    /* =====================================================
       DEPARTMENT ADMIN CHECK
    ===================================================== */

    if(
        !isDept(
            currentAdmin.roleType
        )
    ){

        $("saveButton").disabled = true;

        $("saveButton").textContent =
            "Department Admin Only";

        message(
            "This page is for Department Admin only.",
            "error"
        );

        return false;

    }


    $("saveButton").disabled = false;

    $("saveButton").textContent =
        "Save Sale";

    return true;

}


/* =========================================================
   LOAD MY SALES
========================================================= */

async function loadMySales(){

    if(!currentUser) return;


    $("salesList").innerHTML =
        '<div class="loading">Loading sales...</div>';


    try{

        const q =
            query(
                collection(db,"sales"),
                where(
                    "adminId",
                    "==",
                    currentUser.uid
                )
            );


        const snap =
            await getDocs(q);


        if(snap.empty){

            $("salesList").innerHTML =
                '<div class="loading">No sales recorded yet.</div>';

            return;

        }


        const sales =
            snap.docs.map(
                d => ({
                    id:d.id,
                    ...d.data()
                })
            );


        /* Sort latest first */

        sales.sort((a,b) => {

            const at =
                a.createdAt?.toMillis
                    ? a.createdAt.toMillis()
                    : 0;

            const bt =
                b.createdAt?.toMillis
                    ? b.createdAt.toMillis()
                    : 0;

            return bt - at;

        });


        $("salesList").innerHTML =
            sales.map(s => {

                const c =
                    s.commissionAmount || {};


                return `

                <div class="sale">

                    <strong>
                        ${escapeHtml(
                            s.itemName || ""
                        )}
                    </strong>

                    <br>

                    Customer:
                    ${escapeHtml(
                        s.customerName || ""
                    )}

                    <br>

                    Mobile:
                    ${escapeHtml(
                        s.customerMobile || ""
                    )}

                    <br>

                    Quantity:
                    ${Number(
                        s.quantity || 0
                    )}
                    ×
                    ₹${Number(
                        s.rate || 0
                    ).toFixed(2)}

                    <br>

                    <strong>
                        Amount:
                        ₹${Number(
                            s.amount ||
                            s.totalSale ||
                            0
                        ).toFixed(2)}
                    </strong>


                    <div class="comm">

                        Department 20%:
                        ₹${Number(
                            c.departmentAdmin ??
                            s.departmentAdminCommission ??
                            0
                        ).toFixed(2)}

                        <br>

                        Core 10%:
                        ₹${Number(
                            c.coreAdmin ??
                            s.coreAdminCommission ??
                            0
                        ).toFixed(2)}

                        <br>

                        Super 5%:
                        ₹${Number(
                            c.superAdmin ??
                            s.superAdminCommission ??
                            0
                        ).toFixed(2)}

                    </div>

                </div>

                `;

            }).join("");


    }catch(e){

        console.error(
            "Load sales:",
            e
        );


        $("salesList").innerHTML =

            '<div class="loading">' +
            'Unable to load sales: ' +
            escapeHtml(e.message) +
            '</div>';

    }

}
