<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sales Management - KALI LIFE ECOSYSTEM</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7f5;
    color:#222;
}

.header{
    background:#16834b;
    color:white;
    padding:18px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:24px;
}

.header p{
    margin:5px 0 0;
    font-size:14px;
}

.container{
    max-width:650px;
    margin:25px auto;
    padding:15px;
}

.card{
    background:white;
    padding:22px;
    border-radius:14px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
    color:#16834b;
}

.admin-box{
    background:#eef8f2;
    padding:12px;
    border-radius:8px;
    margin-bottom:18px;
    font-size:14px;
}

label{
    display:block;
    margin-top:14px;
    margin-bottom:6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:#16834b;
}

.amount-box{
    background:#f1f8f4;
}

button{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#16834b;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#116b3d;
}

button:disabled{
    background:#999;
}

.message{
    margin-top:15px;
    padding:10px;
    border-radius:8px;
    text-align:center;
    display:none;
}

.success{
    display:block;
    background:#e5f7eb;
    color:#126b38;
}

.error{
    display:block;
    background:#fdeaea;
    color:#b00020;
}

.sales-list{
    margin-top:25px;
}

.sale-row{
    background:#fff;
    padding:15px;
    margin-top:10px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.sale-row strong{
    color:#16834b;
}

.loading{
    text-align:center;
    color:#777;
    padding:15px;
}
</style>
</head>

<body>

<div class="header">
    <h1>KALI LIFE ECOSYSTEM</h1>
    <p>Sales Management</p>
</div>

<div class="container">

<div class="card">

<h2>Sales Entry</h2>

<div class="admin-box">
    <strong>Admin:</strong>
    <span id="adminName">Loading...</span>
    <br>
    <strong>Admin ID:</strong>
    <span id="adminId">Loading...</span>
</div>

<label for="customerName">Customer Name</label>
<input
    type="text"
    id="customerName"
    placeholder="Enter customer name"
>

<label for="customerMobile">Customer Mobile</label>
<input
    type="tel"
    id="customerMobile"
    inputmode="numeric"
    maxlength="10"
    placeholder="Enter mobile number"
>

<label for="itemName">Item Name</label>
<input
    type="text"
    id="itemName"
    placeholder="Enter item name"
>

<label for="quantity">Quantity</label>
<input
    type="number"
    id="quantity"
    min="1"
    step="1"
    placeholder="Enter quantity"
>

<label for="rate">Rate</label>
<input
    type="number"
    id="rate"
    min="0"
    step="0.01"
    placeholder="Enter rate"
>

<label for="amount">Amount</label>
<input
    type="number"
    id="amount"
    class="amount-box"
    readonly
    placeholder="Automatically calculated"
>

<button id="saveButton">
    Save Sale
</button>

<div id="message" class="message"></div>

</div>

<div class="card sales-list">

<h2>My Sales</h2>

<div id="salesList">
    <div class="loading">Loading sales...</div>
</div>

</div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    getDoc,
    doc,
    query,
    where
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* ==========================================
   FIREBASE CONFIG
========================================== */

const firebaseConfig = {
    apiKey: "AIzaSyDqXcxTrI22Ju1Rj9mtbUSCjGkT7B_OxZo",
    authDomain: "kali-life-ecosystem.firebaseapp.com",
    projectId: "kali-life-ecosystem",
    storageBucket: "kali-life-ecosystem.firebasestorage.app",
    messagingSenderId: "734170546737",
    appId: "1:734170546737:web:26f79e1b4b19ebabfe0b10",
    measurementId: "G-LBEY0W7RX3"
};


/* ==========================================
   FIREBASE INITIALIZE
========================================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ==========================================
   ELEMENTS
========================================== */

const adminNameEl = document.getElementById("adminName");
const adminIdEl = document.getElementById("adminId");

const customerNameEl =
    document.getElementById("customerName");

const customerMobileEl =
    document.getElementById("customerMobile");

const itemNameEl =
    document.getElementById("itemName");

const quantityEl =
    document.getElementById("quantity");

const rateEl =
    document.getElementById("rate");

const amountEl =
    document.getElementById("amount");

const saveButton =
    document.getElementById("saveButton");

const messageEl =
    document.getElementById("message");

const salesListEl =
    document.getElementById("salesList");


let currentUser = null;
let currentAdminName = "";


/* ==========================================
   AMOUNT CALCULATION
========================================== */

function calculateAmount(){

    const quantity =
        Number(quantityEl.value) || 0;

    const rate =
        Number(rateEl.value) || 0;

    const amount =
        quantity * rate;

    amountEl.value =
        amount > 0 ? amount.toFixed(2) : "";
}

quantityEl.addEventListener(
    "input",
    calculateAmount
);

rateEl.addEventListener(
    "input",
    calculateAmount
);


/* ==========================================
   MESSAGE
========================================== */

function showMessage(text,type){

    messageEl.textContent = text;

    messageEl.className =
        "message " + type;

}


/* ==========================================
   AUTHENTICATION
========================================== */

onAuthStateChanged(auth, async (user) => {

    if(!user){

        window.location.href = "login.html";

        return;
    }

    try{

        currentUser = user;

        adminIdEl.textContent =
            user.uid;

        const userRef =
            doc(db,"users",user.uid);

        const userSnap =
            await getDoc(userRef);

        let userData = {};

        if(userSnap.exists()){

            userData =
                userSnap.data();

        }

        currentAdminName =
            userData.name ||
            user.displayName ||
            user.email ||
            user.uid;

        adminNameEl.textContent =
            currentAdminName;

        await loadMySales();

    }
    catch(error){

        console.error(error);

        showMessage(
            "Unable to load admin information.",
            "error"
        );

    }

});


/* ==========================================
   SAVE SALE
========================================== */

saveButton.addEventListener(
    "click",
    async () => {

        if(!currentUser){

            showMessage(
                "Admin login required.",
                "error"
            );

            return;
        }


        const customerName =
            customerNameEl.value.trim();

        const customerMobile =
            customerMobileEl.value.trim();

        const itemName =
            itemNameEl.value.trim();

        const quantity =
            Number(quantityEl.value);

        const rate =
            Number(rateEl.value);

        const amount =
            quantity * rate;


        /* VALIDATION */

        if(!customerName){

            showMessage(
                "Customer Name is required.",
                "error"
            );

            return;
        }

        if(!customerMobile){

            showMessage(
                "Customer Mobile is required.",
                "error"
            );

            return;
        }

        if(!itemName){

            showMessage(
                "Item Name is required.",
                "error"
            );

            return;
        }

        if(!quantity || quantity <= 0){

            showMessage(
                "Enter a valid quantity.",
                "error"
            );

            return;
        }

        if(!rate || rate < 0){

            showMessage(
                "Enter a valid rate.",
                "error"
            );

            return;
        }


        saveButton.disabled = true;

        saveButton.textContent =
            "Saving...";


        try{

            const now = new Date();


            /* ======================================
               SAVE TO FIRESTORE
            ====================================== */

            await addDoc(
                collection(db,"sales"),
                {

                    adminId:
                        currentUser.uid,

                    adminName:
                        currentAdminName,

                    customerName:
                        customerName,

                    customerMobile:
                        customerMobile,

                    itemName:
                        itemName,

                    quantity:
                        quantity,

                    rate:
                        rate,

                    amount:
                        amount,

                    createdAt:
                        now.getTime(),

                    dateText:
                        now.toLocaleDateString(
                            "en-IN"
                        )

                }
            );


            showMessage(
                "Sale saved successfully.",
                "success"
            );


            /* CLEAR FORM */

            customerNameEl.value = "";

            customerMobileEl.value = "";

            itemNameEl.value = "";

            quantityEl.value = "";

            rateEl.value = "";

            amountEl.value = "";


            await loadMySales();


        }
        catch(error){

            console.error(error);

            showMessage(
                "Sale could not be saved. Check Firebase.",
                "error"
            );

        }


        saveButton.disabled = false;

        saveButton.textContent =
            "Save Sale";

    }
);


/* ==========================================
   LOAD ADMIN SALES
========================================== */

async function loadMySales(){

    if(!currentUser){

        return;
    }


    salesListEl.innerHTML =
        '<div class="loading">Loading sales...</div>';


    try{

        const salesQuery =
            query(
                collection(db,"sales"),
                where(
                    "adminId",
                    "==",
                    currentUser.uid
                )
            );


        const snapshot =
            await getDocs(salesQuery);


        if(snapshot.empty){

            salesListEl.innerHTML =
                '<div class="loading">No sales found.</div>';

            return;
        }


        const sales = [];


        snapshot.forEach(
            (saleDoc) => {

                sales.push(
                    saleDoc.data()
                );

            }
        );


        sales.sort(
            (a,b) =>
                (b.createdAt || 0) -
                (a.createdAt || 0)
        );


        salesListEl.innerHTML = "";


        sales.forEach(
            (sale) => {

                const row =
                    document.createElement("div");

                row.className =
                    "sale-row";


                row.innerHTML = `

                    <strong>
                        ${escapeHtml(
                            sale.itemName
                        )}
                    </strong>

                    <br>

                    Customer:
                    ${escapeHtml(
                        sale.customerName
                    )}

                    <br>

                    Mobile:
                    ${escapeHtml(
                        sale.customerMobile
                    )}

                    <br>

                    Quantity:
                    ${sale.quantity}

                    × ₹${Number(
                        sale.rate
                    ).toFixed(2)}

                    <br>

                    <strong>
                        Amount:
                        ₹${Number(
                            sale.amount
                        ).toFixed(2)}
                    </strong>

                    <br>

                    Date:
                    ${escapeHtml(
                        sale.dateText || ""
                    )}

                `;


                salesListEl.appendChild(row);

            }
        );

    }
    catch(error){

        console.error(error);

        salesListEl.innerHTML =
            '<div class="loading">Unable to load sales.</div>';

    }

}


/* ==========================================
   SECURITY
   ========================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   MOBILE NUMBER
========================================== */

customerMobileEl.addEventListener(
    "input",
    function(){

        this.value =
            this.value
            .replace(/\D/g,"")
            .slice(0,10);

    }
);

</script>

</body>
</html>
