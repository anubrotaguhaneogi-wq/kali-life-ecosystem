<!DOCTYPE html>

<!--

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>View Admin - KALI LIFE ECOSYSTEM</title>


    <!-- ==========================================
         AUTHENTICATION SYSTEM
    ========================================== -->

    <script src="auth.js"></script>


    <!-- ==========================================
         PAGE STYLE
    ========================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }


        .page-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }


        .admin-card {
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }


        /* ==========================================
           HEADER
        ========================================== */

        .card-header {
            background: #1f2937;
            color: #ffffff;
            padding: 25px;
        }


        .card-header h1 {
            margin: 0;
            font-size: 26px;
        }


        .card-header p {
            margin: 8px 0 0;
            font-size: 14px;
            color: #d1d5db;
        }


        /* ==========================================
           ADMIN DETAILS
        ========================================== */

        .admin-details {
            padding: 25px;
        }


        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 17px 0;
            border-bottom: 1px solid #e5e7eb;
        }


        .detail-row:last-child {
            border-bottom: none;
        }


        .detail-label {
            font-weight: bold;
            color: #374151;
        }


        .detail-value {
            text-align: right;
            color: #111827;
            word-break: break-word;
        }


        /* ==========================================
           STATUS
        ========================================== */

        .status-active {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-size: 13px;
            font-weight: bold;
        }


        .status-inactive {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            background: #fee2e2;
            color: #991b1b;
            font-size: 13px;
            font-weight: bold;
        }


        /* ==========================================
           ERROR MESSAGE
        ========================================== */

        .message {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: #9a3412;
            display: none;
            font-weight: bold;
        }


        /* ==========================================
           FOOTER
        ========================================== */

        .card-footer {
            padding: 20px 25px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
        }


        .back-button {
            width: 100%;
            padding: 13px 18px;
            border: none;
            border-radius: 7px;
            background: #1f2937;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }


        .back-button:hover {
            background: #374151;
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .page-container {
                margin: 15px auto;
                padding: 12px;
            }


            .card-header {
                padding: 20px;
            }


            .card-header h1 {
                font-size: 22px;
            }


            .admin-details {
                padding: 20px;
            }


            .detail-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }


            .detail-value {
                text-align: left;
                width: 100%;
            }


            .card-footer {
                padding: 15px 20px;
            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         LOGIN & ROLE SECURITY
         ONLY SUPER ADMIN CAN ACCESS
    ========================================== -->

    <script>

        checkLogin();

        checkRole("Super Admin");

    </script>


    <!-- ==========================================
         MAIN CONTAINER
    ========================================== -->

    <div class="page-container">


        <div class="admin-card">


            <!-- ==========================================
                 HEADER
            ========================================== -->

            <div class="card-header">

                <h1>Admin Details</h1>

                <p>
                    KALI LIFE ECOSYSTEM - Admin Management
                </p>

            </div>


            <!-- ==========================================
                 ADMIN INFORMATION
            ========================================== -->

            <div class="admin-details">


                <!-- ERROR -->

                <div
                    id="errorMessage"
                    class="message"
                ></div>


                <!-- ADMIN ID -->

                <div class="detail-row">

                    <span class="detail-label">
                        Admin ID
                    </span>

                    <span
                        id="adminId"
                        class="detail-value"
                    >
                        -
                    </span>

                </div>


                <!-- NAME -->

                <div class="detail-row">

                    <span class="detail-label">
                        Name
                    </span>

                    <span
                        id="adminName"
                        class="detail-value"
                    >
                        -
                    </span>

                </div>


                <!-- ROLE -->

                <div class="detail-row">

                    <span class="detail-label">
                        Role
                    </span>

                    <span
                        id="adminRole"
                        class="detail-value"
                    >
                        -
                    </span>

                </div>


                <!-- REPORTS TO -->

                <div class="detail-row">

                    <span class="detail-label">
                        Reports To
                    </span>

                    <span
                        id="adminReportsTo"
                        class="detail-value"
                    >
                        -
                    </span>

                </div>


                <!-- STATUS -->

                <div class="detail-row">

                    <span class="detail-label">
                        Status
                    </span>

                    <span
                        id="adminStatus"
                        class="detail-value"
                    >
                        -
                    </span>

                </div>


            </div>


            <!-- ==========================================
                 FOOTER
            ========================================== -->

            <div class="card-footer">

                <button
                    type="button"
                    class="back-button"
                    onclick="goBack()"
                >
                    ← Back to Admin List
                </button>

            </div>


        </div>

    </div>


    <!-- ==========================================
         VIEW ADMIN JAVASCRIPT
    ========================================== -->

    <script>


        // ==========================================
        // GET INDEX FROM URL
        // ==========================================

        const params =
            new URLSearchParams(
                window.location.search
            );


        const adminIndex =
            Number(params.get("id"));


        // ==========================================
        // GET ADMIN DATA
        // ==========================================

        const admins =
            JSON.parse(
                localStorage.getItem("admins")
            ) || [];


        // ==========================================
        // ERROR ELEMENT
        // ==========================================

        const errorMessage =
            document.getElementById(
                "errorMessage"
            );


        // ==========================================
        // CHECK ADMIN INDEX
        // ==========================================

        if (
            !Number.isInteger(adminIndex) ||
            adminIndex < 0 ||
            adminIndex >= admins.length
        ) {

            errorMessage.textContent =
                "Admin information was not found.";

            errorMessage.style.display =
                "block";

        } else {


            // ==========================================
            // GET SELECTED ADMIN
            // ==========================================

            const admin =
                admins[adminIndex];


            // ==========================================
            // ADMIN ID
            // ==========================================

            document.getElementById(
                "adminId"
            ).textContent =
                admin.id || "-";


            // ==========================================
            // ADMIN NAME
            // ==========================================

            document.getElementById(
                "adminName"
            ).textContent =
                admin.fullName || "-";


            // ==========================================
            // ADMIN ROLE
            // ==========================================

            document.getElementById(
                "adminRole"
            ).textContent =
                admin.role || "-";


            // ==========================================
            // REPORTS TO
            // ==========================================

            document.getElementById(
                "adminReportsTo"
            ).textContent =
                admin.reportsTo || "-";


            // ==========================================
            // ADMIN STATUS
            // ==========================================

            const statusElement =
                document.getElementById(
                    "adminStatus"
                );


            const status =
                admin.status || "Inactive";


            statusElement.textContent =
                status;


            // ==========================================
            // STATUS STYLE
            // ==========================================

            if (
                status.toLowerCase() === "active"
            ) {

                statusElement.classList.add(
                    "status-active"
                );

            } else {

                statusElement.classList.add(
                    "status-inactive"
                );

            }

        }


        // ==========================================
        // BACK TO ADMIN LIST
        // ==========================================

        function goBack() {

            window.location.href =
                "admin-list.html";

        }


    </script>


</body>

</html>
