<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin List - KALI LIFE ECOSYSTEM</title>
    <script src="auth.js"></script>
</head>

<body>
<script>
checkLogin();
checkRole("Super Admin");
</script>
<h1>KALI LIFE ECOSYSTEM</h1>
<h2>Admin List</h2>

<hr>

<table border="1" cellpadding="10" id="adminTable">
<tr>
    <th>SL</th>
    <th>Admin ID</th>
    <th>Name</th>
    <th>Role</th>
    <th>Reports To</th>
    <th>Status</th>
    <th>View</th>
    <th>Edit</th>
    <th>Delete</th>
</tr>
<tbody id="adminTableBody">
</tbody>
</table>
<div style="margin:15px 0;">
<input
type="text"
id="searchAdmin"
placeholder="Search Admin..."
onkeyup="searchAdmin()"
style="width:250px;padding:10px;">
</div>
    <button onclick="window.location.href='admin-dashboard.html'">
Home
</button>

<button onclick="window.location.href='create-admin.html'">
Create Admin
</button>
<hr>

<p>© KALI LIFE ECOSYSTEM - Admin Management System</p>


<script>

function loadAdmins(){

let admins = JSON.parse(localStorage.getItem("admins")) || [];

let table = document.getElementById("adminTableBody");

table.innerHTML = "";

admins.forEach(function(admin,index){

table.innerHTML += `
<tr>
<td>${index+1}</td>

<td>${admin.id}</td>
<td>${admin.fullName}</td>
<td>${admin.role}</td>
<td>${admin.reportsTo}</td>
<td>${admin.status}</td>
<td><button onclick="viewUser(${index})">View</button></td>
<td><button onclick="editUser(${index})">Edit</button></td>
<td><button onclick="deleteUser(${index})">Delete</button></td>
</tr>
`;

});

}

function viewUser(id){
window.location.href="view-admin.html?id="+id;
}

function editUser(id){
window.location.href="edit-admin.html?id="+id;
}

function deleteUser(id){

let admins = JSON.parse(localStorage.getItem("admins")) || [];

if(confirm("Are you sure you want to delete this admin?")){

admins.splice(id,1);

localStorage.setItem("admins",JSON.stringify(admins));

loadAdmins();

}

}

loadAdmins();
function searchAdmin(){

let input=document.getElementById("searchAdmin").value.toLowerCase();

let rows=document.querySelectorAll("#adminTableBody tr");

rows.forEach(function(row){

let text=row.innerText.toLowerCase();

if(text.indexOf(input)>-1){

row.style.display="";

}else{

row.style.display="none";

}

});

}
</script>
</body>

</html>
