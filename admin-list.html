<!-- Admin List JavaScript -->
<script>
// Load All Admins
function loadAdmins(){


// View Admin Details
function viewUser(id){
window.location.href="view-admin.html?id="+id;
}
// Edit Admin Details
function editUser(id){
window.location.href="edit-admin.html?id="+id;
}
// Delete Admin
function deleteUser(id){

let admins = JSON.parse(localStorage.getItem("admins")) || [];

if(confirm("Are you sure you want to delete this admin?")){

admins.splice(id,1);

localStorage.setItem("admins",JSON.stringify(admins));

loadAdmins();

}

}
// Initialize Admin List
loadAdmins();
    // Search Admin
function searchAdmin(){

let input=document.getElementById("searchAdmin").value.toLowerCase();

let rows=document.querySelectorAll("#adminTableBody tr");

rows.forEach(function(row){

let text=row.innerText.toLowerCase();

if(text.indexOf(input)>-1){

row.style.display="";

}else{

row.style.display="none";

}

});

}
</script>
