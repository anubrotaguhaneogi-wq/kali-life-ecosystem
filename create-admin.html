<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Admin | KALI LIFE</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial;background:linear-gradient(135deg,#f0fdf4,#ecfdf5);color:#1f2937}
.card{width:min(560px,94%);margin:35px auto;background:#fff;padding:28px;border-radius:20px;box-shadow:0 12px 35px #0001}
h1{text-align:center;color:#166534;margin:0}
.sub{text-align:center;color:#6b7280;margin:7px 0 25px;font-size:14px}
label{display:block;margin:13px 0 6px;font-weight:600;font-size:14px}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#166534;color:#fff;font-size:16px;font-weight:bold}
button:disabled{opacity:.6}
.msg{display:none;margin-top:14px;padding:11px;border-radius:9px;text-align:center;font-size:14px}
.ok{display:block;background:#dcfce7;color:#166534}
.err{display:block;background:#fee2e2;color:#991b1b}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>

<body>
<div class="card">
<h1>Create Admin</h1>
<div class="sub">KALI LIFE ECOSYSTEM</div>

<form id="form">

<label>Full Name</label>
<input id="name" required>

<div class="grid">
<div>
<label>Mobile Number</label>
<input id="mobile" maxlength="10" inputmode="numeric" required>
</div>
<div>
<label>Email</label>
<input id="email" type="email" required>
</div>
</div>

<label>Password</label>
<input id="password" type="password" minlength="6" required>

<label>Admin Role</label>
<select id="role" required>
<option value="">Select Role</option>
<option value="Core Admin">Core Admin</option>
<option value="Departmental Admin">Departmental Admin</option>
</select>

<label>Department</label>
<select id="department">
<option value="">Select Department</option>
<option>Product</option>
<option>Agriculture</option>
<option>Technology</option>
<option>Marriage</option>
<option>Education</option>
</select>

<label>Reports To</label>
<input id="reportsTo" value="Super Admin" readonly>

<label>Status</label>
<select id="status">
<option value="Active">Active</option>
<option value="Inactive">Inactive</option>
</select>

<button id="btn" type="submit">Create Admin</button>
<div id="msg" class="msg"></div>
</form>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import{
getAuth,onAuthStateChanged,createUserWithEmailAndPassword
}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import{
getFirestore,collection,query,where,getDocs,doc,setDoc,serverTimestamp
}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDqXcxTrI22Ju1Rj9mtbUSCjGkT7B_OxZo",
authDomain:"kali-life-ecosystem.firebaseapp.com",
projectId:"kali-life-ecosystem",
storageBucket:"kali-life-ecosystem.firebasestorage.app",
messagingSenderId:"734170546737",
appId:"1:734170546737:web:26f79e1b4b19ebabfe0b10"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const mainAuth=getAuth(app);
const creatorApp=initializeApp(firebaseConfig,"AdminCreator");
const creatorAuth=getAuth(creatorApp);

const form=document.getElementById("form");
const btn=document.getElementById("btn");
const msg=document.getElementById("msg");

let currentUser=null;

function show(text,type){
msg.textContent=text;
msg.className="msg "+type;
}

function adminId(){
return"ADM-"+Date.now().toString().slice(-8);
}

async function exists(field,value){
const q=query(collection(db,"users"),where(field,"==",value));
const s=await getDocs(q);
return!s.empty;
}

onAuthStateChanged(mainAuth,u=>{
currentUser=u;
});

document.getElementById("role").addEventListener("change",e=>{
const d=document.getElementById("department");
if(e.target.value==="Core Admin"){
d.value="";
d.disabled=true;
}else{
d.disabled=false;
}
});

form.addEventListener("submit",async e=>{
e.preventDefault();

const name=document.getElementById("name").value.trim();
const mobile=document.getElementById("mobile").value.trim();
const email=document.getElementById("email").value.trim().toLowerCase();
const password=document.getElementById("password").value;
const role=document.getElementById("role").value;
const department=document.getElementById("department").value;
const status=document.getElementById("status").value;

if(!currentUser){
show("Please login as an Admin first.","err");
return;
}

if(!/^\d{10}$/.test(mobile)){
show("Enter a valid 10-digit mobile number.","err");
return;
}

if(password.length<6){
show("Password must be at least 6 characters.","err");
return;
}

if(role==="Departmental Admin"&&!department){
show("Department is required.","err");
return;
}

btn.disabled=true;
btn.textContent="Creating...";

try{

if(await exists("mobile",mobile)){
throw new Error("MOBILE_EXISTS");
}

if(await exists("email",email)){
throw new Error("EMAIL_EXISTS");
}

/* Create Firebase Authentication account */
const cred=await createUserWithEmailAndPassword(
creatorAuth,email,password
);

const uid=cred.user.uid;
const id=adminId();

/* Save profile using Firebase UID */
await setDoc(doc(db,"users",uid),{
uid:uid,
adminId:id,
name:name,
mobile:mobile,
email:email,
role:role,
roleType:role,
department:department||"",
reportsTo:role==="Departmental Admin"?currentUser.uid:"",
status:status,
accountType:"Admin",
createdAt:serverTimestamp(),
createdBy:currentUser.uid
});

await creatorAuth.signOut();

show("Admin created successfully. ID: "+id,"ok");
form.reset();
document.getElementById("reportsTo").value="Super Admin";

}catch(error){

console.error(error);

let text="Admin creation failed.";

if(error.message==="MOBILE_EXISTS")
text="This mobile number already exists.";
else if(error.message==="EMAIL_EXISTS")
text="This email already exists.";
else if(error.code==="auth/email-already-in-use")
text="This email already exists in Firebase Authentication.";
else if(error.code==="auth/invalid-email")
text="Invalid email address.";
else if(error.code==="auth/weak-password")
text="Password must contain at least 6 characters.";
else if(error.code==="permission-denied")
text="Firestore permission denied.";
else if(error.message)
text=error.message;

show(text,"err");

}finally{
btn.disabled=false;
btn.textContent="Create Admin";
}
});
</script>
</body>
</html>
