<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Admin - KALI LIFE ECOSYSTEM</title>
</head>

<body>

<h1>KALI LIFE ECOSYSTEM</h1>
<h2>Create New Admin</h2>

<hr>

<form action="#" method="post">

<h3>Personal Information</h3>

<label>Full Name</label><br>
<input type="text" name="fullName" placeholder="Enter Full Name" required>

<label>Email Address</label><br>
<input type="email" name="email" placeholder="Enter Email Address" required>

<label>Mobile Number</label><br>
<input type="tel" name="mobile" placeholder="Enter Mobile Number" required>

<label>Password</label><br>
<input type="password" name="password" placeholder="Create Password" required>

<hr>

<h3>Admin Role</h3>

<label>Select Admin Level</label><br>

<select name="adminRole" required>
    <option value="">-- Select Admin Role --</option>
    <option value="Super Admin">Super Admin</option>
    <option value="Core Admin">Core Admin</option>
    <option value="Operations Admin">Operations Admin</option>
    <option value="Agriculture Admin">Agriculture Admin</option>
    <option value="Business & Marketplace Admin">Business & Marketplace Admin</option>
    <option value="Finance & Customer Admin">Finance & Customer Admin</option>
    <option value="Technical & Security Admin">Technical & Security Admin</option>
</select>
<select>
<option>Operations Admin</option>
<option>Agriculture Admin</option>
<option>Business & Marketplace Admin</option>
<option>Finance & Customer Admin</option>
<option>Technical & Security Admin</option>

<option>Crop Farming Admin</option>
<option>Horticulture Admin</option>
<option>Nursery Admin</option>
<option>Livestock Admin</option>
<option>Poultry Admin</option>
<option>Fisheries Admin</option>
<option>Organic Farming Admin</option>
<option>Farm Machinery Admin</option>
<option>Marketplace Admin</option>
<option>Warehouse Admin</option>
<option>Logistics Admin</option>
<option>Marketing Admin</option>
<option>Training Admin</option>
<option>Research & Development Admin</option>
<option>Veterinary Admin</option>
<option>Reports & Analytics Admin</option>
<option>Customer Service Admin</option>
<option>Accounts & Finance Admin</option>
</select>

<br><br>

<label>Reports To</label><br>

<select>
<option>Super Admin</option>
<option>Operations Admin</option>
<option>Agriculture Admin</option>
<option>Business & Marketplace Admin</option>
<option>Finance & Customer Admin</option>
<option>Technical & Security Admin</option>
</select>

<br><br>

<label>Status</label><br>

<select>
<option>Active</option>
<option>Inactive</option>
</select>

<br><br>

<button type="submit">Create Admin</button>
<button type="reset">Reset</button>

</form>

<hr>

<p>© KALI LIFE ECOSYSTEM - Admin Management System</p>

</body>
</html>
