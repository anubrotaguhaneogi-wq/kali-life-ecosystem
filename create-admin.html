<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    padding: 25px 15px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #052e16,
            #064e3b,
            #0f172a
        );

    color: #0f172a;
}


/* =========================================================
   CONTAINER
========================================================= */

.container {

    width: 100%;

    max-width: 650px;

    margin: 0 auto;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    text-align: center;

    color: #ffffff;

    margin-bottom: 22px;
}

.header h1 {

    margin: 0;

    font-size: 28px;

    font-weight: 800;
}

.header p {

    margin: 7px 0 0;

    color:
        rgba(255,255,255,0.75);

    font-size: 13px;
}


/* =========================================================
   CARD
========================================================= */

.card {

    background: #ffffff;

    padding: 30px;

    border-radius: 18px;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,0.28);
}


/* =========================================================
   SECTION
========================================================= */

.section-title {

    margin: 0 0 20px;

    padding-bottom: 10px;

    border-bottom:
        2px solid
        #dcfce7;

    color: #166534;

    font-size: 19px;

    font-weight: 800;
}


/* =========================================================
   FORM GROUP
========================================================= */

.form-group {

    margin-bottom: 18px;
}

label {

    display: block;

    margin-bottom: 7px;

    color: #334155;

    font-size: 14px;

    font-weight: 700;
}


/* =========================================================
   INPUT
========================================================= */

input,
select {

    width: 100%;

    height: 48px;

    padding: 0 13px;

    border:
        1px solid
        #cbd5e1;

    border-radius: 9px;

    background: #ffffff;

    color: #0f172a;

    font-size: 15px;

    outline: none;

    transition: 0.2s;
}

input:focus,
select:focus {

    border-color:
        #16a34a;

    box-shadow:
        0 0 0 3px
        rgba(22,163,74,0.12);
}


/* =========================================================
   PASSWORD
========================================================= */

.password-box {

    position: relative;
}

.password-box input {

    padding-right: 70px;
}

.password-toggle {

    position: absolute;

    right: 7px;

    top: 50%;

    transform:
        translateY(-50%);

    border: none;

    background: transparent;

    color: #166534;

    font-size: 12px;

    font-weight: 800;

    cursor: pointer;

    padding: 7px 9px;
}


/* =========================================================
   ROLE
========================================================= */

.role-info {

    padding: 12px;

    margin-bottom: 18px;

    border-radius: 9px;

    background:
        #f0fdf4;

    border:
        1px solid
        #bbf7d0;

    color: #166534;

    font-size: 13px;

    line-height: 1.5;
}


/* =========================================================
   BUTTONS
========================================================= */

.buttons {

    display: flex;

    gap: 10px;

    margin-top: 25px;
}

button {

    flex: 1;

    height: 48px;

    border: none;

    border-radius: 9px;

    font-size: 15px;

    font-weight: 800;

    cursor: pointer;

    transition: 0.2s;
}

.create-button {

    background:
        linear-gradient(
            135deg,
            #16a34a,
            #15803d
        );

    color: #ffffff;
}

.create-button:hover {

    transform:
        translateY(-1px);
}

.create-button:disabled {

    opacity: 0.65;

    cursor: not-allowed;

    transform: none;
}

.reset-button {

    background:
        #64748b;

    color: #ffffff;
}


/* =========================================================
   MESSAGE
========================================================= */

.message {

    display: none;

    margin-top: 18px;

    padding: 12px;

    border-radius: 9px;

    text-align: center;

    font-size: 13px;

    font-weight: 700;

    line-height: 1.45;
}

.message.show {

    display: block;
}

.error {

    background:
        #fef2f2;

    border:
        1px solid
        #fecaca;

    color:
        #b91c1c;
}

.success {

    background:
        #f0fdf4;

    border:
        1px solid
        #bbf7d0;

    color:
        #166534;
}


/* =========================================================
   FOOTER LINKS
========================================================= */

.links {

    margin-top: 22px;

    text-align: center;
}

.links a {

    display: inline-block;

    margin: 5px 10px;

    color: #166534;

    text-decoration: none;

    font-size: 13px;

    font-weight: 700;
}

.links a:hover {

    text-decoration: underline;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    body {

        padding:
            15px 10px;
    }

    .card {

        padding:
            22px 18px;

        border-radius:
            14px;
    }

    .header h1 {

        font-size: 24px;
    }

    .buttons {

        flex-direction: column;
    }

}

</style>

</head>

        <div

<script type="module">

} from

    authDomain:
        "kali-life-ecosystem.firebaseapp.com",

    projectId:
        "kali-life-ecosystem",

    storageBucket:
        "kali-life-ecosystem.firebasestorage.app",

    messagingSenderId:
        "734170546737",

};


/* ======================================================
   MAIN APP
====================================================== */

const app =
    initializeApp(
        firebaseConfig
    );


/* ======================================================
   SECONDARY APP
   IMPORTANT:
   Creating the new Admin must NOT log the
   current Super Admin out.
====================================================== */

const adminApp =
    initializeApp(
        firebaseConfig,
        "AdminCreationApp"
    );


const adminAuth =
    getAuth(
        adminApp
    );


const db =
    getFirestore(
        app
    );


/* ======================================================
   ELEMENTS
====================================================== */

const nameInput =
    document.getElementById(
        "name"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const mobileInput =
    document.getElementById(
        "mobile"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const passwordToggle =
    document.getElementById(
        "passwordToggle"
    );

const roleInput =
    document.getElementById(
        "role"
    );

const statusInput =
    document.getElementById(
        "status"
    );

const createButton =
    document.getElementById(
        "createButton"
    );

const resetButton =
    document.getElementById(
        "resetButton"
    );

const message =
    document.getElementById(
        "message"
    );


/* ======================================================
   PASSWORD SHOW / HIDE
====================================================== */

passwordToggle.addEventListener(
    "click",
    function () {

        if (
            passwordInput.type ===
            "password"
        ) {

            passwordInput.type =
                "text";

            passwordToggle.textContent =
                "Hide";

        } else {

            passwordInput.type =
                "password";

            passwordToggle.textContent =
                "Show";

        }

    }
);


/* ======================================================
   MOBILE INPUT
====================================================== */

mobileInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .replace(/\D/g, "")
                .slice(0, 10);

    }
);


/* ======================================================
   MESSAGE
====================================================== */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message show " +
        type;

}


function clearMessage() {

    message.textContent =
        "";

    message.className =
        "message";

}


/* ======================================================
   RESET
====================================================== */

resetButton.addEventListener(
    "click",
    function () {

        nameInput.value =
            "";

        emailInput.value =
            "";

        mobileInput.value =
            "";

        passwordInput.value =
            "";

        roleInput.value =
            "Admin";

        statusInput.value =
            "Active";

        clearMessage();

    }
);


/* ======================================================
   CREATE ADMIN
====================================================== */

createButton.addEventListener(
    "click",
    createAdmin
);


async function createAdmin() {

    clearMessage();


    const name =
        nameInput.value.trim();

    const email =
        emailInput.value
            .trim()
            .toLowerCase();

    const mobile =
        mobileInput.value.trim();

    const password =
        passwordInput.value;

    const role =
        roleInput.value;

    const status =
        statusInput.value;


    /* ==================================================
       VALIDATION
    ================================================== */

    if (
        name.length < 3
    ) {

        showMessage(
            "Please enter the admin's full name.",
            "error"
        );

        nameInput.focus();

        return;
    }


    if (
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
            email
        )
    ) {

        showMessage(
            "Please enter a valid email address.",
            "error"
        );

        emailInput.focus();

        return;
    }


    if (
        !/^[0-9]{10}$/.test(
            mobile
        )
    ) {

        showMessage(
            "Mobile number must contain exactly 10 digits.",
            "error"
        );

        mobileInput.focus();

    if (
        password.length < 8
    ) {

        showMessage(
            "Password must be at least 8 characters.",

        );

        passwordInput.focus();

        role !== "Admin"
    ) {

        showMessage(
            "Invalid admin role.",
            "error"
        );

        return;
    }

       LOADING

    createButton.disabled =
        true;

    createButton.textContent =
        "Creating Admin...";

           CHECK DUPLICATE MOBILE
        ================================================== */

        const mobileQuery =
            query(
                collection(
                    db,
                    "users"
                ),

                where(
                    "mobile",
                    "==",
                    mobile
                )
            );


        const mobileSnapshot =
            await getDocs(
                mobileQuery
            );


        if (
            !mobileSnapshot.empty
        ) {

            showMessage(
                "This mobile number is already registered.",
                "error"
            );

            createButton.disabled =
                false;

            createButton.textContent =
                "Create Admin";

            return;
        }


        /* ==================================================
           CREATE FIREBASE AUTH ACCOUNT
        ================================================== */

        const credential =
            await createUserWithEmailAndPassword(
                adminAuth,
                email,
                password
            );


        const adminUser =
            credential.user;


        /* ==================================================
           CREATE FIRESTORE PROFILE
        ================================================== */

        await setDoc(
            doc(
                db,
                "users",
                adminUser.uid
            ),
            {

                uid:
                    adminUser.uid,

                name:
                    name,

                email:
                    email,

                mobile:
                    mobile,

                role:
                    "Admin",

                status:
                    status,

                createdAt:
                    serverTimestamp()

            }
        );


        /* ==================================================
           SIGN OUT SECONDARY AUTH
        ================================================== */

        await signOut(
            adminAuth
        );


        /* ==================================================
           SUCCESS
        ================================================== */

        showMessage(
            "Admin created successfully.",
            "success"
        );


        alert(
            "Admin Created Successfully!"
        );


        /* ==================================================
           CLEAR FORM
        ================================================== */

        nameInput.value =
            "";

        emailInput.value =
            "";

        mobileInput.value =
            "";

        passwordInput.value =
            "";

        roleInput.value =
            "Admin";

        statusInput.value =
            "Active";


    } catch (error) {

        console.error(
            "CREATE ADMIN ERROR:",
            error
        );


        if (
            error.code ===
            "auth/email-already-in-use"
        ) {

            showMessage(
                "This email address is already registered.",
                "error"
            );

        }

        else if (
            error.code ===
            "auth/invalid-email"
        ) {

            showMessage(
                "Please enter a valid email address.",
                "error"
            );

        }

        else if (
            error.code ===
            "auth/weak-password"
        ) {

            showMessage(
                "Password is too weak. Use at least 8 characters.",
