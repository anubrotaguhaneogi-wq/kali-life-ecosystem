<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Admin - KALI LIFE ECOSYSTEM</title>
</head>

<body>

<h1>KALI LIFE ECOSYSTEM</h1>
<h2>Create New Admin</h2>

<hr>

<form action="#" method="post">

<h3>Personal Information</h3>

<label>Full Name</label><br>
<input type="text" name="fullName" placeholder="Enter Full Name" required>

<label>Email Address</label><br>
<input type="email" name="email" placeholder="Enter Email Address" required>

<label>Mobile Number</label><br>
<input type="tel" name="mobile" placeholder="Enter Mobile Number" required>

<label>Password</label><br>
<input type="password" name="password" placeholder="Create Password" required>

<hr>

<h3>Admin Role</h3>

<label>Select Admin Level</label><br>

<select name="adminRole" required>
    <option value="">-- Select Admin Role --</option>
    <option value="Super Admin">Super Admin</option>
    <option value="Core Admin">Core Admin</option>
    <option value="Operations Admin">Operations Admin</option>
    <option value="Agriculture Admin">Agriculture Admin</option>
    <option value="Business & Marketplace Admin">Business & Marketplace Admin</option>
    <option value="Finance & Customer Admin">Finance & Customer Admin</option>
    <option value="Technical & Security Admin">Technical & Security Admin</option>
<option value="Crop Farming Admin">Crop Farming Admin</option>
<option value="Horticulture Admin">Horticulture Admin</option>
<option value="Nursery Admin">Nursery Admin</option>
<option value="Livestock Admin">Livestock Admin</option>
<option value="Poultry Admin">Poultry Admin</option>
<option value="Fisheries Admin">Fisheries Admin</option>
<option value="Organic Farming Admin">Organic Farming Admin</option>
<option value="Farm Machinery Admin">Farm Machinery Admin</option>
<option value="Marketplace Admin">Marketplace Admin</option>
<option value="Warehouse Admin">Warehouse Admin</option>
<option value="Logistics Admin">Logistics Admin</option>
<option value="Marketing Admin">Marketing Admin</option>
<option value="Training Admin">Training Admin</option>
<option value="Research & Development Admin">Research & Development Admin</option>
<option value="Veterinary Admin">Veterinary Admin</option>
<option value="Reports & Analytics Admin">Reports & Analytics Admin</option>
<option value="Customer Service Admin">Customer Service Admin</option>
<option value="Accounts & Finance Admin">Accounts & Finance Admin</option>
</select>


<br><br>

<label>Reports To</label><br>
<select name="reportsTo" id="reportsTo" required>
    <option value="">-- Select Reporting Admin --</option>
    <option value="Super Admin">Super Admin</option>
    <option value="Core Admin">Core Admin</option>
    <option value="Operations Admin">Operations Admin</option>
    <option value="Agriculture Admin">Agriculture Admin</option>
    <option value="Business & Marketplace Admin">Business & Marketplace Admin</option>
    <option value="Technical & Security Admin">Technical & Security Admin</option>
</select>

    <label>Status</label><br>

<select name="status" required>
    <option value="">-- Select Status --</option>
    <option value="Active">Active</option>
    <option value="Inactive">Inactive</option>
</select>

<br><br>

<br><br>
<h3>Profile Photo</h3>

<label>Upload Profile Photo</label><br>

<input type="file" id="profilePhoto" accept="image/*">

<br><br>

<button type="button" onclick="createAdmin()">
    Create Admin
</button>
<button type="reset">
    Reset Form
</button>

</form>

<hr>

<p>© KALI LIFE ECOSYSTEM - Admin Management System</p>
<script>

function createAdmin() {

const admin = {
    id: "ADM-" + Date.now(),

    fullName: document.querySelector('input[name="fullName"]').value.trim(),

    email: document.querySelector('input[name="email"]').value.trim().toLowerCase(),

    mobile: document.querySelector('input[name="mobile"]').value.trim(),

    password: document.querySelector('input[name="password"]').value,

    role: document.querySelector('select[name="adminRole"]').value,

    reportsTo: document.querySelector('select[name="reportsTo"]').value,

    status: document.querySelector('select[name="status"]').value,
photo: "",
    createdAt: new Date().toLocaleString()
};
    if (admin.fullName.length < 3) {
    alert("Full Name must be at least 3 characters!");
    return;
    }
    if (!admin.email.includes("@")) {
    alert("Please enter a valid Email Address!");
    return;
    }
   
if (admin.role === "") {
    alert("Please Select Admin Role!");
    return;
}

if (admin.reportsTo === "") {
    alert("Please Select Reporting Admin!");
    return;
}
if (admin.password.length < 8) {
    alert("Password must be at least 8 characters!");
    return;
}
    if (!/^[0-9]{10}$/.test(admin.mobile)) {
    alert("Mobile Number must be exactly 10 digits!");
    return;
    }
    if (admin.status === "") {
    alert("Please Select Status!");
    return;
    }
    
let admins = JSON.parse(localStorage.getItem("admins")) || [];
const duplicate = admins.find(item =>
    item.email === admin.email ||
    item.mobile === admin.mobile
);

if (duplicate) {
    alert("Email or Mobile Number already exists!");
    return;
}
admins.push(admin);

localStorage.setItem("admins", JSON.stringify(admins));
alert(localStorage.getItem("admins"));
alert("Admin Created Successfully!");

window.location.href = "admin-list.html";

}
</script>
</body>
</html>
