<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#166534">

<title>Create Admin | KALI LIFE ECOSYSTEM</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#f0fdf4,#ecfdf5);
    color:#1f2937;
}

.container{
    width:min(560px,94%);
    margin:35px auto;
}

.card{
    background:#fff;
    border-radius:22px;
    padding:28px;
    box-shadow:0 12px 35px rgba(0,0,0,.10);
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    margin:0;
    color:#166534;
    font-size:26px;
}

.header p{
    margin:7px 0 0;
    color:#6b7280;
    font-size:14px;
}

label{
    display:block;
    margin:14px 0 6px;
    font-size:14px;
    font-weight:600;
}

input,select{
    width:100%;
    padding:13px 14px;
    border:1px solid #d1d5db;
    border-radius:11px;
    outline:none;
    font-size:15px;
    background:#fff;
}

input:focus,select:focus{
    border-color:#16a34a;
    box-shadow:0 0 0 3px rgba(22,163,74,.10);
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

button{
    width:100%;
    border:0;
    padding:14px;
    margin-top:22px;
    border-radius:12px;
    background:#166534;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

button:hover{
    background:#14532d;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-size:14px;
}

.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

@media(max-width:520px){
    .grid{
        grid-template-columns:1fr;
        gap:0;
    }

    .card{
        padding:20px;
    }
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<div class="header">
    <h1>Create Admin</h1>
    <p>KALI LIFE ECOSYSTEM</p>
</div>

<form id="adminForm">

    <label>Full Name</label>
    <input id="name" type="text" required>

    <div class="grid">

        <div>
            <label>Mobile Number</label>
            <input id="mobile" type="tel"
                   maxlength="10"
                   inputmode="numeric"
                   required>
        </div>

        <div>
            <label>Email</label>
            <input id="email" type="email" required>
        </div>

    </div>

    <label>Password</label>
    <input id="password" type="password" required>

    <label>Admin Role</label>
    <select id="role" required>
        <option value="">Select Role</option>
        <option value="Core Admin">Core Admin</option>
        <option value="Department Admin">Department Admin</option>
    </select>

    <label>Department</label>
    <input id="department" type="text"
           placeholder="Example: Agriculture">

    <label>Reports To</label>
    <input id="reportsTo"
           type="text"
           value="Super Admin"
           readonly>

    <label>Status</label>
    <select id="status">
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
    </select>

    <button id="createBtn" type="submit">
        Create Admin
    </button>

    <div id="message" class="message"></div>

</form>
</div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

/* =========================================
   KALI LIFE ECOSYSTEM
   CREATE ADMIN - SIMPLE VERSION
   ========================================= */

const firebaseConfig = {
    /* এখানে তোমার login.html-এর
       একই Firebase configuration বসাবে */

    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const form = document.getElementById("adminForm");
const btn = document.getElementById("createBtn");
const message = document.getElementById("message");

function showMessage(text,type){

    message.textContent = text;
    message.className = "message " + type;

}

function generateAdminId(){

    return "ADM-" +
        Date.now().toString().slice(-8);

}

form.addEventListener("submit", async function(e){

    e.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const mobile =
        document.getElementById("mobile").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const role =
        document.getElementById("role").value;

    const department =
        document.getElementById("department").value.trim();

    const reportsTo =
        document.getElementById("reportsTo").value;

    const status =
        document.getElementById("status").value;

    if(!/^[0-9]{10}$/.test(mobile)){

        showMessage(
            "Enter a valid 10-digit mobile number.",
            "error"
        );

        return;
    }

    if(role === "Department Admin" && !department){

        showMessage(
            "Department is required for Department Admin.",
            "error"
        );

        return;
    }

    btn.disabled = true;
    btn.textContent = "Creating...";

    try{

        const existing =
            await db.collection("users")
            .where("mobile","==",mobile)
            .limit(1)
            .get();

        if(!existing.empty){

            showMessage(
                "This mobile number already exists.",
                "error"
            );

            btn.disabled = false;
            btn.textContent = "Create Admin";

            return;
        }

        const adminId = generateAdminId();

        await db.collection("users").add({

            adminId: adminId,

            name: name,

            mobile: mobile,

            email: email,

            password: password,

            roleType: role,

            role: role,

            department: department,

            reportsTo: reportsTo,

            status: status,

            accountType: "Admin",

            createdAt:
                firebase.firestore.FieldValue.serverTimestamp()

        });

        showMessage(
            "Admin created successfully. ID: " + adminId,
            "success"
        );

        form.reset();

        document.getElementById("reportsTo").value =
            "Super Admin";

    }catch(error){

        console.error(error);

        showMessage(
            "Admin creation failed. Check Firebase configuration.",
            "error"
        );

    }

    btn.disabled = false;
    btn.textContent = "Create Admin";

});

</script>

</body>
</html>
