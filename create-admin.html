<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:#f0fdf4;
    color:#17321f;
}

.header{
    background:#166534;
    color:#fff;
    padding:18px 16px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:23px;
}

.header p{
    margin:5px 0 0;
    font-size:13px;
    opacity:.9;
}

.wrap{
    max-width:850px;
    margin:20px auto;
    padding:0 14px;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:20px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);

}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:16px;
}

.tabs button{
    flex:1;
    border:0;
    padding:13px;
    border-radius:10px;

    color:#166534;

    cursor:pointer;
}

.tabs button.active{

    color:#fff;
}

.form-grid{

}

.form-group{
    display:flex;

}

.full{

}

label{

input,

}

input:focus,
select:focus{

    border-color:#16a34a;
}

button.primary{
    border:0;
    background:#166534;
    color:#fff;
    padding:13px 20px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
}

button.secondary{

    background:#e2e8f0;

}

.actions{

.msg{

.msg.ok{

}

.msg.err{

.preview{

.admin-item{

.admin-photo{

.admin-info{

}

.admin-info strong{
    display:block;

}

.admin-info span{

    font-size:12px;
    color:#64748b;

.badge{

.list-actions{

.list-actions button{

                            <option value="Education">

                    <div class="form-group">

<script type="module">

/* =========================

    getDownloadURL,
    deleteObject
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-storage.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDqXcxTrI22Ju1Rj9mtbUSCjGkT7B_OxZo",

    authDomain:
        "kali-life-ecosystem.firebaseapp.com",

    projectId:
        "kali-life-ecosystem",

    storageBucket:
        "kali-life-ecosystem.firebasestorage.app",

    messagingSenderId:
        "734170546737",

    appId:
        "1:734170546737:web:26f79e1b4b19ebabfe0b10",

    measurementId:
        "G-LBEY0W7RX3"
};


/* =========================
   FIREBASE INITIALIZE
========================= */

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);

const mainAuth =
    getAuth(app);

const storage =
    getStorage(app);


/* =========================
   VARIABLES
========================= */

const USERS = "users";

const CORE_LIMIT = 5;

const DEPT_LIMIT = 5;

let currentUser = null;

let secondaryApp = null;

let secondaryAuth = null;

let editingUid = null;

let selectedPhotoFile = null;


/* =========================
   SHORT SELECTOR
========================= */

const $ = id =>
    document.getElementById(id);


/* =========================
   MESSAGE
========================= */

function showMsg(
    id,
    text,
    success = false
){

    const el = $(id);

    el.textContent = text;

    el.className =
        success
        ? "msg ok"
        : "msg err";

    el.style.display =
        "block";
}


function hideMsg(id){

    $(id).style.display =
        "none";
}


/* =========================
   ERROR MESSAGE
========================= */

function friendlyError(error){

    const code =
        error?.code || "";

    if(
        code ===
        "auth/email-already-in-use"
    ){

        return "এই Email দিয়ে Firebase Authentication account আগে থেকেই আছে।";
    }

    if(
        code ===
        "auth/invalid-email"
    ){

        return "Email address সঠিক নয়।";
    }

    if(
        code ===
        "auth/weak-password"
    ){

        return "Password কমপক্ষে 6 characters হতে হবে।";
    }

    if(
        code ===
        "auth/operation-not-allowed"
    ){

        return "Firebase Authentication-এ Email/Password চালু নেই।";
    }

    if(
        code ===
        "storage/unauthorized"
    ){

        return "Photo upload blocked. Firebase Storage Rules permission দিচ্ছে না।";
    }

    if(
        code ===
        "storage/unauthenticated"
    ){

        return "Photo upload-এর জন্য authentication প্রয়োজন।";
    }

    if(
        code ===
        "storage/quota-exceeded"
    ){

        return "Firebase Storage quota exceeded।";
    }

    if(
        code ===
        "permission-denied"
    ){

        return "Firestore permission denied।";
    }

    return (
        error?.message ||
        "একটি অজানা সমস্যা হয়েছে।"
    );
}


/* =========================
   VERIFY SUPER ADMIN
========================= */

async function verifySuperAdmin(user){

    if(!user)
        return false;

    const snap =
        await getDoc(
            doc(
                db,
                USERS,
                user.uid
            )
        );

    if(!snap.exists())
        return false;

    const data =
        snap.data();

    const role =
        (
            data.roleType ||
            data.role ||
            ""
        ).trim();

    const status =
        data.status ||
        "Active";

    return (
        role === "Super Admin" &&
        status === "Active"
    );
}


/* =========================
   LOGIN CHECK
========================= */

onAuthStateChanged(
    mainAuth,
    async user => {

        currentUser =
            user;

        if(!user){

            showMsg(
                "authMsg",
                "Super Admin login required."
            );

            return;
        }

        try{

            const allowed =
                await verifySuperAdmin(
                    user
                );

            if(!allowed){

                showMsg(
                    "authMsg",
                    "Access denied. Only Active Super Admin can manage admins."
                );

                return;
            }

            $("authMsg")
                .style
                .display = "none";

            $("mainArea")
                .classList
                .remove("hidden");

            await loadCoreAdmins();

        }catch(error){

            showMsg(
                "authMsg",
                friendlyError(error)
            );
        }
    }
);


/* =========================
   LOAD CORE ADMINS
========================= */

async function loadCoreAdmins(){

    const q =
        query(
            collection(db, USERS),
            where(
                "roleType",
                "==",
                "Core Admin"
            )
        );

    const snap =
        await getDocs(q);

    const select =
        $("reportsTo");

    select.innerHTML =
        '<option value="Super Admin">Super Admin</option>';

    snap.forEach(
        s => {

            const data =
                s.data();

            if(
                (data.status ||
                "Active") !==
                "Active"
            )
                return;

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                data.name ||
                s.id;

            option.textContent =
                data.name ||
                s.id;

            select.appendChild(
                option
            );
        }
    );
}


/* =========================
   CORE COUNT
========================= */

async function activeCoreCount(
    excludeUid = null
){

    const snap =
        await getDocs(
            query(
                collection(
                    db,
                    USERS
                ),
                where(
                    "roleType",
                    "==",
                    "Core Admin"
                )
            )
        );

    let count = 0;

    snap.forEach(
        s => {

            if(
                s.id !==
                excludeUid &&
                (s.data().status ||
                "Active") ===
                "Active"
            ){

                count++;
            }
        }
    );

    return count;
}


/* =========================
   DEPARTMENT COUNT
========================= */

async function activeDepartmentCount(
    department,
    excludeUid = null
){

    const snap =
        await getDocs(
            query(
                collection(
                    db,
                    USERS
                ),
                where(
                    "roleType",
                    "==",
                    "Departmental Admin"
                ),
                where(
                    "department",
                    "==",
                    department
                )
            )
        );

    let count = 0;

    snap.forEach(
        s => {

            if(
                s.id !==
                excludeUid &&
                (s.data().status ||
                "Active") ===
                "Active"
            ){

                count++;
            }
        }
    );

    return count;
}


/* =========================
   PHOTO VALIDATION
========================= */

function validatePhoto(file){

    if(!file)
        return true;

    const allowed = [

        "image/jpeg",
        "image/png",
        "image/webp"

    ];

    if(
        !allowed.includes(
            file.type
        )
    ){

        showMsg(
            "formMsg",
            "শুধু JPG, PNG অথবা WEBP ছবি ব্যবহার করুন।"
        );
