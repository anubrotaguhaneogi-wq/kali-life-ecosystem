<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#166534">
<title>Create Admin - KALI LIFE ECOSYSTEM</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:#f0fdf4;
    color:#17321f;
}

.header{
    background:#166534;
    color:#fff;
    padding:18px 16px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:23px;
}

.header p{
    margin:5px 0 0;
    font-size:13px;
    opacity:.9;
}

.wrap{
    max-width:850px;
    margin:20px auto;
    padding:0 14px;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:20px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
    margin-bottom:18px;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:16px;
}

.tabs button{
    flex:1;
    border:0;
    padding:13px;
    border-radius:10px;
    background:#dcfce7;
    color:#166534;
    font-weight:700;
    cursor:pointer;
}

.tabs button.active{
    background:#166534;
    color:#fff;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.full{
    grid-column:1/-1;
}

label{
    font-weight:700;
    font-size:14px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #cbd5d1;
    border-radius:10px;
    font-size:15px;
    background:#fff;
}

input:focus,
select:focus{
    outline:2px solid #86efac;
    border-color:#16a34a;
}

button.primary{
    border:0;
    background:#166534;
    color:#fff;
    padding:13px 20px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
}

button.secondary{
    border:0;
    background:#e2e8f0;
    color:#334155;
    padding:13px 20px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
}

.hint{
    font-size:12px;
    color:#64748b;
}

.msg{
    display:none;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:14px;
    font-weight:600;
}

.msg.ok{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.msg.err{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.photo-box{
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
}

.preview{
    width:120px;
    height:120px;
    border-radius:14px;
    object-fit:cover;
    border:2px solid #bbf7d0;
    background:#f8fafc;
    display:none;
}

.placeholder{
    width:120px;
    height:120px;
    border-radius:14px;
    border:2px dashed #86efac;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#64748b;
    font-size:12px;
    padding:10px;
}

.admin-list{
    display:grid;
    gap:12px;
}

.admin-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px;
    border:1px solid #dcfce7;
    border-radius:14px;
    background:#fafffb;
}

.admin-photo{
    width:64px;
    height:64px;
    border-radius:12px;
    object-fit:cover;
    background:#dcfce7;
}

.admin-info{
    flex:1;
}

.admin-info strong{
    display:block;
    font-size:16px;
}

.admin-info span{
    display:block;
    font-size:12px;
    color:#64748b;
    margin-top:3px;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
    margin-top:5px;
    background:#dcfce7;
    color:#166534;
}

.list-actions{
    display:flex;
    gap:7px;
}

.list-actions button{
    border:0;
    padding:8px 11px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
}

.edit{
    background:#dbeafe;
    color:#1d4ed8;
}

.hidden{
    display:none!important;
}

@media(max-width:650px){
    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .admin-item{
        align-items:flex-start;
    }

    .list-actions{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>KALI LIFE ECOSYSTEM</h1>
    <p>Admin Management System</p>
</div>

<div class="wrap">

    <div id="authMsg" class="msg"></div>

    <div id="mainArea" class="hidden">

        <div class="tabs">
            <button id="createTab" class="active">
                Create Admin
            </button>

            <button id="listTab">
                Admin List
            </button>
        </div>

        <!-- CREATE / EDIT -->
        <section id="createSection" class="card">

            <h2 id="formTitle">
                Create Admin
            </h2>

            <div id="formMsg" class="msg"></div>

            <form id="adminForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="adminName">
                            Admin Name *
                        </label>

                        <input
                            id="adminName"
                            type="text"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="adminEmail">
                            Email *
                        </label>

                        <input
                            id="adminEmail"
                            type="email"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="adminMobile">
                            Mobile *
                        </label>

                        <input
                            id="adminMobile"
                            type="tel"
                            maxlength="10"
                            required>
                    </div>

                    <div
                        class="form-group"
                        id="passwordGroup">

                        <label for="adminPassword">
                            Password *
                        </label>

                        <input
                            id="adminPassword"
                            type="password"
                            minlength="6"
                            required>
                    </div>

                    <div class="form-group">

                        <label for="roleType">
                            Admin Role *
                        </label>

                        <select id="roleType" required>

                            <option value="">
                                Select Role
                            </option>

                            <option value="Core Admin">
                                Core Admin
                            </option>

                            <option value="Departmental Admin">
                                Departmental Admin
                            </option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label for="department">
                            Department
                        </label>

                        <select id="department">

                            <option value="">
                                Select Department
                            </option>

                            <option value="Product">
                                Product
                            </option>

                            <option value="Agriculture">
                                Agriculture
                            </option>

                            <option value="Technology">
                                Technology
                            </option>

                            <option value="Marriage">
                                Marriage
                            </option>

                            <option value="Education">
                                Education
                            </option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label for="reportsTo">
                            Reports To *
                        </label>

                        <select
                            id="reportsTo"
                            required>

                            <option value="Super Admin">
                                Super Admin
                            </option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label for="status">
                            Status *
                        </label>

                        <select id="status">

                            <option value="Active">
                                Active
                            </option>

                            <option value="Inactive">
                                Inactive
                            </option>

                        </select>

                    </div>

                    <!-- PHOTO UPLOAD -->

                    <div class="form-group full">

                        <label>
                            Admin Photo
                        </label>

                        <div class="photo-box">

                            <div
                                id="photoPlaceholder"
                                class="placeholder">

                                600 × 600<br>
                                Passport Photo

                            </div>

                            <img
                                id="photoPreview"
                                class="preview"
                                alt="Admin Photo">

                            <div
                                style="flex:1;min-width:220px">

                                <input
                                    id="adminPhoto"
                                    type="file"
                                    accept="image/jpeg,image/png,image/webp">

                                <div class="hint">

                                    JPG, PNG অথবা WEBP<br>
                                    600×600 recommended<br>
                                    Maximum 2 MB

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

                <div class="actions">

                    <button
                        id="saveBtn"
                        class="primary"
                        type="submit">

                        Create Admin

                    </button>

                    <button
                        id="cancelEditBtn"
                        class="secondary hidden"
                        type="button">

                        Cancel Edit

                    </button>

                </div>

            </form>

        </section>

        <!-- ADMIN LIST -->

        <section
            id="listSection"
            class="card hidden">

            <h2>
                Admin List
            </h2>

            <div
                id="listMsg"
                class="msg">
            </div>

            <div
                id="adminList"
                class="admin-list">

            </div>

        </section>

    </div>

</div>


<script type="module">

/* =========================
   FIREBASE IMPORTS
========================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    createUserWithEmailAndPassword,
    deleteUser
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    getDoc,
    doc,
    setDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL,
    deleteObject
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-storage.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDqXcxTrI22Ju1Rj9mtbUSCjGkT7B_OxZo",

    authDomain:
        "kali-life-ecosystem.firebaseapp.com",

    projectId:
        "kali-life-ecosystem",

    storageBucket:
        "kali-life-ecosystem.firebasestorage.app",

    messagingSenderId:
        "734170546737",

    appId:
        "1:734170546737:web:26f79e1b4b19ebabfe0b10",

    measurementId:
        "G-LBEY0W7RX3"
};


/* =========================
   FIREBASE INITIALIZE
========================= */

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);

const mainAuth =
    getAuth(app);

const storage =
    getStorage(app);


/* =========================
   VARIABLES
========================= */

const USERS = "users";

const CORE_LIMIT = 5;

const DEPT_LIMIT = 5;

let currentUser = null;

let secondaryApp = null;

let secondaryAuth = null;

let editingUid = null;

let selectedPhotoFile = null;


/* =========================
   SHORT SELECTOR
========================= */

const $ = id =>
    document.getElementById(id);


/* =========================
   MESSAGE
========================= */

function showMsg(
    id,
    text,
    success = false
){

    const el = $(id);

    el.textContent = text;

    el.className =
        success
        ? "msg ok"
        : "msg err";

    el.style.display =
        "block";
}


function hideMsg(id){

    $(id).style.display =
        "none";
}


/* =========================
   ERROR MESSAGE
========================= */

function friendlyError(error){

    const code =
        error?.code || "";

    if(
        code ===
        "auth/email-already-in-use"
    ){

        return "এই Email দিয়ে Firebase Authentication account আগে থেকেই আছে।";
    }

    if(
        code ===
        "auth/invalid-email"
    ){

        return "Email address সঠিক নয়।";
    }

    if(
        code ===
        "auth/weak-password"
    ){

        return "Password কমপক্ষে 6 characters হতে হবে।";
    }

    if(
        code ===
        "auth/operation-not-allowed"
    ){

        return "Firebase Authentication-এ Email/Password চালু নেই।";
    }

    if(
        code ===
        "storage/unauthorized"
    ){

        return "Photo upload blocked. Firebase Storage Rules permission দিচ্ছে না।";
    }

    if(
        code ===
        "storage/unauthenticated"
    ){

        return "Photo upload-এর জন্য authentication প্রয়োজন।";
    }

    if(
        code ===
        "storage/quota-exceeded"
    ){

        return "Firebase Storage quota exceeded।";
    }

    if(
        code ===
        "permission-denied"
    ){

        return "Firestore permission denied।";
    }

    return (
        error?.message ||
        "একটি অজানা সমস্যা হয়েছে।"
    );
}


/* =========================
   VERIFY SUPER ADMIN
========================= */

async function verifySuperAdmin(user){

    if(!user)
        return false;

    const snap =
        await getDoc(
            doc(
                db,
                USERS,
                user.uid
            )
        );

    if(!snap.exists())
        return false;

    const data =
        snap.data();

    const role =
        (
            data.roleType ||
            data.role ||
            ""
        ).trim();

    const status =
        data.status ||
        "Active";

    return (
        role === "Super Admin" &&
        status === "Active"
    );
}


/* =========================
   LOGIN CHECK
========================= */

onAuthStateChanged(
    mainAuth,
    async user => {

        currentUser =
            user;

        if(!user){

            showMsg(
                "authMsg",
                "Super Admin login required."
            );

            return;
        }

        try{

            const allowed =
                await verifySuperAdmin(
                    user
                );

            if(!allowed){

                showMsg(
                    "authMsg",
                    "Access denied. Only Active Super Admin can manage admins."
                );

                return;
            }

            $("authMsg")
                .style
                .display = "none";

            $("mainArea")
                .classList
                .remove("hidden");

            await loadCoreAdmins();

        }catch(error){

            showMsg(
                "authMsg",
                friendlyError(error)
            );
        }
    }
);


/* =========================
   LOAD CORE ADMINS
========================= */

async function loadCoreAdmins(){

    const q =
        query(
            collection(db, USERS),
            where(
                "roleType",
                "==",
                "Core Admin"
            )
        );

    const snap =
        await getDocs(q);

    const select =
        $("reportsTo");

    select.innerHTML =
        '<option value="Super Admin">Super Admin</option>';

    snap.forEach(
        s => {

            const data =
                s.data();

            if(
                (data.status ||
                "Active") !==
                "Active"
            )
                return;

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                data.name ||
                s.id;

            option.textContent =
                data.name ||
                s.id;

            select.appendChild(
                option
            );
        }
    );
}


/* =========================
   CORE COUNT
========================= */

async function activeCoreCount(
    excludeUid = null
){

    const snap =
        await getDocs(
            query(
                collection(
                    db,
                    USERS
                ),
                where(
                    "roleType",
                    "==",
                    "Core Admin"
                )
            )
        );

    let count = 0;

    snap.forEach(
        s => {

            if(
                s.id !==
                excludeUid &&
                (s.data().status ||
                "Active") ===
                "Active"
            ){

                count++;
            }
        }
    );

    return count;
}


/* =========================
   DEPARTMENT COUNT
========================= */

async function activeDepartmentCount(
    department,
    excludeUid = null
){

    const snap =
        await getDocs(
            query(
                collection(
                    db,
                    USERS
                ),
                where(
                    "roleType",
                    "==",
                    "Departmental Admin"
                ),
                where(
                    "department",
                    "==",
                    department
                )
            )
        );

    let count = 0;

    snap.forEach(
        s => {

            if(
                s.id !==
                excludeUid &&
                (s.data().status ||
                "Active") ===
                "Active"
            ){

                count++;
            }
        }
    );

    return count;
}


/* =========================
   PHOTO VALIDATION
========================= */

function validatePhoto(file){

    if(!file)
        return true;

    const allowed = [

        "image/jpeg",
        "image/png",
        "image/webp"

    ];

    if(
        !allowed.includes(
            file.type
        )
    ){

        showMsg(
            "formMsg",
            "শুধু JPG, PNG অথবা WEBP ছবি ব্যবহার করুন।"
        );

      
    /* =========================
       COMPLETE PHOTO VALIDATION
    ========================= */

    if(file.size > 2 * 1024 * 1024){
        showMsg(
            "formMsg",
            "ছবির size সর্বোচ্চ 2 MB হতে হবে।"
        );
        return false;
    }

    return true;
}


/* =========================
   PHOTO PREVIEW
========================= */

$("adminPhoto").addEventListener(
    "change",
    function(){
        const file =
            this.files &&
            this.files[0];

        if(!file){
            selectedPhotoFile = null;
            $("photoPreview").style.display = "none";
            $("photoPlaceholder").style.display = "flex";
            return;
        }

        if(!validatePhoto(file)){
            this.value = "";
            selectedPhotoFile = null;
            $("photoPreview").style.display = "none";
            $("photoPlaceholder").style.display = "flex";
            return;
        }

        selectedPhotoFile = file;

        const reader =
            new FileReader();

        reader.onload =
            function(e){
                $("photoPreview").src =
                    e.target.result;

                $("photoPreview").style.display =
                    "block";

                $("photoPlaceholder").style.display =
                    "none";
            };

        reader.readAsDataURL(file);
    }
);


/* =========================
   ROLE / DEPARTMENT CONTROL
========================= */

$("roleType").addEventListener(
    "change",
    function(){

        const role =
            this.value;

        const department =
            $("department");

        const reportsTo =
            $("reportsTo");

        if(role === "Core Admin"){

            department.value = "";

            department.disabled = true;

            reportsTo.value =
                "Super Admin";

            reportsTo.disabled = true;

        }else if(role === "Departmental Admin"){

            department.disabled = false;

            reportsTo.disabled = false;

        }else{

            department.disabled = false;

            reportsTo.disabled = false;
        }
    }
);


/* =========================
   TAB CONTROL
========================= */

$("createTab").addEventListener(
    "click",
    function(){

        $("createTab")
            .classList
            .add("active");

        $("listTab")
            .classList
            .remove("active");

        $("createSection")
            .classList
            .remove("hidden");

        $("listSection")
            .classList
            .add("hidden");
    }
);


$("listTab").addEventListener(
    "click",
    async function(){

        $("listTab")
            .classList
            .add("active");

        $("createTab")
            .classList
            .remove("active");

        $("createSection")
            .classList
            .add("hidden");

        $("listSection")
            .classList
            .remove("hidden");

        await loadAdminList();
    }
);


/* =========================
   RESET FORM
========================= */

function resetAdminForm(){

    editingUid = null;

    selectedPhotoFile = null;

    $("adminForm").reset();

    $("adminMobile").disabled = false;

    $("adminEmail").disabled = false;

    $("passwordGroup")
        .classList
        .remove("hidden");

    $("adminPassword")
        .required = true;

    $("saveBtn").textContent =
        "Create Admin";

    $("formTitle").textContent =
        "Create Admin";

    $("cancelEditBtn")
        .classList
        .add("hidden");

    $("photoPreview").src = "";

    $("photoPreview").style.display =
        "none";

    $("photoPlaceholder").style.display =
        "flex";

    $("department").disabled =
        false;

    $("reportsTo").disabled =
        false;

    hideMsg("formMsg");

    loadCoreAdmins();
}


/* =========================
   CREATE FIREBASE AUTH USER
========================= */

async function createSecondaryAuthUser(
    email,
    password
){

    const appName =
        "adminCreator_" +
        Date.now();

    secondaryApp =
        initializeApp(
            firebaseConfig,
            appName
        );

    secondaryAuth =
        getAuth(
            secondaryApp
        );

    const result =
        await createUserWithEmailAndPassword(
            secondaryAuth,
            email,
            password
        );

    return result.user;
}


/* =========================
   SAVE PHOTO
========================= */

async function uploadAdminPhoto(
    uid,
    file
){

    if(!file)
        return null;

    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();

    const photoPath =
        "admin-photos/" +
        uid +
        "." +
        extension;

    const photoRef =
        ref(
            storage,
            photoPath
        );

    await uploadBytes(
        photoRef,
        file
    );

    const photoURL =
        await getDownloadURL(
            photoRef
        );

    return {
        photoURL,
        photoPath
    };
}


/* =========================
   CREATE ADMIN
========================= */

async function createAdmin(){

    const name =
        $("adminName")
            .value
            .trim();

    const email =
        $("adminEmail")
            .value
            .trim()
            .toLowerCase();

    const mobile =
        $("adminMobile")
            .value
            .trim();

    const password =
        $("adminPassword")
            .value;

    const roleType =
        $("roleType")
            .value
            .trim();

    const department =
        $("department")
            .value
            .trim();

    const reportsTo =
        $("reportsTo")
            .value
            .trim();

    const status =
        $("status")
            .value
            .trim() ||
        "Active";


    if(!name ||
       !email ||
       !mobile ||
       !password ||
       !roleType){

        showMsg(
            "formMsg",
            "সব required field পূরণ করুন।"
        );

        return;
    }


    if(!/^\d{10}$/.test(mobile)){

        showMsg(
            "formMsg",
            "Mobile number অবশ্যই 10 digit হতে হবে।"
        );

        return;
    }


    if(password.length < 6){

        showMsg(
            "formMsg",
            "Password কমপক্ষে 6 characters হতে হবে।"
        );

        return;
    }


    if(
        roleType ===
        "Departmental Admin" &&
        !department
    ){

        showMsg(
            "formMsg",
            "Departmental Admin-এর জন্য Department নির্বাচন করুন।"
        );

        return;
    }


    if(
        roleType ===
        "Core Admin"
    ){

        const count =
            await activeCoreCount();

        if(count >= CORE_LIMIT){

            showMsg(
                "formMsg",
                "সর্বোচ্চ " +
                CORE_LIMIT +
                " জন Active Core Admin রাখা যাবে।"
            );

            return;
        }
    }


    if(
        roleType ===
        "Departmental Admin"
    ){

        const count =
            await activeDepartmentCount(
                department
            );

        if(count >= DEPT_LIMIT){

            showMsg(
                "formMsg",
                department +
                " department-এ সর্বোচ্চ " +
                DEPT_LIMIT +
                " জন Active Departmental Admin রাখা যাবে।"
            );

            return;
        }
    }


    /* CHECK MOBILE */

    const mobileSnap =
        await getDocs(
            query(
                collection(
                    db,
                    USERS
                ),
                where(
                    "mobile",
                    "==",
                    mobile
                )
            )
        );

    if(!mobileSnap.empty){

        showMsg(
            "formMsg",
            "এই Mobile number আগে থেকেই ব্যবহার করা হয়েছে।"
        );

        return;
    }


    let authUser = null;


    try{

        $("saveBtn").disabled =
            true;

        $("saveBtn").textContent =
            "Creating Admin...";

        hideMsg("formMsg");


        /* CREATE FIREBASE AUTH */

        authUser =
            await createSecondaryAuthUser(
                email,
                password
            );


        const uid =
            authUser.uid;


        /* UPLOAD PHOTO */

        let photoData =
            null;

        if(selectedPhotoFile){

            photoData =
                await uploadAdminPhoto(
                    uid,
                    selectedPhotoFile
                );
        }


        /* FIRESTORE DATA */

        const adminData = {

            uid: uid,

            name: name,

            email: email,

            mobile: mobile,

            roleType: roleType,

            role: roleType,

            department:
                roleType ===
                "Core Admin"
                    ? ""
                    : department,

            reportsTo:
                reportsTo ||
                "Super Admin",

            status: status,

            photoURL:
                photoData
                    ? photoData.photoURL
                    : "",

            photoPath:
                photoData
                    ? photoData.photoPath
                    : "",

            createdBy:
                currentUser.uid,

            createdAt:
                serverTimestamp(),

            updatedAt:
                serverTimestamp()
        };


        await setDoc(
            doc(
                db,
                USERS,
                uid
            ),
            adminData
        );


        showMsg(
            "formMsg",
            "Admin সফলভাবে তৈরি হয়েছে।",
            true
        );


        resetAdminForm();


        $("createTab")
            .click();


    }catch(error){

        console.error(
            "Create Admin Error:",
            error
        );


        /* REMOVE UPLOADED PHOTO IF FIRESTORE FAILS */

        try{

            if(
                authUser &&
                selectedPhotoFile
            ){

                const extension =
                    selectedPhotoFile.name
                        .split(".")
                        .pop()
                        .toLowerCase();

                await deleteObject(
                    ref(
                        storage,
                        "admin-photos/" +
                        authUser.uid +
                        "." +
                        extension
                    )
                );
            }

        }catch(cleanupError){

            console.warn(
                "Photo cleanup failed:",
                cleanupError
            );
        }


        showMsg(
            "formMsg",
            friendlyError(error)
        );

    }finally{

        $("saveBtn").disabled =
            false;

        if(editingUid){

            $("saveBtn").textContent =
                "Update Admin";

        }else{

            $("saveBtn").textContent =
                "Create Admin";
        }
    }
}


/* =========================
   EDIT ADMIN
========================= */

async function editAdmin(uid){

    try{

        hideMsg("formMsg");

        const snap =
            await getDoc(
                doc(
                    db,
                    USERS,
                    uid
                )
            );


        if(!snap.exists()){

            showMsg(
                "listMsg",
                "Admin record পাওয়া যায়নি।"
            );

            return;
        }


        const data =
            snap.data();


        editingUid =
            uid;


        $("formTitle").textContent =
            "Edit Admin";


        $("saveBtn").textContent =
            "Update Admin";


        $("cancelEditBtn")
            .classList
            .remove("hidden");


        $("passwordGroup")
            .classList
            .add("hidden");


        $("adminPassword")
            .required = false;


        $("adminName").value =
            data.name || "";


        $("adminEmail").value =
            data.email || "";


        /*
         * IMPORTANT:
         * Mobile remains editable only as the same existing value.
         * Duplicate mobile check below excludes this UID.
         */

        $("adminMobile").value =
            data.mobile || "";


        $("roleType").value =
            data.roleType ||
            data.role ||
            "";


        $("department").value =
            data.department ||
            "";


        $("status").value =
            data.status ||
            "Active";


        await loadCoreAdmins();


        $("reportsTo").value =
            data.reportsTo ||
            "Super Admin";


        $("roleType")
            .dispatchEvent(
                new Event("change")
            );


        if(data.photoURL){

            $("photoPreview").src =
                data.photoURL;

            $("photoPreview").style.display =
                "block";

            $("photoPlaceholder").style.display =
                "none";

        }else{

            $("photoPreview").src = "";

            $("photoPreview").style.display =
                "none";

            $("photoPlaceholder").style.display =
                "flex";
        }


        selectedPhotoFile =
            null;


        $("createTab")
            .click();


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


    }catch(error){

        console.error(
            "Edit Admin Error:",
            error
        );

        showMsg(
            "listMsg",
            friendlyError(error)
        );
    }
}
