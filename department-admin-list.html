<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Department Admin List - KALI LIFE ECOSYSTEM</title>

<script src="auth.js"></script>

<style>

/* ==========================================
   KALI LIFE ECOSYSTEM
   DEPARTMENT ADMIN LIST
   FINAL CSS
========================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
}

/* HEADER */

header {
    background: #166534;
    color: #ffffff;
    padding: 22px 15px;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
}

/* CONTAINER */

.container {
    width: 100%;
    max-width: 1400px;
    margin: 25px auto;
    padding: 0 15px 30px;
}

/* TOP ACTION AREA */

.top-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

/* CREATE BUTTON */

.create {
    background: #16a34a;
    color: #ffffff;
    padding: 13px 20px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,0.10);
    transition: 0.2s;
}

.create:hover {
    background: #15803d;
    transform: translateY(-1px);
}

/* SEARCH */

.searchBox {
    width: 100%;
    padding: 13px 15px;
    margin-bottom: 20px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: #ffffff;
    color: #0f172a;
    font-size: 16px;
    outline: none;
}

.searchBox:focus {
    border-color: #16a34a;
    box-shadow: 0 0 0 3px rgba(22,163,74,0.12);
}

/* TABLE WRAPPER */

.table-wrapper {
    width: 100%;
    overflow-x: auto;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}

/* TABLE */

table {
    width: 100%;
    min-width: 900px;
    border-collapse: collapse;
}

/* TABLE HEADER */

th {
    background: #166534;
    color: #ffffff;
    padding: 14px 10px;
    text-align: center;
    font-size: 15px;
    white-space: nowrap;
}

/* TABLE DATA */

td {
    padding: 13px 10px;
    text-align: center;
    border-bottom: 1px solid #e2e8f0;
    color: #334155;
    font-size: 14px;
}

/* ALTERNATE ROW */

tbody tr:nth-child(even) {
    background: #f8fafc;
}

tbody tr:hover {
    background: #f0fdf4;
}

/* STATUS */

td:nth-child(5) {
    font-weight: bold;
}

/* GENERAL BUTTON */

button {
    padding: 8px 13px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
    transition: 0.2s;
}

/* VIEW */

.view {
    background: #2563eb;
    color: #ffffff;
}

.view:hover {
    background: #1d4ed8;
}

/* EDIT */

.edit {
    background: #f59e0b;
    color: #ffffff;
}

.edit:hover {
    background: #d97706;
}

/* DELETE */

.delete {
    background: #dc2626;
    color: #ffffff;
}

.delete:hover {
    background: #b91c1c;
}

/* EMPTY TABLE MESSAGE */

.empty-message {
    text-align: center;
    padding: 30px;
    color: #64748b;
    font-size: 15px;
}

/* MOBILE */

@media (max-width: 700px) {

    header {
        font-size: 21px;
        padding: 18px 10px;
    }

    .container {
        padding: 0 10px 25px;
        margin-top: 20px;
    }

    .top-actions {
        flex-direction: column;
        align-items: stretch;
    }

    .create {
        width: 100%;
    }

    .searchBox {
        font-size: 15px;
    }

    .table-wrapper {
        border-radius: 10px;
    }

    th,
    td {
        padding: 11px 8px;
    }

}

</style>

</head>

<body>

<script>
checkLogin();
checkRole("Core Admin");
</script>

<header>
    DEPARTMENT ADMIN LIST
</header>

<div class="container">

    <div class="top-actions">

        <button
            class="create"
            onclick="window.location.href='create-department-admin.html'">
            ➕ Create Department Admin
        </button>

    </div>

    <input
        type="text"
        id="searchBox"
        class="searchBox"
        placeholder="🔍 Search Department Admin..."
        onkeyup="searchDepartmentAdmins()">

    <div class="table-wrapper">

        <table>

            <thead>

                <tr>
                    <th>SL</th>
                    <th>Admin ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Status</th>
                    <th>View</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>

            </thead>

            <tbody id="departmentTableBody">

            </tbody>

        </table>

    </div>

</div>

<script>

/* ==========================================
   LOAD DEPARTMENT ADMINS
========================================== */

function loadDepartmentAdmins() {

    let admins =
        JSON.parse(localStorage.getItem("departmentAdmins")) || [];

    let table =
        document.getElementById("departmentTableBody");

    table.innerHTML = "";

    if (admins.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="8" class="empty-message">
                    No Department Admin Found
                </td>
            </tr>
        `;

        return;
    }

    admins.forEach(function(admin, index) {

        table.innerHTML += `
        <tr>

            <td>${index + 1}</td>

            <td>${admin.id || ""}</td>

            <td>${admin.fullName || ""}</td>

            <td>${admin.department || ""}</td>

            <td>${admin.status || ""}</td>

            <td>
                <button
                    class="view"
                    onclick="viewDepartment(${index})">
                    View
                </button>
            </td>

            <td>
                <button
                    class="edit"
                    onclick="editDepartment(${index})">
                    Edit
                </button>
            </td>

            <td>
                <button
                    class="delete"
                    onclick="deleteDepartment(${index})">
                    Delete
                </button>
            </td>

        </tr>
        `;

    });

}


/* ==========================================
   SEARCH
========================================== */

function searchDepartmentAdmins() {

    let search =
        document.getElementById("searchBox")
        .value
        .toLowerCase();

    let rows =
        document.querySelectorAll(
            "#departmentTableBody tr"
        );

    rows.forEach(function(row) {

        let text =
            row.innerText.toLowerCase();

        if (text.includes(search)) {

            row.style.display = "";

        } else {

            row.style.display = "none";

        }

    });

}


/* ==========================================
   VIEW
========================================== */

function viewDepartment(id) {

    window.location.href =
        "view-department-admin.html?id=" + id;

}


/* ==========================================
   EDIT
========================================== */

function editDepartment(id) {

    window.location.href =
        "edit-department-admin.html?id=" + id;

}


/* ==========================================
   DELETE
========================================== */

function deleteDepartment(id) {

    let admins =
        JSON.parse(localStorage.getItem("departmentAdmins")) || [];

    if (
        confirm(
            "Are you sure you want to delete this Department Admin?"
        )
    ) {

        admins.splice(id, 1);

        localStorage.setItem(
            "departmentAdmins",
            JSON.stringify(admins)
        );

        loadDepartmentAdmins();

    }

}


/* ==========================================
   INITIAL LOAD
========================================== */

loadDepartmentAdmins();

</script>

</body>

</html>
