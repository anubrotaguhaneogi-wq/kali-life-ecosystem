<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Department Admin List - KALI LIFE ECOSYSTEM</title>

<script src="auth.js"></script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
}

header{
background:#008000;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
max-width:1400px;
margin:auto;
padding:20px;
}

.searchBox{
width:100%;
padding:12px;
font-size:16px;
border:none;
border-radius:8px;
margin-bottom:20px;
box-sizing:border-box;
}

table{
width:100%;
border-collapse:collapse;
background:#1f2937;
}

th{
background:#008000;
padding:12px;
}

td{
padding:12px;
text-align:center;
border-bottom:1px solid #374151;
}

button{
padding:8px 14px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
margin:2px;
}

.view{
background:#2563eb;
color:white;
}

.edit{
background:#f59e0b;
color:white;
}

.delete{
background:#dc2626;
color:white;
}

.create{
background:#16a34a;
color:white;
padding:12px 20px;
margin-bottom:20px;
font-size:16px;
}

</style>

</head>

<body>

<script>
checkLogin();
checkRole("Core Admin");
</script>

<header>

DEPARTMENT ADMIN LIST

</header>

<div class="container">

<button class="create">
➕ Create Department Admin
</button>

<input
type="text"
class="searchBox"
placeholder="Search Department Admin">

<table>

<tr>

<th>SL</th>
<th>Admin ID</th>
<th>Name</th>
<th>Department</th>
<th>Status</th>
<th>View</th>
<th>Edit</th>
<th>Delete</th>

</tr>
<tbody id="departmentTableBody">

</tbody>
</table>আমি 
</div>
<script>

function loadDepartmentAdmins(){

let admins = JSON.parse(localStorage.getItem("departmentAdmins")) || [];

let table = document.getElementById("departmentTableBody");

table.innerHTML = "";
admins.forEach(function(admin,index){

table.innerHTML += `
<tr>
<td>${index+1}</td>
<td>${admin.id}</td>
<td>${admin.fullName}</td>
<td>${admin.department}</td>
<td>${admin.status}</td>

<td><button class="view" onclick="viewDepartment(${index})">View</button></td>

<td><button class="edit" onclick="editDepartment(${index})">Edit</button></td>

<td><button class="delete" onclick="deleteDepartment(${index})">Delete</button></td>

</tr>
`;
});
}
function viewDepartment(id){

window.location.href="view-department-admin.html?id="+id;

}

function editDepartment(id){

window.location.href="edit-department-admin.html?id="+id;

}

function deleteDepartment(id){

let admins = JSON.parse(localStorage.getItem("departmentAdmins")) || [];

if(confirm("Are you sure you want to delete this Department Admin?")){

admins.splice(id,1);

localStorage.setItem("departmentAdmins",JSON.stringify(admins));

loadDepartmentAdmins();

}

  }
loadDepartmentAdmins();

</script>

</body>

</html>
