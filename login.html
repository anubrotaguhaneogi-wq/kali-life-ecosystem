<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALI LIFE ECOSYSTEM - Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #064e3b, #0f766e);
  font-family: Arial, sans-serif;
}

.login-box {
  width: 90%;
  max-width: 380px;
  background: white;
  padding: 30px 25px;
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

h1 {
  text-align: center;
  color: #065f46;
  font-size: 24px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 25px;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 15px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #059669;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #059669;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #047857;
}

#message {
  text-align: center;
  margin-top: 15px;
  color: #d00;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="login-box">

  <h1>KALI LIFE ECOSYSTEM</h1>

  <div class="subtitle">
    User Login
  </div>

  <form id="loginForm">

    <input
      type="tel"
      id="mobile"
      placeholder="Mobile Number"
      inputmode="numeric"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    >

    <button type="submit">
      Login
    </button>

  </form>

  <div id="message"></div>

</div>

<script type="module" src="auth.js"></script>
<script>
window.addEventListener("error", function(event) {

    const messageBox = document.getElementById("message");

    if (messageBox) {
        messageBox.style.color = "#dc2626";
        messageBox.textContent =
            "Login System Error: " +
            (event.message || "JavaScript Error");
    }

    console.error(
        "LOGIN ERROR:",
        event.message,
        event.filename,
        event.lineno
    );
});

window.addEventListener("unhandledrejection", function(event) {

    const messageBox = document.getElementById("message");

    if (messageBox) {
        messageBox.style.color = "#dc2626";
        messageBox.textContent =
            "Login Error: " +
            (event.reason?.message ||
             event.reason ||
             "Unknown Error");
    }

    console.error(
        "LOGIN PROMISE ERROR:",
        event.reason
    );
});
</script>
</body>
</html>
