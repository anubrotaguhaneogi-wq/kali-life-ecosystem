<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* ==========================================
   FIREBASE CONFIGURATION
========================================== */

const firebaseConfig = {
    apiKey: "AIzaSyDqXcxTrI22JuR1j9mtbUSCjGkT7B_OxZo",
    authDomain: "kali-life-ecosystem.firebaseapp.com",
    projectId: "kali-life-ecosystem",
    storageBucket: "kali-life-ecosystem.firebasestorage.app",
    messagingSenderId: "734170546737",
    appId: "1:734170546737:web:26f79e1b4b19ebabfe0b10",
    measurementId: "G-LBEY0W7RX3"
};


/* ==========================================
   INITIALIZE FIREBASE
========================================== */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* ==========================================
   USER LOGIN
========================================== */

window.loginUser = async function () {

    const mobileInput =
        document.getElementById("mobile");

    const passwordInput =
        document.getElementById("password");

    const errorBox =
        document.getElementById("error");

    const button =
        document.getElementById("loginBtn");


    const mobile =
        mobileInput.value.trim();

    const password =
        passwordInput.value;


    errorBox.innerText = "";


    /* ======================================
       MOBILE VALIDATION
    ====================================== */

    if (!/^[0-9]{10}$/.test(mobile)) {

        errorBox.innerText =
            "Please enter a valid 10 digit mobile number.";

        return;
    }


    /* ======================================
       PASSWORD VALIDATION
    ====================================== */

    if (!password) {

        errorBox.innerText =
            "Please enter your password.";

        return;
    }


    try {

        button.disabled = true;
        button.innerText = "Checking...";


        /* ==================================
           FIND USER BY MOBILE
           STRING FIRST
        ================================== */

        let userSnapshot;

        const stringQuery =
            query(
                collection(db, "users"),
                where("mobile", "==", mobile)
            );

        userSnapshot =
            await getDocs(stringQuery);


        /* ==================================
           IF NOT FOUND
           TRY NUMBER FORMAT
        ================================== */

        if (userSnapshot.empty) {

            const numberQuery =
                query(
                    collection(db, "users"),
                    where("mobile", "==", Number(mobile))
                );

            userSnapshot =
                await getDocs(numberQuery);
        }


        /* ==================================
           USER NOT FOUND
        ================================== */

        if (userSnapshot.empty) {

            showError(
                "Mobile number not found in user database."
            );

            return;
        }


        /* ==================================
           GET USER DATA
        ================================== */

        const userDoc =
            userSnapshot.docs[0];

        const user =
            userDoc.data();


        /* ==================================
           CHECK EMAIL
        ================================== */

        if (!user.email) {

            showError(
                "This account has no email linked with Firebase Authentication."
            );

            return;
        }


        /* ==================================
           CHECK STATUS
        ================================== */

        if (
            user.status &&
            String(user.status).toLowerCase() === "inactive"
        ) {

            showError(
                "Your account is inactive."
            );

            return;
        }


        /* ==================================
           FIREBASE AUTHENTICATION
        ================================== */

        button.innerText = "Logging in...";


        const credential =
            await signInWithEmailAndPassword(
                auth,
                user.email.trim(),
                password
            );


        const firebaseUser =
            credential.user;


        /* ==================================
           SAVE SESSION
        ================================== */

        localStorage.setItem(
            "isLoggedIn",
            "true"
        );

        localStorage.setItem(
            "userUid",
            firebaseUser.uid
        );

        localStorage.setItem(
            "userName",
            user.name || ""
        );

        localStorage.setItem(
            "userMobile",
            String(user.mobile || mobile)
        );

        localStorage.setItem(
            "userEmail",
            user.email || ""
        );

        localStorage.setItem(
            "userRole",
            user.role || "User"
        );


        /* ==================================
           LOGIN SUCCESS
        ================================== */

        alert("Login Successful!");


        /* ==================================
           ROLE REDIRECT
        ================================== */

        const role =
            user.role || "User";


        if (role === "Super Admin") {

            window.location.href =
                "super-admin-dashboard.html";

        }

        else if (role === "Core Admin") {

            window.location.href =
                "admin-dashboard.html";

        }

        else if (
            role !== "User"
        ) {

            window.location.href =
                "admin-dashboard.html";

        }

        else {

            window.location.href =
                "dashboard.html";
        }


    }

    catch (loginError) {

        console.error(
            "LOGIN ERROR:",
            loginError
        );


        /* ================================
           FIREBASE AUTH ERRORS
        ================================= */

        if (
            loginError.code ===
            "auth/invalid-credential"
        ) {

            showError(
                "Incorrect password or Firebase account details."
            );

        }

        else if (
            loginError.code ===
            "auth/user-not-found"
        ) {

            showError(
                "Firebase Authentication account not found."
            );

        }

        else if (
            loginError.code ===
            "auth/wrong-password"
        ) {

            showError(
                "Incorrect password."
            );

        }

        else if (
            loginError.code ===
            "auth/too-many-requests"
        ) {

            showError(
                "Too many login attempts. Please try again later."
            );

        }

        else if (
            loginError.code ===
            "auth/operation-not-allowed"
        ) {

            showError(
                "Email/Password Login is disabled in Firebase."
            );

        }

        else if (
            loginError.code ===
            "permission-denied"
        ) {

            showError(
                "Firebase permission denied. Check Firestore rules."
            );

        }

        else {

            showError(
                "Login failed: " +
                (loginError.message || "Unknown error")
            );
        }

    }

};


/* ==========================================
   ERROR HANDLER
========================================== */

function showError(message) {

    const errorBox =
        document.getElementById("error");

    const button =
        document.getElementById("loginBtn");


    errorBox.innerText = message;

    button.disabled = false;

    button.innerText = "Login";
}


/* ==========================================
   SHOW / HIDE PASSWORD
========================================== */

window.togglePassword = function () {

    const password =
        document.getElementById("password");

    const button =
        document.getElementById(
            "showPasswordBtn"
        );


    if (
        password.type === "password"
    ) {

        password.type = "text";

        button.innerText = "Hide";

    }

    else {

        password.type = "password";

        button.innerText = "Show";
    }

};

            </script>
