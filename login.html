<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#052e16">

<title>Login - KALI LIFE ECOSYSTEM</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #052e16,
            #064e3b,
            #0f172a
        );
}

.login-card {

    width: 100%;

    max-width: 430px;

    padding: 32px;

    background: #ffffff;

    border-radius: 22px;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,0.30);
}

.logo {

    text-align: center;

    color: #166534;

    font-size: 27px;

    font-weight: 800;

    margin-bottom: 5px;
}

.subtitle {

    text-align: center;

    color: #64748b;

    font-size: 12px;

    letter-spacing: 2px;

    font-weight: bold;

    margin-bottom: 28px;
}

h1 {

    text-align: center;

    color: #0f172a;

    font-size: 23px;

    margin-bottom: 24px;
}

.form-group {

    margin-bottom: 18px;
}

label {

    display: block;

    margin-bottom: 7px;

    color: #334155;

    font-size: 14px;

    font-weight: bold;
}

input {

    width: 100%;

    height: 50px;

    padding: 0 14px;

    border: 1px solid #cbd5e1;

    border-radius: 10px;

    outline: none;

    font-size: 15px;

    color: #0f172a;

    background: #ffffff;
}

input:focus {

    border-color: #16a34a;

    box-shadow:
        0 0 0 3px
        rgba(22,163,74,0.12);
}

.password-box {

    position: relative;
}

.password-box input {

    padding-right: 70px;
}

.show-password {

    position: absolute;

    right: 8px;

    top: 50%;

    transform:
        translateY(-50%);

    border: none;

    background: transparent;

    color: #166534;

    font-size: 12px;

    font-weight: bold;

    cursor: pointer;

    padding: 8px;
}

.login-button {

    width: 100%;

    height: 52px;

    margin-top: 5px;

    border: none;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #16a34a,
            #15803d
        );

    color: #ffffff;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}

.login-button:hover {

    transform:
        translateY(-1px);
}

.login-button:disabled {

    opacity: 0.65;

    cursor: not-allowed;

    transform: none;
}

.message {

    display: none;

    margin-top: 15px;

    padding: 11px;

    border-radius: 8px;

    text-align: center;

    font-size: 13px;

    font-weight: bold;

    line-height: 1.4;
}

.message.show {

    display: block;
}

.error {

    color: #b91c1c;

    background: #fef2f2;

    border: 1px solid #fecaca;
}

.success {

    color: #166534;

    background: #f0fdf4;

    border: 1px solid #bbf7d0;
}

.links {

    margin-top: 22px;

    padding-top: 18px;

    border-top: 1px solid #e2e8f0;

    text-align: center;
}

.links a {

    display: block;

    margin-top: 9px;

    color: #166534;

    text-decoration: none;

    font-size: 13px;

    font-weight: bold;
}

.links a:hover {

    text-decoration: underline;
}

.security {

    margin-top: 18px;

    text-align: center;

    color: #64748b;

    font-size: 11px;
}

@media (max-width: 480px) {

    body {

        padding: 12px;
    }

    .login-card {

        padding: 25px 20px;

        border-radius: 18px;
    }

    h1 {

        font-size: 21px;
    }
}

</style>

</head>

<body>

<div class="login-card">

    <div class="logo">
        KALI LIFE
    </div>

    <div class="subtitle">
        ECOSYSTEM
    </div>

    <h1>
        Account Login
    </h1>


    <!-- MOBILE -->

    <div class="form-group">

        <label for="mobile">
            Mobile Number
        </label>

        <input
            id="mobile"
            type="tel"
            inputmode="numeric"
            maxlength="10"
            autocomplete="tel"
            placeholder="Enter 10 digit mobile number"
        >

    </div>


    <!-- PASSWORD -->

    <div class="form-group">

        <label for="password">
            Password
        </label>

        <div class="password-box">

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
            >

            <button
                type="button"
                id="showPassword"
                class="show-password">

                Show

            </button>

        </div>

    </div>


    <!-- LOGIN -->

    <button
        type="button"
        id="loginButton"
        class="login-button">

        Login

    </button>


    <!-- ERROR -->

    <div
        id="errorMessage"
        class="message error">
    </div>


    <!-- SUCCESS -->

    <div
        id="successMessage"
        class="message success">
    </div>


    <!-- LINKS -->

    <div class="links">

        <a href="register.html">
            Create New Account
        </a>

        <a href="index.html">
            ← Back to Home
        </a>

    </div>


    <div class="security">
        🔒 Secure account access
    </div>

</div>


<!-- ======================================================
     AUTH SESSION SYSTEM
====================================================== -->

<script src="auth.js"></script>


<!-- ======================================================
     FIREBASE LOGIN
====================================================== -->

<script type="module">

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    query,
    where,
    getDocs
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* ======================================================
   FIREBASE CONFIG
====================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDqXcxTrI22JuR1j9mtbUSCjGkT7B_OxZo",

    authDomain:
        "kali-life-ecosystem.firebaseapp.com",

    projectId:
        "kali-life-ecosystem",

    storageBucket:
        "kali-life-ecosystem.firebasestorage.app",

    messagingSenderId:
        "734170546737",

    appId:
        "1:734170546737:web:26f79e1b4b19ebabfe0b10",

    measurementId:
        "G-LBEY0W7RX3"

};


/* ======================================================
   INITIALIZE FIREBASE
====================================================== */

const app =
    initializeApp(
        firebaseConfig
    );

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* ======================================================
   ELEMENTS
====================================================== */

const mobileInput =
    document.getElementById(
        "mobile"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const showPassword =
    document.getElementById(
        "showPassword"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );

const successMessage =
    document.getElementById(
        "successMessage"
    );


/* ======================================================
   SHOW / HIDE PASSWORD
====================================================== */

showPassword.addEventListener(
    "click",
    function () {

        if (
            passwordInput.type ===
            "password"
        ) {

            passwordInput.type =
                "text";

            showPassword.textContent =
                "Hide";

        } else {

            passwordInput.type =
                "password";

            showPassword.textContent =
                "Show";

        }

    }
);


/* ======================================================
   MOBILE INPUT
====================================================== */

mobileInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .replace(/\D/g, "")
                .slice(0, 10);

    }
);


/* ======================================================
   MESSAGE HELPERS
====================================================== */

function clearMessages() {

    errorMessage.textContent =
        "";

    successMessage.textContent =
        "";

    errorMessage.classList.remove(
        "show"
    );

    successMessage.classList.remove(
        "show"
    );

}


function showError(message) {

    errorMessage.textContent =
        message;

    errorMessage.classList.add(
        "show"
    );

    successMessage.classList.remove(
        "show"
    );

}


function showSuccess(message) {

    successMessage.textContent =
        message;

    successMessage.classList.add(
        "show"
    );

    errorMessage.classList.remove(
        "show"
    );

}


/* ======================================================
   LOADING
====================================================== */

function setLoading(loading) {

    loginButton.disabled =
        loading;

    loginButton.textContent =
        loading
            ? "Signing in..."
            : "Login";

}


/* ======================================================
   LOGIN FUNCTION
====================================================== */

async function loginUser() {

    clearMessages();


    const mobile =
        mobileInput.value.trim();

    const password =
        passwordInput.value;


    /* --------------------------------------------------
       VALIDATION
    -------------------------------------------------- */

    if (
        !/^[0-9]{10}$/.test(
            mobile
        )
    ) {

        showError(
            "Please enter a valid 10 digit mobile number."
        );

        mobileInput.focus();

        return;
    }


    if (!password) {

        showError(
            "Please enter your password."
        );

        passwordInput.focus();

        return;
    }


    setLoading(true);


    try {

        /* ==================================================
           FIND PROFILE BY MOBILE
        ================================================== */

        const userQuery =
            query(
                collection(
                    db,
                    "users"
                ),

                where(
                    "mobile",
                    "==",
                    mobile
                )
            );


        const snapshot =
            await getDocs(
                userQuery
            );


        if (
            snapshot.empty
        ) {

            showError(
                "No account found with this mobile number."
            );

            setLoading(false);

            return;
        }


        /* ==================================================
           USER PROFILE
        ================================================== */

        const userDoc =
            snapshot.docs[0];

        const userData =
            userDoc.data();


        /* ==================================================
           ACCOUNT STATUS
        ================================================== */

        if (
            userData.status &&
            userData.status !==
            "Active"
        ) {

            showError(
                "This account is inactive."
            );

            setLoading(false);

            return;
        }


        /* ==================================================
           GET EMAIL
        ================================================== */

        const email =
            String(
                userData.email || ""
            )
            .trim()
            .toLowerCase();


        if (!email) {

            showError(
                "Account email information is missing."
            );

            setLoading(false);

            return;
        }


        /* ==================================================
           FIREBASE AUTHENTICATION
        ================================================== */

        const credential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const firebaseUser =
            credential.user;


        /* ==================================================
           VERSION 1 ROLE
           
           ONLY:
           Super Admin
           Admin
           User
        ================================================== */

        let role =
            userData.role ||
            "User";


        if (
            role !== "Super Admin" &&
            role !== "Admin" &&
            role !== "User"
        ) {

            role =
                "User";
        }


        /* ==================================================
           SAVE SESSION
        ================================================== */

        if (
            typeof createSession !==
            "function"
        ) {

            throw new Error(
                "Authentication session system is unavailable."
            );
        }


        createSession({

            name:
                userData.name ||
                firebaseUser.displayName ||
                "User",

            mobile:
                userData.mobile ||
                mobile,

            email:
                userData.email ||
                firebaseUser.email ||
                "",

            role:
                role,

            uid:
                firebaseUser.uid,

            adminId:
                userData.adminId ||
                "",

            reportsTo:
                userData.reportsTo ||
                ""

        });


        /* ==================================================
           SUCCESS
        ================================================== */

        showSuccess(
            "Login successful!"
        );


        /* ==================================================
           REDIRECT
        ================================================== */

        setTimeout(
            function () {

                if (
                    typeof redirectToDashboard ===
                    "function"
                ) {

                    redirectToDashboard();

                } else {

                    window.location.href =
                        "admin-dashboard.html";

                }

            },
            500
        );


    } catch (error) {

        console.error(
            "Login Error:",
            error
        );


        if (
            error.code ===
            "auth/invalid-credential"
        ) {

            showError(
                "Incorrect mobile number or password."
            );

        }

        else if (
            error.code ===
            "auth/invalid-login-credentials"
        ) {

            showError(
                "Incorrect mobile number or password."
            );

        }

        else if (
            error.code ===
            "auth/user-disabled"
        ) {

            showError(
                "This account has been disabled."
            );

        }

        else if (
            error.code ===
            "auth/too-many-requests"
        ) {

            showError(
                "Too many attempts. Please try again later."
            );

        }

        else {

    showError(
        "Firebase Error: " +
        (error.code || "unknown") +
        " — " +
        (error.message || "Unknown error")
    );

    }


        setLoading(false);

    }

}


/* ======================================================
   LOGIN BUTTON
====================================================== */

loginButton.addEventListener(
    "click",
    loginUser
);


/* ======================================================
   ENTER KEY
====================================================== */

passwordInput.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key ===
            "Enter"
        ) {

            loginUser();

        }

    }
);

</script>

</body>

</html>
