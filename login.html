<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#052e16">

<title>Login - KALI LIFE ECOSYSTEM</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, Helvetica, sans-serif;

    background:
        linear-gradient(
            135deg,
            #052e16,
            #064e3b,
            #0f172a
        );
}

.login-card {
    width: 100%;
    max-width: 430px;
    padding: 32px;
    background: #ffffff;
    border-radius: 22px;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,0.30);
}

.logo {
    text-align: center;
    color: #166534;
    font-size: 27px;
    font-weight: 800;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    font-size: 12px;
    letter-spacing: 2px;
    font-weight: bold;
    margin-bottom: 28px;
}

h1 {
    text-align: center;
    color: #0f172a;
    font-size: 23px;
    margin-bottom: 24px;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 7px;
    color: #334155;
    font-size: 14px;
    font-weight: bold;
}

input {
    width: 100%;
    height: 50px;
    padding: 0 14px;

    border: 1px solid #cbd5e1;
    border-radius: 10px;
    outline: none;

    font-size: 15px;
    color: #0f172a;
    background: #ffffff;
}

input:focus {
    border-color: #16a34a;

    box-shadow:
        0 0 0 3px
        rgba(22,163,74,0.12);
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 70px;
}

.show-password {
    position: absolute;
    right: 8px;
    top: 50%;

    transform:
        translateY(-50%);

    border: none;
    background: transparent;

    color: #166534;
    font-size: 12px;
    font-weight: bold;

    cursor: pointer;
    padding: 8px;
}

.login-button,
.reset-button {

    width: 100%;
    height: 52px;

    margin-top: 5px;

    border: none;
    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #16a34a,
            #15803d
        );

    color: #ffffff;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}

.login-button:hover,
.reset-button:hover {

    transform:
        translateY(-1px);
}

.login-button:disabled,
.reset-button:disabled {

    opacity: 0.65;
    cursor: not-allowed;

    transform: none;
}

.forgot-button {

    display: block;

    width: 100%;

    margin-top: 14px;

    border: none;

    background: transparent;

    color: #166534;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;
}

.forgot-button:hover {

    text-decoration: underline;
}

.reset-panel {

    display: none;

    margin-top: 18px;

    padding: 18px;

    background: #f8fafc;

    border: 1px solid #e2e8f0;

    border-radius: 12px;
}

.reset-panel.show {

    display: block;
}

.reset-title {

    text-align: center;

    color: #0f172a;

    font-size: 16px;

    font-weight: bold;

    margin-bottom: 12px;
}

.reset-text {

    text-align: center;

    color: #64748b;

    font-size: 12px;

    line-height: 1.5;

    margin-bottom: 14px;
}

.message {

    display: none;

    margin-top: 15px;

    padding: 11px;

    border-radius: 8px;

    text-align: center;

    font-size: 13px;

    font-weight: bold;

    line-height: 1.4;
}

.message.show {

    display: block;
}

.error {

    color: #b91c1c;

    background: #fef2f2;

    border: 1px solid #fecaca;
}

.success {

    color: #166534;

    background: #f0fdf4;

    border: 1px solid #bbf7d0;
}

.links {

    margin-top: 22px;

    padding-top: 18px;

    border-top: 1px solid #e2e8f0;

    text-align: center;
}

.links a {

    display: block;

    margin-top: 9px;

    color: #166534;

    text-decoration: none;

    font-size: 13px;

    font-weight: bold;
}

.links a:hover {

    text-decoration: underline;
}

.security {

    margin-top: 18px;

    text-align: center;

    color: #64748b;

    font-size: 11px;
}

@media (max-width: 480px) {

    body {

        padding: 12px;
    }

    .login-card {

        padding: 25px 20px;

        border-radius: 18px;
    }

    h1 {

        font-size: 21px;
    }
}

</style>

</head>

<body>

<div class="login-card">

    <div class="logo">
        KALI LIFE
    </div>

    <div class="subtitle">
        ECOSYSTEM
    </div>

    <h1>
        Account Login
    </h1>


    <!-- MOBILE -->

    <div class="form-group">

        <label for="mobile">
            Mobile Number
        </label>

        <input
            id="mobile"
            type="tel"
            inputmode="numeric"
            maxlength="10"
            autocomplete="tel"
            placeholder="Enter 10 digit mobile number"
        >

    </div>


    <!-- PASSWORD -->

    <div class="form-group">

        <label for="password">
            Password
        </label>

        <div class="password-box">

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
            >

            <button
                type="button"
                id="showPassword"
                class="show-password">

                Show

            </button>

        </div>

    </div>


    <!-- LOGIN -->

    <button
        type="button"
        id="loginButton"
        class="login-button">

        Login

    </button>


    <!-- FORGOT PASSWORD -->

    <button
        type="button"
        id="forgotButton"
        class="forgot-button">

        Forgot Password?

    </button>


    <!-- RESET PANEL -->

    <div
        id="resetPanel"
        class="reset-panel">

        <div class="reset-title">

            Reset Your Password

        </div>

        <div class="reset-text">

            Enter your registered 10 digit mobile number.
            We will find your account email and send a
            password reset link.

        </div>


        <div class="form-group">

            <label for="resetMobile">

                Mobile Number

            </label>

            <input
                id="resetMobile"
                type="tel"
                inputmode="numeric"
                maxlength="10"
                autocomplete="tel"
                placeholder="Enter 10 digit mobile number"
            >

        </div>


        <button
            type="button"
            id="resetButton"
            class="reset-button">

            Send Reset Link

        </button>

    </div>


    <!-- ERROR -->

    <div
        id="errorMessage"
        class="message error">
    </div>


    <!-- SUCCESS -->

    <div
        id="successMessage"
        class="message success">
    </div>


    <!-- LINKS -->

    <div class="links">

        <a href="register.html">
            Create New Account
        </a>

        <a href="index.html">
            ← Back to Home
        </a>

    </div>


    <div class="security">

        🔒 Secure account access

    </div>

</div>


<!-- AUTH SESSION SYSTEM -->

<script src="auth.js"></script>


<!-- FIREBASE -->

<script type="module">

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    query,
    where,
    getDocs
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* ======================================================
   FIREBASE CONFIG
====================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDqXcxTrI22JuR1j9mtbUSCjGkT7B_OxZo",

    authDomain:
        "kali-life-ecosystem.firebaseapp.com",

    projectId:
        "kali-life-ecosystem",

    storageBucket:
        "kali-life-ecosystem.firebasestorage.app",

    messagingSenderId:
        "734170546737",

    appId:
        "1:734170546737:web:26f79e1b4b19ebabfe0b10",

    measurementId:
        "G-LBEY0W7RX3"

};


/* ======================================================
   INITIALIZE FIREBASE
====================================================== */

const app =
    initializeApp(
        firebaseConfig
    );

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* ======================================================
   ELEMENTS
====================================================== */

const mobileInput =
    document.getElementById(
        "mobile"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const resetMobile =
    document.getElementById(
        "resetMobile"
    );

const showPassword =
    document.getElementById(
        "showPassword"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const forgotButton =
    document.getElementById(
        "forgotButton"
    );

const resetPanel =
    document.getElementById(
        "resetPanel"
    );

const resetButton =
    document.getElementById(
        "resetButton"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );

const successMessage =
    document.getElementById(
        "successMessage"
    );


/* ======================================================
   HELPERS
====================================================== */

function clearMessages() {

    errorMessage.textContent =
        "";

    successMessage.textContent =
        "";

    errorMessage.classList.remove(
        "show"
    );

    successMessage.classList.remove(
        "show"
    );
}


function showError(message) {

    errorMessage.textContent =
        message;

    errorMessage.classList.add(
        "show"
    );

    successMessage.classList.remove(
        "show"
    );
}


function showSuccess(message) {

    successMessage.textContent =
        message;

    successMessage.classList.add(
        "show"
    );

    errorMessage.classList.remove(
        "show"
    );
}


function cleanMobile(value) {

    return String(value || "")
        .replace(/\D/g, "")
        .slice(0, 10);
}


/* ======================================================
   LOADING
====================================================== */

function setLoginLoading(loading) {

    loginButton.disabled =
        loading;

    loginButton.textContent =
        loading
            ? "Signing in..."
            : "Login";
}


function setResetLoading(loading) {

    resetButton.disabled =
        loading;

    resetButton.textContent =
        loading
            ? "Sending..."
            : "Send Reset Link";
}


/* ======================================================
   FIND USER BY MOBILE
====================================================== */

async function findUserByMobile(mobile) {

    const userQuery =
        query(
            collection(
                db,
                "users"
            ),

            where(
                "mobile",
                "==",
                mobile
            )
        );


    const snapshot =
        await getDocs(
            userQuery
        );


    if (
        snapshot.empty
    ) {

        return null;
    }


    const userDoc =
        snapshot.docs[0];


    return {

        id:
            userDoc.id,

        data:
            userDoc.data()

    };
}


/* ======================================================
   SHOW / HIDE PASSWORD
====================================================== */

showPassword.addEventListener(
    "click",
    function () {

        if (
            passwordInput.type ===
            "password"
        ) {

            passwordInput.type =
                "text";

            showPassword.textContent =
                "Hide";

        } else {

            passwordInput.type =
                "password";

            showPassword.textContent =
                "Show";

        }

    }
);


/* ======================================================
   MOBILE INPUT
====================================================== */

mobileInput.addEventListener(
    "input",
    function () {

        this.value =
            cleanMobile(
                this.value
            );

    }
);


resetMobile.addEventListener(
    "input",
    function () {

        this.value =
            cleanMobile(
                this.value
            );

    }
);


/* ======================================================
   FORGOT PASSWORD PANEL
====================================================== */

forgotButton.addEventListener(
    "click",
    function () {

        clearMessages();

        resetPanel.classList.toggle(
            "show"
        );


        if (
            resetPanel.classList.contains(
                "show"
            )
        ) {

            resetMobile.value =
                mobileInput.value;

            resetMobile.focus();

        }

    }
);


/* ======================================================
   LOGIN
====================================================== */

async function loginUser() {

    clearMessages();


    const mobile =
        cleanMobile(
            mobileInput.value
        );


    const password =
        passwordInput.value;


    if (
        !/^[0-9]{10}$/.test(
            mobile
        )
    ) {

        showError(
            "Please enter a valid 10 digit mobile number."
        );

        mobileInput.focus();

        return;
    }


    if (!password) {

        showError(
            "Please enter your password."
        );

        passwordInput.focus();

        return;
    }


    setLoginLoading(
        true
    );


    try {

        const result =
            await findUserByMobile(
                mobile
            );


        if (!result) {

            showError(
                "No account found with this mobile number."
            );

            setLoginLoading(
                false
            );

            return;
        }


        const userData =
            result.data;


        if (
            userData.status &&
            userData.status !==
            "Active"
        ) {

            showError(
                "This account is inactive."
            );

            setLoginLoading(
                false
            );

            return;
        }


        const email =
            String(
                userData.email ||
                ""
            )
            .trim()
            .toLowerCase();


        if (!email) {

            showError(
                "This account has no email address. An administrator must add the account email before login or password reset can work."
            );

            setLoginLoading(
                false
            );

            return;
        }


        const credential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const firebaseUser =
            credential.user;


        let role =
            userData.role ||
            "User";


        if (
            role !==
                "Super Admin" &&
            role !==
                "Admin" &&
            role !==
                "User"
        ) {

            role =
                "User";
        }


        if (
            typeof createSession !==
            "function"
        ) {

            throw new Error(
                "Authentication session system is unavailable."
            );
        }


        createSession({

            name:
                userData.name ||
                firebaseUser.displayName ||
                "User",

            mobile:
                userData.mobile ||
                mobile,

            email:
                userData.email ||
                firebaseUser.email ||
                "",

            role:
                role,

            uid:
                firebaseUser.uid,

            adminId:
                userData.adminId ||
                "",

            reportsTo:
                userData.reportsTo ||
                ""

        });


        showSuccess(
            "Login successful!"
        );


        setTimeout(
            function () {

                if (
                    typeof redirectToDashboard ===
                    "function"
                ) {

                    redirectToDashboard();

                } else {

                    window.location.href =
                        "admin-dashboard.html";

                }

            },
            500
        );


    } catch (error) {

        console.error(
            "Login Error:",
            error
        );


        if (
            error.code ===
                "auth/invalid-credential" ||

            error.code ===
                "auth/invalid-login-credentials"
        ) {

            showError(
                "Incorrect mobile number or password."
            );

        }

        else if (
            error.code ===
            "auth/user-disabled"
        ) {

            showError(
                "This account has been disabled."
            );

        }

        else if (
            error.code ===
            "auth/too-many-requests"
        ) {

            showError(
                "Too many attempts. Please try again later."
            );

        }

        else if (
            error.code ===
                "auth/api-key-not-valid" ||

            error.code ===
                "auth/invalid-api-key"
        ) {

            showError(
                "Firebase configuration error: the Firebase Web API key is not valid."
            );

        }

        else {

            showError(
                "Firebase Error: " +
                (
                    error.code ||
                    "unknown"
                ) +
                " — " +
                (
                    error.message ||
                    "Unknown error"
                )
            );

        }


        setLoginLoading(
            false
        );

    }

}


/* ======================================================
   LOGIN BUTTON
====================================================== */

loginButton.addEventListener(
    "click",
    loginUser
);


/* ======================================================
   ENTER KEY
====================================================== */

passwordInput.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key ===
            "Enter"
        ) {

            loginUser();

        }

    }
);


/* ======================================================
   FORGOT PASSWORD
====================================================== */

async function resetPassword() {

    clearMessages();


    const mobile =
        cleanMobile(
            resetMobile.value
        );


    if (
        !/^[0-9]{10}$/.test(
            mobile
        )
    ) {

        showError(
            "Please enter a valid 10 digit mobile number."
        );

        resetMobile.focus();

        return;
    }


    setResetLoading(
        true
    );


    try {

        const result =
            await findUserByMobile(
                mobile
            );


        if (!result) {

            showError(
                "No account found with this mobile number."
            );

            setResetLoading(
                false
            );

            return;
        }


        const userData =
            result.data;


        if (
            userData.status &&
            userData.status !==
            "Active"
        ) {

            showError(
                "This account is inactive."
            );

            setResetLoading(
               
        if (
            userData.status &&
            userData.status !==
            "Active"
        ) {

            showError(
                "This account is inactive."
            );

            setResetLoading(
                false
            );

            return;

        }


        /* ======================================================
           GET ACCOUNT EMAIL
        ====================================================== */

        const email =
            String(
                userData.email ||
                ""
            )
            .trim()
            .toLowerCase();


        if (!email) {

            showError(
                "This account has no email address. Please contact the administrator to add an email address."
            );

            setResetLoading(
                false
            );

            return;

        }


        /* ======================================================
           SEND FIREBASE PASSWORD RESET EMAIL
        ====================================================== */

        await sendPasswordResetEmail(
            auth,
            email
        );


        showSuccess(
            "Password reset link has been sent to your registered email address."
        );


        setResetLoading(
            false
        );


    } catch (error) {

        console.error(
            "Password Reset Error:",
            error
        );


        /* ======================================================
           PASSWORD RESET ERROR HANDLING
        ====================================================== */

        if (
            error.code ===
            "auth/user-not-found"
        ) {

            showError(
                "No Firebase account was found for this email address."
            );

        }

        else if (
            error.code ===
            "auth/invalid-email"
        ) {

            showError(
                "The account email address is invalid."
            );

        }

        else if (
            error.code ===
            "auth/too-many-requests"
        ) {

            showError(
                "Too many reset requests. Please try again later."
            );

        }

        else if (
            error.code ===
            "auth/network-request-failed"
        ) {

            showError(
                "Network error. Please check your internet connection and try again."
            );

        }

        else {

            showError(
                "Password reset failed: " +
                (
                    error.code ||
                    "unknown"
                ) +
                " — " +
                (
                    error.message ||
                    "Unknown error"
                )
            );

        }


        setResetLoading(
            false
        );

    }

}


/* ======================================================
   RESET BUTTON
====================================================== */

resetButton.addEventListener(
    "click",
    resetPassword
);


/* ======================================================
   ENTER KEY FOR RESET PASSWORD
====================================================== */

resetMobile.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key ===
            "Enter"
        ) {

            resetPassword();

        }

    }
);


/* ======================================================
   FINISH
====================================================== */

</script>

</body>

</html>
