/* =========================================================
   KALI LIFE ECOSYSTEM
   PREMIUM LOGIN PAGE
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

}

body {

}

/* =========================================================
   BACKGROUND
========================================================= */

.background-glow {
    position: fixed;
    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 0;
}

.glow {
    position: absolute;

    border-radius: 50%;

    filter: blur(90px);

    opacity: 0.18;
}

.glow-one {
    width: 280px;
    height: 280px;

    top: -120px;
    left: -100px;

    background: #22c55e;
}

.glow-two {
    width: 320px;
    height: 320px;

    right: -130px;
    bottom: -140px;

    background: #16a34a;
}

/* =========================================================
   WRAPPER
========================================================= */

.login-wrapper {
    position: relative;

    width: 100%;
    max-width: 440px;

    z-index: 2;
}

/* =========================================================
   CARD
========================================================= */

.login-card {
    width: 100%;

    padding: 34px 32px 30px;

    background:
        rgba(255,255,255,0.97);

    border:
        1px solid rgba(255,255,255,0.7);

    border-radius: 24px;

    box-shadow:
        0 30px 80px rgba(0,0,0,0.30),
        0 10px 30px rgba(0,0,0,0.12);

    backdrop-filter: blur(18px);

    animation:
        cardEnter 0.45s ease;
}

@keyframes cardEnter {

    from {
        opacity: 0;
        transform:
            translateY(18px)
            scale(0.98);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}

/* =========================================================
   BRAND
========================================================= */

.brand {
    text-align: center;

    margin-bottom: 26px;
}

.brand-icon {
    width: 64px;
    height: 64px;

    margin: 0 auto 14px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #16a34a,
            #15803d
        );

    color: #ffffff;

    font-size: 29px;

    box-shadow:
        0 10px 28px
        rgba(22,163,74,0.30);
}

.brand-name {
    color: #14532d;

    font-size: 25px;

    font-weight: 800;

    letter-spacing: 0.5px;
}

.brand-subtitle {
    margin-top: 5px;

    color: #64748b;

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 2.5px;
}

/* =========================================================
   TITLE
========================================================= */

.login-title {
    text-align: center;

    margin-bottom: 25px;
}

.login-title h1 {
    color: #0f172a;

    font-size: 23px;

    font-weight: 800;
}

.login-title p {
    margin-top: 7px;

    color: #64748b;

    font-size: 13px;
}

/* =========================================================
   FORM
========================================================= */

.form-group {
    margin-bottom: 18px;
}

.form-label {
    display: block;

    margin-bottom: 8px;

    color: #334155;

    font-size: 13px;

    font-weight: 700;
}

/* =========================================================
   INPUT
========================================================= */

.input-wrapper {
    position: relative;
}

.input-icon {
    position: absolute;

    left: 14px;
    top: 50%;

    transform: translateY(-50%);

    font-size: 17px;

    pointer-events: none;
}

.form-input {
    width: 100%;
    height: 50px;

    padding:

    border:

    border-radius: 11px;

    background: #ffffff;

    color: #0f172a;

    font-size: 15px;

    transition:
        border-color 0.2s ease,

}

.form-input::placeholder {
    color: #94a3b8;
}

.form-input:hover {
    border-color: #94a3b8;
}

.form-input:focus {
    border-color: #16a34a;

    box-shadow:
        0 0 0 4px
        rgba(22,163,74,0.10);
}

/* =========================================================
   PASSWORD
========================================================= */

.password-input {
    padding-right: 75px;
}

.password-toggle {
    position: absolute;

    right: 9px;
    top: 50%;

    transform: translateY(-50%);

    border: none;

    background: transparent;

    color: #166534;

    font-size: 12px;

    font-weight: 800;

    padding: 7px 9px;

    border-radius: 7px;

    cursor: pointer;
}

.password-toggle:hover {
    background: #f0fdf4;
}

/* =========================================================
   LOGIN BUTTON
========================================================= */

.login-button {
    width: 100%;
    height: 52px;

    margin-top: 3px;

    border: none;

    border-radius: 11px;

    background:
        linear-gradient(
            135deg,
            #16a34a,
            #15803d
        );

    color: #ffffff;

    font-size: 15px;

    font-weight: 800;

    letter-spacing: 0.2px;

    cursor: pointer;

    box-shadow:
        0 8px 22px
        rgba(22,163,74,0.25);

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        opacity 0.15s ease;
}

.login-button:hover {
    transform: translateY(-1px);

    box-shadow:
        0 12px 28px
        rgba(22,163,74,0.32);
}

.login-button:active {
    transform: translateY(0);
}

.login-button:disabled {
    opacity: 0.65;

    cursor: not-allowed;

    transform: none;

    box-shadow: none;
}

/* =========================================================
   LOADING
========================================================= */

.button-content {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 9px;
}

.spinner {
    width: 17px;
    height: 17px;

    border:
        2px solid
        rgba(255,255,255,0.35);

    border-top-color:
        #ffffff;

    border-radius: 50%;

    animation:
        spin 0.7s linear infinite;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }
}

/* =========================================================
   MESSAGES
========================================================= */

.message {
    display: none;

    margin-top: 15px;

    padding: 11px 13px;

    border-radius: 9px;

    font-size: 13px;

    font-weight: 700;

    line-height: 1.45;
}

.message.show {
    display: block;
}

.error-message {
    background: #fef2f2;

    border:
        1px solid #fecaca;

    color: #b91c1c;
}

.success-message {
    background: #f0fdf4;

    border:
        1px solid #bbf7d0;

    color: #166534;
}

/* =========================================================
   LINKS
========================================================= */

.links {
    margin-top: 21px;

    text-align: center;
}

.link {
    display: block;

    margin-top: 10px;

    color: #166534;

    text-decoration: none;

    font-size: 13px;

    font-weight: 700;
}

.link:hover {
    color: #15803d;

    text-decoration: underline;
}

/* =========================================================
   SECURITY
========================================================= */

.security {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 7px;

    margin-top: 24px;

    padding-top: 18px;

    border-top:
        1px solid #e2e8f0;

    color: #64748b;

    font-size: 11px;

    text-align: center;
}

/* =========================================================
   FOOTER
========================================================= */

.footer {
    margin-top: 16px;

    text-align: center;

    color:
        rgba(255,255,255,0.70);

    font-size: 11px;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 480px) {

    body {

        width: 58px;
        height: 58px;

        font-size: 27px;
    }

    .brand-name {
        font-size: 23px;
    }

    .login-title h1 {
        font-size: 21px;
    }
}

passwordToggle.addEventListener(

    function () {

        if (
            passwordInput.type === "password"
        ) {

            passwordInput.type = "text";

            passwordToggle.textContent =
                "Hide";

        } else {

            passwordInput.type =
                "password";

        }

    }
);


/* =========================================================
   MOBILE NUMBER

========================================================= */

mobileInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value
            .replace(/\D/g, "")
            .slice(0, 10);

    }
);


/* =========================================================
   MESSAGE HELPERS
========================================================= */

function clearMessages() {

    errorMessage.textContent = "";

    successMessage.textContent = "";

    errorMessage.classList.remove(
        "show"
    );

    successMessage.classList.remove(
        "show"
    );

}


function showError(message) {

    errorMessage.textContent =
        message;

    errorMessage.classList.add(
        "show"
    );

    successMessage.classList.remove(
        "show"
    );

}


function showSuccess(message) {

    successMessage.textContent =
        message;

    successMessage.classList.add(
        "show"
    );

    errorMessage.classList.remove(
        "show"
    );

}


/* =========================================================

========================================================= */

function setLoading(loading) {

    loginButton.disabled =
        loading;

    if (loading) {

        buttonContent.innerHTML =
            '<span class="spinner"></span> Signing in...';

    } else {

        buttonContent.textContent =
            "Login";

    }

}

            await getDocs(

                );

                await getDocs(
                    numberQuery
                );

        }

           USER NOT FOUND
