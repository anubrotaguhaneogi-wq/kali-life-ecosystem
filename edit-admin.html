<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Edit / পদ পরিবর্তন - KALI LIFE ECOSYSTEM</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f0fdf4;
    color:#1f2937;
    padding:20px;
}

.container{
    max-width:650px;
    margin:auto;
}

.header{
    background:#166534;
    color:white;
    padding:25px 20px;
    border-radius:16px;
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    margin:0 0 8px;
    font-size:25px;
}

.header p{
    margin:0;
    font-size:14px;
}

.card{
    background:white;
    border-radius:16px;
    padding:24px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.section-title{
    margin-top:0;
    color:#166534;
    font-size:22px;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    font-weight:700;
    margin-bottom:7px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    font-size:15px;
    background:white;
}

input[readonly]{
    background:#f1f5f9;
}

.hint{
    margin-top:6px;
    font-size:12px;
    color:#64748b;
    line-height:1.5;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:22px;
}

button{
    border:0;
    border-radius:9px;
    padding:12px 18px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.save-button{
    background:#166534;
    color:white;
    flex:1;
}

.cancel-button{
    background:#e2e8f0;
    color:#1e293b;
    flex:1;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:18px;
    padding:12px;
    border-radius:9px;
    font-size:14px;
    line-height:1.5;
}

.message.show{
    display:block;
}

.message.success{
    background:#dcfce7;
    color:#166534;
}

.message.error{
    background:#fee2e2;
    color:#991b1b;
}

.message.info{
    background:#dbeafe;
    color:#1e40af;
}

.loading{
    text-align:center;
    padding:30px 10px;
    color:#64748b;
}

.hidden{
    display:none !important;
}

.links{
    margin-top:20px;
    text-align:center;
}

.links a{
    color:#166534;
    text-decoration:none;
    font-weight:700;
    margin:0 8px;
    font-size:13px;
}

.links a:hover{
    text-decoration:underline;
}

@media(max-width:600px){
    body{
        padding:10px;
    }

    .card{
        padding:18px;
    }

    .buttons{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🔐 Admin Management</h1>
        <p>KALI LIFE ECOSYSTEM</p>
    </div>

    <div class="card">

        <h2 class="section-title">Admin Edit / পদ পরিবর্তন</h2>

        <div id="loadingBox" class="loading">
            Admin তথ্য লোড হচ্ছে...
        </div>

        <div id="editBox" class="hidden">

            <div class="form-group">
                <label for="eName">Full Name</label>
                <input id="eName" type="text">
            </div>

            <div class="form-group">
                <label for="eEmail">Email</label>
                <input id="eEmail" type="email" readonly>
            </div>

            <div class="form-group">
                <label for="eMobile">Mobile</label>
                <input id="eMobile" type="tel" readonly>
            </div>

            <div class="form-group">
                <label for="eRole">Role</label>

                <select id="eRole">
                    <option value="Core Admin">Core Admin</option>
                    <option value="Departmental Admin">Departmental Admin</option>
                </select>

                <div class="hint">
                    এখানে Admin-এর পদ পরিবর্তন করতে পারবেন।
                </div>
            </div>

            <div class="form-group" id="eDeptGroup">
                <label for="eDepartment">Department</label>
                <select id="eDepartment"></select>
            </div>

            <div class="form-group" id="eReportsGroup">
                <label for="eReportsTo">Reports To</label>
                <select id="eReportsTo"></select>
            </div>

            <div class="form-group">
                <label for="eStatus">Status</label>

                <select id="eStatus">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>

            <div class="buttons">
                <button
                    type="button"
                    id="saveEditButton"
                    class="save-button">
                    Save Changes
                </button>

                <button
                    type="button"
                    id="cancelEditButton"
                    class="cancel-button">
                    Cancel
                </button>
            </div>

            <div id="editMessage" class="message"></div>

        </div>

        <div class="links">
            <a href="admin-dashboard.html">← Admin Dashboard</a>
            <a href="create-admin.html">Admin Management</a>
            <a href="admin-list.html">Admin List</a>
        </div>

    </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE IMPORT
   ===================================================== */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    getDoc,
    doc,
    updateDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
   ===================================================== */

const firebaseConfig = {
    apiKey: "AIzaSyDqXcxTrI22Ju1Rj9mtbUSCjGkT7B_OxZo",
    authDomain: "kali-life-ecosystem.firebaseapp.com",
    projectId: "kali-life-ecosystem",
    storageBucket: "kali-life-ecosystem.firebasestorage.app",
    messagingSenderId: "734170546737",
    appId: "1:734170546737:web:26f79e1b4b19ebabfe0b10",
    measurementId: "G-LBEY0W7RX3"
};


/* =====================================================
   FIREBASE INITIALIZE
   ===================================================== */

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const mainAuth = getAuth(app);


/* =====================================================
   CONSTANTS
   ===================================================== */

const USERS = "users";

const CORE = "Core Admin";

const DEPT = "Departmental Admin";

const DEPARTMENTS = [
    "Product",
    "Agriculture",
    "Technology",
    "Marriage",
    "Education"
];


/* =====================================================
   HELPER
   ===================================================== */

const $ = id => document.getElementById(id);


/* =====================================================
   STATE
   ===================================================== */

let currentUser = null;

let superAdminOk = false;

let editingUid = null;

let editingData = null;

let activeCores = [];


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(text, type){

    const box = $("editMessage");

    box.textContent = text;

    box.className = "message show " + type;
}


function clearMessage(){

    const box = $("editMessage");

    box.textContent = "";

    box.className = "message";
}


/* =====================================================
   ACTIVE CHECK
   ===================================================== */

function isActive(data){

    return String(data.status || "")
        .trim()
        .toLowerCase() === "active";
}


/* =====================================================
   DEPARTMENT LIST
   ===================================================== */

function fillDepartments(){

    $("eDepartment").innerHTML =
        '<option value="">-- Department বাছুন --</option>' +

        DEPARTMENTS
        .map(d => `<option value="${d}">${d}</option>`)
        .join("");
}


/* =====================================================
   ROLE UI
   ===================================================== */

function applyRoleUI(role){

    if(role === CORE){

        $("eDeptGroup").classList.add("hidden");

        $("eReportsGroup").classList.add("hidden");

    }else{

        $("eDeptGroup").classList.remove("hidden");

        $("eReportsGroup").classList.remove("hidden");
    }
}


/* =====================================================
   LOAD ACTIVE CORE ADMINS
   ===================================================== */

async function loadCoreAdmins(){

    const q = query(
        collection(db, USERS),
        where("roleType", "==", CORE)
    );

    const snap = await getDocs(q);

    activeCores = snap.docs
        .filter(d => isActive(d.data()))
        .map(d => ({
            uid: d.id,
            name:
                d.data().name ||
                d.data().email ||
                d.id
        }))
        .filter(c => c.uid !== editingUid)
        .sort((a,b) =>
            a.name.localeCompare(b.name)
        );

    $("eReportsTo").innerHTML =
        '<option value="">-- Core Admin বাছুন --</option>' +

        activeCores
        .map(c =>
            `<option value="${c.uid}">${c.name}</option>`
        )
        .join("");

    if(
        editingData &&
        editingData.reportsTo
    ){

        $("eReportsTo").value =
            editingData.reportsTo;
    }
}


/* =====================================================
   FIND ADMIN UID FROM URL
   ===================================================== */

function getAdminUid(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("uid") ||
        params.get("id") ||
        params.get("userId") ||
        params.get("adminId") ||
        ""
    ).trim();
}


/* =====================================================
   VERIFY SUPER ADMIN
   ===================================================== */

async function verifySuperAdmin(user){

    const snap = await getDoc(
        doc(db, USERS, user.uid)
    );

    if(!snap.exists()){

        return false;
    }

    const data = snap.data();

    const role1 =
        String(data.roleType || "")
        .trim()
        .toLowerCase();

    const role2 =
        String(data.role || "")
        .trim()
        .toLowerCase();

    return (
        (
            role1 === "super admin" ||
            role2 === "super admin"
        )
        &&
        isActive(data)
    );
}


/* =====================================================
   LOAD ADMIN
   ===================================================== */

async function loadAdmin(){

    clearMessage();

    editingUid = getAdminUid();

    if(!editingUid){

        $("loadingBox").classList.add("hidden");

        showMessage(
            "কোন Admin নির্বাচন করা হয়নি। Admin List থেকে Edit চাপুন।",
            "error"
        );

        return;
    }


    try{

        const snap = await getDoc(
            doc(db, USERS, editingUid)
        );


        if(!snap.exists()){

            $("loadingBox").classList.add("hidden");

            showMessage(
                "এই Admin-এর Firestore তথ্য পাওয়া যায়নি।",
                "error"
            );

            return;
        }


        editingData = snap.data();


        $("eName").value =
            editingData.name || "";


        $("eEmail").value =
            editingData.email || "";


        $("eMobile").value =
            editingData.mobile || "";


        const role =
            editingData.roleType ||
            editingData.role ||
            DEPT;


        $("eRole").value = role;


        $("eDepartment").value =
            editingData.department || "";


        $("eStatus").value =
            editingData.status || "Active";


        applyRoleUI(role);


        await loadCoreAdmins();


        $("loadingBox").classList.add("hidden");

        $("editBox").classList.remove("hidden");


    }catch(error){

        console.error(
            "Load Admin Error:",
            error
        );

        $("loadingBox").classList.add("hidden");

        showMessage(
            "Admin তথ্য লোড করা যায়নি। Firestore Permission অথবা Login পরীক্ষা করুন।",
            "error"
        );
    }
}


/* =====================================================
   SAVE EDIT
   ===================================================== */

async function saveChanges(){

    clearMessage();


    if(!superAdminOk){

        showMessage(
            "শুধু Active Super Admin Admin-এর পদ পরিবর্তন করতে পারবেন।",
            "error"
        );

        return;
    }


    if(!editingUid){

        showMessage(
            "Admin UID পাওয়া যায়নি।",
            "error"
        );

        return;
    }


    const name =
        $("eName").value.trim();


    const role =
        $("eRole").value;


    const department =
        $("eDepartment").value;


    const reportsTo =
        $("eReportsTo").value;


    const status =
        $("eStatus").value;


    if(name.length < 3){

        showMessage(
            "নাম কমপক্ষে ৩ অক্ষরের হতে হবে।",
            "error"
        );

        return;
    }


    if(role !== CORE && role !== DEPT){

        showMessage(
            "সঠিক Role নির্বাচন করুন।",
            "error"
        );

        return;
    }


    if(role === DEPT && !department){

        showMessage(
            "Departmental Admin-এর জন্য Department নির্বাচন করুন।",
            "error"
        );

        return;
    }


    if(role === DEPT && !reportsTo){

        showMessage(
            "Departmental Admin-এর জন্য Reports To নির্বাচন করুন।",
            "error"
        );

        return;
    }


    const btn =
        $("saveEditButton");


    btn.disabled = true;

    btn.textContent =
        "Saving...";


    try{

        const updates = {

            name: name,

            role: role,

            roleType: role,

            department:
                role === DEPT
                ? department
                : "",

            reportsTo:
                role === DEPT
                ? reportsTo
                : "",

            status: status
        };


        await updateDoc(
            doc(db, USERS, editingUid),
            updates
        );


        showMessage(
            "Admin তথ্য এবং পদ সফলভাবে পরিবর্তন হয়েছে।",
            "success"
        );


        editingData = {
            ...editingData,
            ...updates
        };


        setTimeout(() => {

            window.location.href =
                "admin-list.html";

        }, 1200);


    }catch(error){

        console.error(
            "Save Admin Error:",
            error
        );


        let msg =
            "Admin তথ্য Save করা যায়নি।";


        if(
            error.code ===
            "permission-denied"
        ){

            msg =
                "Firestore Permission Denied।";
        }


        showMessage(
            msg,
            "error"
        );


    }finally{

        btn.disabled = false;

        btn.textContent =
            "Save Changes";
    }
}


/* =====================================================
   ROLE CHANGE
   ===================================================== */

$("eRole").addEventListener(
    "change",
    async () => {

        const role =
            $("eRole").value;

        applyRoleUI(role);

        if(role === DEPT){

            await loadCoreAdmins();
        }
    }
);


/* =====================================================
   SAVE BUTTON
   ===================================================== */

$("saveEditButton").addEventListener(
    "click",
    saveChanges
);


/* =====================================================
   CANCEL BUTTON
   ===================================================== */

$("cancelEditButton").addEventListener(
    "click",
    () => {

        window.location.href =
            "admin-list.html";
    }
);


/* =====================================================
   AUTH CHECK
   ===================================================== */

onAuthStateChanged(
    mainAuth,
    async user => {

        currentUser = user;

        if(!user){

            $("loadingBox").classList.add("hidden");

            showMessage(
                "Super Admin হিসেবে Login করুন।",
                "error"
            );

            return;
        }


        try{

            superAdminOk =
                await verifySuperAdmin(user);


            if(!superAdminOk){

                $("loadingBox").classList.add("hidden");

                showMessage(
                    "Access Denied — শুধু Active Super Admin এই পেজ ব্যবহার করতে পারবেন।",
                    "error"
                );

                return;
            }


            await loadAdmin();


        }catch(error){

            console.error(
                "Auth Error:",
                error
            );

            $("loadingBox").classList.add("hidden");

            showMessage(
                "Admin authentication পরীক্ষা করা যায়নি।",
                "error"
            );
        }

    }
);


/* =====================================================
   START
   ===================================================== */

fillDepartments();

</script>

</body>
</html>
