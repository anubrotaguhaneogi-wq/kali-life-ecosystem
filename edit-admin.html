function showMessage(text,type){

/* =====================================================
   ACTIVE CHECK
   ===================================================== */

function isActive(data){

    return String(
        data.status || ""

    .trim()
    .toLowerCase() === "active";
}

/* =====================================================
   PHOTO PREVIEW
   ===================================================== */

$("ePhoto").addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];

        if(!file){

            selectedPhotoFile =
                null;

            $("photoName").textContent =
                "নতুন ছবি নির্বাচন করুন";

            return;
        }


        if(
            !file.type.startsWith("image/")
        ){

            showMessage(
                "শুধু Image file নির্বাচন করুন।",
                "error"
            );

            event.target.value =
                "";

            return;
        }


        selectedPhotoFile =
            file;


        $("photoName").textContent =
            file.name;


        const reader =
            new FileReader();


        reader.onload =
            e => {

                $("photoPreview").src =
                    e.target.result;

                $("photoPreview")
                    .classList
                    .remove("hidden");

                $("photoPlaceholder")
                    .classList
                    .add("hidden");
            };


        reader.readAsDataURL(file);
    }
);


/* =====================================================
   RESIZE PHOTO
   ===================================================== */

function resizeImage(file){

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();


            reader.onload =
                event => {

                    const img =
                        new Image();


                    img.onload =
                        () => {

                            const maxSize =
                                600;

                            let width =
                                img.width;

                            let height =
                                img.height;


                            if(width > height){

                                if(width > maxSize){

                                    height =
                                        Math.round(
                                            height *
                                            maxSize /
                                            width
                                        );

                                    width =
                                        maxSize;
                                }

                            }else{

                                if(height > maxSize){

                                    width =
                                        Math.round(
                                            width *
                                            maxSize /
                                            height
                                        );

                                    height =
                                        maxSize;
                                }
                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            canvas.toBlob(
                                blob => {

                                    if(!blob){

                                        reject(
                                            new Error(
                                                "Image compression failed."
                                            )
                                        );

                                        return;
                                    }


                                    resolve(blob);

                                },
                                "image/jpeg",
                                0.85
                            );

                        };


                    img.onerror =
                        () => reject(
                            new Error(
                                "Image load failed."
                            )
                        );


                    img.src =
                        event.target.result;
                };


            reader.onerror =
                () => reject(
                    new Error(
                        "File read failed."
                    )
                );


            reader.readAsDataURL(file);
        }
    );
}


/* =====================================================
   UPLOAD PHOTO
   ===================================================== */

async function uploadAdminPhoto(){

    if(!selectedPhotoFile){

        return editingData?.photoURL || "";
    }


    showMessage(
        "Admin Photo Upload হচ্ছে...",
        "info"
    );


    const resizedBlob =
        await resizeImage(
            selectedPhotoFile
        );


    const fileName =
        "admin_" +
        editingUid +
        "_" +
        Date.now() +
        ".jpg";


    const storagePath =
        "admin-photos/" +
        fileName;


    const storageRef =
        ref(
            storage,
            storagePath
        );


    await uploadBytes(
        storageRef,
        resizedBlob,
        {
            contentType:
                "image/jpeg"
        }
    );


    const photoURL =
        await getDownloadURL(
            storageRef
        );


    return photoURL;
}


/* =====================================================
   LOAD ACTIVE CORE ADMINS
   ===================================================== */

async function loadCoreAdmins(){

    const q =
        query(
            collection(
                db,
                USERS
            ),
            where(
                "roleType",
                "==",
                CORE
            )
        );


    const snap =
        await getDocs(q);


    activeCores =
        snap.docs

        .filter(
            d =>
            isActive(
                d.data()
            )
        )

        .map(
            d => ({

                uid:
                    d.id,

                name:
                    d.data().name ||
                    d.data().email ||
                    d.id

            })
        )

        .filter(
            c =>
            c.uid !== editingUid
        )

        .sort(
            (a,b) =>
            a.name.localeCompare(
                b.name
            )
        );


    $("eReportsTo").innerHTML =
        '<option value="">-- Core Admin বাছুন --</option>' +

        activeCores

        .map(
            c =>
            `<option value="${c.uid}">
                ${c.name}
            </option>`
        )

        .join("");


    if(
        editingData &&
        editingData.reportsTo
    ){

        $("eReportsTo").value =
            editingData.reportsTo;
    }
}


/* =====================================================
   FIND ADMIN UID FROM URL
   ===================================================== */

function getAdminUid(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    return (

        params.get("uid") ||

        params.get("id") ||

        params.get("userId") ||

        params.get("adminId") ||

        ""

    ).trim();
}
