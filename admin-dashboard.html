<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071a12">

<title>KALI LIFE ECOSYSTEM — Department Business Center</title>

<style>
:root{
  --bg:#f3f7f5;
  --surface:#ffffff;
  --surface2:#f8fbf9;
  --text:#10231a;
  --muted:#74847c;
  --line:#e3ebe7;

  --green:#087443;
  --green2:#0caf63;
  --green3:#dff7ea;

  --gold:#c99427;
  --gold-soft:#fff6df;

  --red:#d84d4d;
  --red-soft:#fff0f0;

  --blue:#3978c8;
  --blue-soft:#edf5ff;

  --shadow:0 20px 55px rgba(8,60,38,.09);
  --shadow2:0 8px 28px rgba(8,60,38,.07);

  --sidebar:275px;
  --radius:20px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

a{
  text-decoration:none;
  color:inherit;
}

/* =====================================================
   APP
===================================================== */

.app{
  min-height:100vh;
  display:flex;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;

  width:var(--sidebar);

  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(55,210,132,.18),
      transparent 28%
    ),
    radial-gradient(
      circle at 100% 80%,
      rgba(20,130,80,.18),
      transparent 30%
    ),
    linear-gradient(
      180deg,
      #061c12 0%,
      #08291b 55%,
      #04150d 100%
    );

  color:#fff;

  padding:20px 15px;

  display:flex;
  flex-direction:column;

  z-index:1000;

  overflow-y:auto;

  transition:.3s ease;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;

  padding:7px 9px 23px;

  border-bottom:1px solid rgba(255,255,255,.07);
}

.brand-logo{
  width:46px;
  height:46px;

  border-radius:15px;

  display:grid;
  place-items:center;

  font-size:23px;
  font-weight:900;

  color:#07351f;

  background:
    linear-gradient(
      135deg,
      #c9f8d9,
      #3dca83
    );

  box-shadow:
    0 9px 28px rgba(57,211,132,.23);
}

.brand strong{
  display:block;
  font-size:15px;
  letter-spacing:.5px;
}

.brand small{
  display:block;
  color:#83a797;
  font-size:9px;
  margin-top:4px;
  letter-spacing:1.3px;
}

.section-label{
  color:#628a76;
  font-size:9px;
  font-weight:900;
  letter-spacing:1.5px;

  padding:18px 11px 8px;

  text-transform:uppercase;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.nav a,
.nav button{
  width:100%;

  display:flex;
  align-items:center;
  gap:12px;

  color:#c4d8ce;

  background:transparent;

  border-radius:13px;

  padding:11px 12px;

  font-size:12px;
  font-weight:650;

  text-align:left;

  transition:.2s ease;
}

.nav a:hover,
.nav button:hover{
  background:rgba(255,255,255,.08);
  color:#fff;
}

.nav a.active{
  background:
    linear-gradient(
      90deg,
      rgba(61,211,132,.19),
      rgba(61,211,132,.05)
    );

  color:#fff;

  box-shadow:
    inset 3px 0 0 #54dc91;
}

.nav-icon{
  width:25px;
  text-align:center;
  font-size:16px;
}

.sidebar-bottom{
  margin-top:auto;
}

.live-status{
  margin:16px 5px;

  padding:13px;

  border:
    1px solid
    rgba(255,255,255,.08);

  background:
    rgba(255,255,255,.045);

  border-radius:15px;
}

.live-status-row{
  display:flex;
  align-items:center;
  gap:8px;

  color:#a8c3b7;

  font-size:10px;
}

.live-dot{
  width:8px;
  height:8px;
  border-radius:50%;

  background:#39d985;

  box-shadow:
    0 0 0 5px
    rgba(57,217,133,.1);
}

.admin-profile{
  display:flex;
  align-items:center;
  gap:10px;

  padding:14px 8px 5px;

  border-top:
    1px solid
    rgba(255,255,255,.08);
}

.avatar{
  width:39px;
  height:39px;

  border-radius:50%;

  display:grid;
  place-items:center;

  font-size:12px;
  font-weight:900;

  background:
    linear-gradient(
      135deg,
      #c8f5d7,
      #38bd79
    );

  color:#06351f;
}

.admin-profile strong{
  display:block;
  font-size:11px;
}

.admin-profile span{
  display:block;
  color:#7fa191;
  font-size:9px;
  margin-top:3px;
}

/* =====================================================
   MAIN
===================================================== */

.main{
  width:calc(100% - var(--sidebar));
  margin-left:var(--sidebar);
  min-height:100vh;
}

/* =====================================================
   TOPBAR
===================================================== */

.topbar{
  position:sticky;
  top:0;

  z-index:800;

  min-height:78px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:18px;

  padding:0 30px;

  background:
    rgba(255,255,255,.90);

  backdrop-filter:blur(18px);

  border-bottom:
    1px solid
    var(--line);
}

.top-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.menu-btn{
  display:none;

  width:42px;
  height:42px;

  border-radius:12px;

  background:var(--surface2);

  border:
    1px solid
    var(--line);

  font-size:19px;
}

.page-title h1{
  font-size:20px;
  letter-spacing:-.5px;
}

.page-title p{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:9px;
}

.search{
  position:relative;
}

.search input{
  width:235px;
  height:42px;

  padding:0 13px 0 37px;

  border:
    1px solid
    var(--line);

  border-radius:13px;

  background:#fbfcfb;

  outline:none;

  font-size:11px;

  color:var(--text);
}

.search span{
  position:absolute;
  left:13px;
  top:11px;
  color:#84948d;
}

.icon-btn{
  width:42px;
  height:42px;

  border:
    1px solid
    var(--line);

  background:#fff;

  border-radius:13px;

  display:grid;
  place-items:center;

  position:relative;

  font-size:15px;
}

.notification-dot{
  position:absolute;

  right:8px;
  top:7px;

  width:7px;
  height:7px;

  background:#e64c4c;

  border-radius:50%;

  border:2px solid #fff;
}

/* =====================================================
   CONTENT
===================================================== */

.content{
  padding:27px 30px 45px;

  max-width:1700px;

  margin:auto;
}

.welcome{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  gap:20px;

  margin-bottom:20px;
}

.welcome h2{
  font-size:25px;
  letter-spacing:-.8px;
}

.welcome p{
  color:var(--muted);
  font-size:11px;
  margin-top:6px;
}

.department-badge{
  display:inline-flex;
  align-items:center;
  gap:7px;

  margin-top:9px;

  padding:7px 10px;

  background:var(--green3);

  color:var(--green);

  border-radius:9px;

  font-size:10px;
  font-weight:800;
}

.date-box{
  padding:11px 14px;

  background:#fff;

  border:
    1px solid
    var(--line);

  border-radius:12px;

  color:#5e6e67;

  font-size:10px;

  white-space:nowrap;
}

/* =====================================================
   TODAY HEADER
===================================================== */

.today-banner{
  position:relative;
  overflow:hidden;

  margin-bottom:17px;

  padding:21px 23px;

  border-radius:var(--radius);

  color:#fff;

  background:
    radial-gradient(
      circle at 85% 20%,
      rgba(86,225,146,.28),
      transparent 25%
    ),
    linear-gradient(
      115deg,
      #06351f,
      #087443 60%,
      #09935a
    );

  box-shadow:
    0 18px 45px
    rgba(8,116,67,.20);
}

.today-banner::after{
  content:"";

  position:absolute;

  width:170px;
  height:170px;

  right:-55px;
  bottom:-100px;

  border-radius:50%;

  border:
    1px solid
    rgba(255,255,255,.13);
}

.today-banner small{
  display:block;

  color:#9fe4bd;

  font-size:9px;

  font-weight:800;

  letter-spacing:1.4px;

  text-transform:uppercase;
}

.today-banner h2{
  margin-top:5px;

  font-size:19px;

  letter-spacing:-.3px;
}

.today-banner p{
  margin-top:5px;

  color:#c4ead4;

  font-size:10px;
}

/* =====================================================
   KPI GRID
===================================================== */

.kpi-grid{
  display:grid;

  grid-template-columns:
    repeat(6,1fr);

  gap:12px;
}

.kpi{
  position:relative;
  overflow:hidden;

  min-height:145px;

  background:#fff;

  border:
    1px solid
    var(--line);

  border-radius:18px;

  padding:17px;

  box-shadow:var(--shadow2);

  transition:.25s ease;
}

.kpi:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow);
}

.kpi-icon{
  width:39px;
  height:39px;

  display:grid;
  place-items:center;

  border-radius:12px;

  background:var(--green3);

  font-size:17px;
}

.kpi.gold .kpi-icon{
  background:var(--gold-soft);
}

.kpi.blue .kpi-icon{
  background:var(--blue-soft);
}

.kpi.red .kpi-icon{
  background:var(--red-soft);
}

.kpi h3{
  margin-top:14px;

  font-size:23px;

  letter-spacing:-.7px;
}

.kpi p{
  color:var(--muted);

  font-size:9px;

  margin-top:4px;
}

.kpi-foot{
  display:flex;
  align-items:center;
  gap:5px;

  margin-top:9px;

  font-size:8px;
  font-weight:800;

  color:var(--green);
}

.kpi-foot.warning{
  color:#a7771d;
}

.kpi-foot.danger{
  color:var(--red);
}

/* =====================================================
   SECTION GRID
===================================================== */

.grid-main{
  display:grid;

  grid-template-columns:
    1.55fr .9fr;

  gap:17px;

  margin-top:17px;
}

.card{
  background:#fff;

  border:
    1px solid
    var(--line);

  border-radius:var(--radius);

  box-shadow:var(--shadow2);

  overflow:hidden;
}

.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  padding:18px 19px;

  border-bottom:
    1px solid
    var(--line);
}

.card-head h3{
  font-size:13px;
}

.card-head p{
  color:var(--muted);

  font-size:9px;

  margin-top:4px;
}

.card-button{
  padding:8px 11px;

  border:
    1px solid
    var(--line);

  background:#fff;

  border-radius:9px;

  color:#51635a;

  font-size:9px;
  font-weight:800;
}

/* =====================================================
   INCOME CENTER
===================================================== */

.income{
  padding:19px;
}

.income-main{
  padding:18px;

  border-radius:17px;

  background:
    linear-gradient(
      135deg,
      #e8f9ef,
      #f8fcf9
    );

  border:
    1px solid
    #d8eee1;
}

.income-main small{
  color:#56816c;

  font-size:9px;

  font-weight:800;

  text-transform:uppercase;

  letter-spacing:1px;
}

.income-main h2{
  font-size:31px;

  letter-spacing:-1.3px;

  margin-top:5px;

  color:#075c35;
}

.income-main span{
  display:inline-block;

  margin-top:5px;

  padding:5px 8px;

  border-radius:7px;

  background:#d9f5e4;

  color:#14804a;

  font-size:8px;

  font-weight:900;
}

.income-details{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  margin-top:11px;
}

.income-box{
  padding:13px;

  border:
    1px solid
    var(--line);

  border-radius:13px;

  background:#fff;
}

.income-box small{
  color:var(--muted);

  font-size:8px;
}

.income-box strong{
  display:block;

  margin-top:5px;

  font-size:15px;
}

/* =====================================================
   ACTION CENTER
===================================================== */

.action-list{
  padding:7px 19px 13px;
}

.action{
  display:flex;

  align-items:center;

  gap:10px;

  padding:12px 0;

  border-bottom:
    1px solid
    #edf2ef;
}

.action:last-child{
  border-bottom:0;
}

.action-icon{
  width:34px;
  height:34px;

  display:grid;
  place-items:center;

  border-radius:10px;

  background:var(--gold-soft);

  font-size:14px;
}

.action.danger .action-icon{
  background:var(--red-soft);
}

.action.blue .action-icon{
  background:var(--blue-soft);
}

.action-text{
  min-width:0;
}

.action-text strong{
  display:block;

  font-size:10px;
}

.action-text span{
  display:block;

  color:var(--muted);

  font-size:8px;

  margin-top:3px;
}

.action-count{
  margin-left:auto;

  min-width:28px;

  padding:5px 7px;

  text-align:center;

  border-radius:7px;

  background:#f4f7f5;

  font-size:9px;

  font-weight:900;
}

/* =====================================================
   CHART
===================================================== */

.chart-wrap{
  padding:18px 19px 15px;
}

.chart-tools{
  display:flex;
  justify-content:space-between;

  align-items:center;

  margin-bottom:15px;
}

.legend{
  display:flex;
  gap:14px;

  color:var(--muted);

  font-size:8px;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:5px;
}

.legend-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--green);
}

.legend-dot.gold{
  background:var(--gold);
}

.chart-area{
  position:relative;

  height:220px;

  border-left:
    1px solid
    var(--line);

  border-bottom:
    1px solid
    var(--line);

  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 43px,
      #edf2ef 44px
    );

  overflow:hidden;
}

.chart-svg{
  width:100%;
  height:100%;
}

.chart-labels{
  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  text-align:center;

  color:#94a29c;

  font-size:8px;

  margin-top:8px;
}

/* =====================================================
   ORDER TABLE
===================================================== */

.orders-card{
  margin-top:17px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;

  border-collapse:collapse;

  min-width:850px;
}

th{
  padding:12px 18px;

  background:#fafcfb;

  color:#819088;

  font-size:8px;

  text-align:left;

  text-transform:uppercase;

  letter-spacing:.7px;
}

td{
  padding:13px 18px;

  border-top:
    1px solid
    #edf1ef;

  font-size:9px;
}

.order-id{
  color:var(--green);

  font-weight:900;
}

.customer{
  font-weight:800;
}

.product-name{
  color:#53645c;
}

.amount{
  font-weight:900;
}

.status{
  display:inline-flex;

  align-items:center;

  padding:5px 8px;

  border-radius:7px;

  font-size:7px;

  font-weight:900;
}

.status.pending{
  background:var(--gold-soft);
  color:#966f1d;
}

.status.processing{
  background:var(--blue-soft);
  color:#356db5;
}

.status.completed{
  background:var(--green3);
  color:#147945;
}

.status.cancelled{
  background:var(--red-soft);
  color:#bd4141;
}

/* =====================================================
   BOTTOM GRID
===================================================== */

.bottom-grid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:17px;

  margin-top:17px;
}

/* =====================================================
   SALES PERFORMANCE
===================================================== */

.performance{
  padding:19px;
}

.performance-row{
  margin-bottom:16px;
}

.performance-row:last-child{
  margin-bottom:0;
}

.performance-info{
  display:flex;

  justify-content:space-between;

  font-size:9px;

  margin-bottom:7px;
}

.performance-info span{
  color:var(--muted);
}

.progress{
  height:7px;

  background:#edf2ef;

  border-radius:99px;

  overflow:hidden;
}

.progress-bar{
  height:100%;

  border-radius:99px;

  background:
    linear-gradient(
      90deg,
      var(--green),
      var(--green2)
    );
}

/* =====================================================
   COMMISSION
===================================================== */

.commission{
  padding:19px;
}

.commission-top{
  display:flex;

  align-items:center;

  justify-content:space-between;

  padding-bottom:14px;

  border-bottom:
    1px solid
    var(--line);
}

.commission-top small{
  display:block;

  color:var(--muted);

  font-size:8px;
}

.commission-top strong{
  display:block;

  margin-top:4px;

  font-size:24px;
}

.commission-rate{
  padding:7px 9px;

  background:var(--green3);

  color:var(--green);

  border-radius:8px;

  font-size:9px;

  font-weight:900;
}

.commission-list{
  padding-top:13px;
}

.commission-row{
  display:flex;

  justify-content:space-between;

  padding:8px 0;

  font-size:9px;
}

.commission-row span{
  color:var(--muted);
}

.commission-row strong{
  font-weight:900;
}

/* =====================================================
   FOOTER
===================================================== */

.footer{
  display:flex;

  justify-content:space-between;

  gap:20px;

  padding:24px 3px 5px;

  color:#8b9993;

  font-size:8px;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
  position:fixed;

  right:23px;
  bottom:23px;

  z-index:3000;

  min-width:260px;

  padding:13px 15px;

  background:#082319;

  color:#fff;

  border-radius:13px;

  box-shadow:
    0 18px 50px
    rgba(0,0,0,.22);

  transform:translateY(130px);

  opacity:0;

  pointer-events:none;

  transition:.3s ease;

  font-size:10px;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

/* =====================================================
   OVERLAY
===================================================== */

.overlay{
  position:fixed;

  inset:0;

  background:rgba(0,0,0,.43);

  z-index:900;

  display:none;
}

.overlay.show{
  display:block;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1300px){

  .kpi-grid{
    grid-template-columns:
      repeat(3,1fr);
  }
}

@media(max-width:1050px){

  .grid-main,
  .bottom-grid{
    grid-template-columns:1fr;
  }

  .search{
    display:none;
  }
}

@media(max-width:850px){

  :root{
    --sidebar:270px;
  }

  .sidebar{
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    width:100%;
    margin-left:0;
  }

  .menu-btn{
    display:grid;
    place-items:center;
  }

  .topbar{
    padding:0 16px;
  }

  .content{
    padding:21px 16px 30px;
  }

  .welcome{
    flex-direction:column;
  }

  .date-box{
    width:100%;
  }
}

@media(max-width:600px){

  .kpi-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .income-details{
    grid-template-columns:1fr;
  }

  .welcome h2{
    font-size:21px;
  }

  .kpi{
    min-height:135px;
  }

  .kpi h3{
    font-size:20px;
  }

  .profile-hide{
    display:none;
  }

  .footer{
    flex-direction:column;
  }
}

@media(max-width:390px){

  .kpi-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- ===================================================
     SIDEBAR
=================================================== -->

<aside class="sidebar" id="sidebar">

  <div class="brand">

    <div class="brand-logo">K</div>

    <div>
