<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#166534">

<title>Admin Dashboard - KALI LIFE ECOSYSTEM</title>


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f1f5f9;

    color: #0f172a;
}


/* =========================================================
   HEADER
========================================================= */

header {

    background:
        linear-gradient(
            135deg,
            #166534,
            #15803d
        );

    color: #ffffff;

    padding: 22px 15px;

    text-align: center;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.12);
}

header h1 {

    margin: 0;

    font-size: 26px;

    font-weight: 800;
}

header p {

    margin: 7px 0 0;

    color:
        rgba(255,255,255,0.80);

    font-size: 13px;
}


/* =========================================================
   MAIN
========================================================= */

.container {

    width: 100%;

    max-width: 720px;

    margin: 30px auto;

    padding: 0 15px 35px;
}


/* =========================================================
   CARD
========================================================= */

.card {

    background: #ffffff;

    padding: 25px;

    margin-bottom: 22px;

    border:
        1px solid
        #e2e8f0;

    border-radius: 16px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.07);
}

.card h2 {

    margin: 0 0 20px;

    color: #166534;

    font-size: 21px;
}


/* =========================================================
   INFORMATION
========================================================= */

.info {

    display: grid;

    gap: 10px;
}

.info-row {

    padding: 12px 13px;

    background: #f8fafc;

    border-radius: 8px;

    font-size: 14px;

    color: #475569;
}

.info-row strong {

    color: #0f172a;
}

.role-badge {

    display: inline-block;

    margin-top: 5px;

    padding: 6px 12px;

    border-radius: 20px;

    background: #dcfce7;

    color: #166534;

    font-size: 12px;

    font-weight: 800;
}


/* =========================================================
   BUTTONS
========================================================= */

.button-grid {

    display: grid;

    gap: 12px;
}

.dashboard-button {

    display: flex;

    align-items: center;

    justify-content: center;

    min-height: 52px;

    padding: 14px 18px;

    border: none;

    border-radius: 10px;

    background: #16a34a;

    color: #ffffff;

    text-decoration: none;

    font-size: 15px;

    font-weight: 800;

    text-align: center;

    cursor: pointer;

    box-shadow:
        0 4px 12px
        rgba(22,163,74,0.16);
}

.dashboard-button:hover {

    background: #15803d;
}

.secondary {

    background: #475569;
}

.secondary:hover {

    background: #334155;
}

.logout {

    background: #dc2626;

    margin-top: 5px;
}

.logout:hover {

    background: #b91c1c;
}


/* =========================================================
   HIDDEN
========================================================= */

.hidden {

    display: none !important;
}


/* =========================================================
   LOADING / ERROR
========================================================= */

#loadingMessage {

    text-align: center;

    padding: 30px;

    color: #475569;

    font-weight: 700;
}

#errorMessage {

    display: none;

    padding: 15px;

    margin-bottom: 20px;

    border-radius: 10px;

    background: #fef2f2;

    border: 1px solid #fecaca;

    color: #b91c1c;

    text-align: center;

    font-weight: 700;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    text-align: center;

    color: #64748b;

    font-size: 11px;

    margin-top: 20px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    header h1 {

        font-size: 21px;
    }

    .container {

        margin-top: 20px;

        padding:
            0 10px 25px;
    }

    .card {

        padding: 19px;

        border-radius: 13px;
    }

    .card h2 {

        font-size: 19px;
    }

    .dashboard-button {

        min-height: 50px;

        font-size: 14px;
    }

}

</style>

</head>


<body>


<header>

    <h1>
        🔐 ADMIN DASHBOARD
    </h1>

    <p>
        KALI LIFE ECOSYSTEM
    </p>

</header>


<div class="container">


    <div id="loadingMessage">
        Checking Admin authentication...
    </div>


    <div
        id="errorMessage">
    </div>


    <div
        id="dashboardContent"
        class="hidden">


        <!-- ==================================================
             ADMIN INFORMATION
        ================================================== -->

        <div class="card">

            <h2>
                Welcome,
                <span id="welcomeName">
                    Admin
                </span>
            </h2>


            <div class="info">


                <div class="info-row">

                    <strong>
                        Name:
                    </strong>

                    <span id="adminName">
                        -
                    </span>

                </div>


                <div class="info-row">

                    <strong>
                        Email:
                    </strong>

                    <span id="adminEmail">
                        -
                    </span>

                </div>


                <div class="info-row">

                    <strong>
                        Department / Post:
                    </strong>

                    <span id="adminDepartment">
                        -
                    </span>

                </div>


                <div class="info-row">

                    <strong>
                        Role:
                    </strong>

                    <span
                        id="adminRole"
                        class="role-badge">

                        -

                    </span>

                </div>


                <div class="info-row">

                    <strong>
                        Status:
                    </strong>

                    <span id="adminStatus">
                        -
                    </span>

                </div>


            </div>

        </div>


        <!-- ==================================================
             SUPER ADMIN CONTROLS
        ================================================== -->

        <div
            id="superAdminCard"
            class="card hidden">

            <h2>
                ⚙️ Super Admin Control
            </h2>


            <div class="button-grid">


                <a
                    class="dashboard-button"
                    href="create-admin.html">

                    ➕ Create Admin

                </a>


                <a
                    class="dashboard-button"
                    href="admin-list.html">

                    👥 Admin List

                </a>


                <a
                    class="dashboard-button"
                    href="reports.html">

                    📊 Reports

                </a>


            </div>

        </div>


        <!-- ==================================================
             BUSINESS MANAGEMENT
        ================================================== -->

        <div class="card">

            <h2>
                📋 Business Management
            </h2>


            <div class="button-grid">


                <a
                    class="dashboard-button"
                    href="purchase.html">

                    🛒 Purchase

                </a>


                <a
                    class="dashboard-button"
                    href="sales.html">

                    💰 Sales

                </a>


                <a
                    class="dashboard-button"
                    href="reports.html">

                    📊 Reports

                </a>


            </div>

        </div>


        <!-- ==================================================
             COMMON CONTROLS
        ================================================== -->

        <div class="card">

            <div class="button-grid">


                <a
                    class="dashboard-button secondary"
                    href="index.html">

                    🏠 Home

                </a>


                <button
                    type="button"
                    id="logoutButton"
                    class="dashboard-button logout">

                    🚪 Logout

                </button>


            </div>

        </div>


        <div class="footer">

            © KALI LIFE ECOSYSTEM

        </div>


    </div>

</div>


<!-- ======================================================
     FIREBASE
====================================================== -->

<script type="module">


import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* ======================================================
   FIREBASE CONFIG
====================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDqXcxTrI22JuR1j9mtbUSCjGkT7B_OxZo",

    authDomain:
        "kali-life-ecosystem.firebaseapp.com",

    projectId:
        "kali-life-ecosystem",

    storageBucket:
        "kali-life-ecosystem.firebasestorage.app",

    messagingSenderId:
        "734170546737",

    appId:
        "1:734170546737:web:26f79e1b4b19ebabfe0b10",

    measurementId:
        "G-LBEY0W7RX3"

};


/* ======================================================
   FIREBASE
====================================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(
        app
    );


const db =
    getFirestore(
        app
    );


/* ======================================================
   ELEMENTS
====================================================== */

const loadingMessage =
    document.getElementById(
        "loadingMessage"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );

const dashboardContent =
    document.getElementById(
        "dashboardContent"
    );


/* ======================================================
   ERROR
====================================================== */

function showError(
    text
) {

    loadingMessage.style.display =
        "none";

    dashboardContent.classList.add(
        "hidden"
    );

    errorMessage.textContent =
        text;

    errorMessage.style.display =
        "block";

}


/* ======================================================
   AUTHENTICATION
====================================================== */

onAuthStateChanged(
    auth,
    async function(user) {


        /* ==============================================
           NOT LOGGED IN
        ============================================== */

        if (!user) {

            window.location.href =
                "admin.html";

            return;

        }


        try {


            /* ==========================================
               FIRESTORE PROFILE
            ========================================== */

            const userDoc =
                await getDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    )
                );


            if (
                !userDoc.exists()
            ) {

                await signOut(
                    auth
                );

                showError(
                    "Admin profile not found."
                );

                setTimeout(
                    function() {

                        window.location.href =
                            "admin.html";

                    },
                    1500
                );

                return;

            }


            const userData =
                userDoc.data();


            /* ==========================================
               ROLE
            ========================================== */

            const role =
                String(
                    userData.role || ""
                )
                .trim();


            if (
                role !== "Admin" &&
                role !== "Super Admin"
            ) {

                await signOut(
                    auth
                );

                showError(
                    "Access denied. This account is not an Admin account."
                );

                setTimeout(
                    function() {

                        window.location.href =
                            "admin.html";

                    },
                    1500
                );

                return;

            }


            /* ==========================================
               STATUS
            ========================================== */

            const status =
                String(
                    userData.status ||
                    "Active"
                )
                .trim()
                .toLowerCase();


            if (
                status !== "active"
            ) {

                await signOut(
                    auth
                );

                showError(
                    "This Admin account is inactive."
                );

                setTimeout(
                    function() {

                        window.location.href =
                            "admin.html";

                    },
                    1500
                );

                return;

            }


            /* ==========================================
               DISPLAY DATA
            ========================================== */

            document.getElementById(
                "welcomeName"
            ).textContent =
                userData.name ||
                "Admin";


            document.getElementById(
                "adminName"
            ).textContent =
                userData.name ||
                "-";


            document.getElementById(
                "adminEmail"
            ).textContent =
                userData.email ||
                user.email ||
                "-";


            document.getElementById(
                "adminDepartment"
            ).textContent =
                userData.department ||
                "-";


            document.getElementById(
                "adminRole"
            ).textContent =
                role ||
                "-";


            document.getElementById(
                "adminStatus"
            ).textContent =
                userData.status ||
                "Active";


            /* ==========================================
               SUPER ADMIN
            ========================================== */

            if (
                role ===
                "Super Admin"
            ) {

                document.getElementById(
                    "superAdminCard"
                ).classList.remove(
                    "hidden"
                );

            }


            /* ==========================================
               SHOW DASHBOARD
            ========================================== */

            loadingMessage.style.display =
                "none";

            errorMessage.style.display =
                "none";

            dashboardContent.classList.remove(
                "hidden"
            );


        } catch (error) {

            console.error(
                "ADMIN DASHBOARD ERROR:",
                error
            );

            showError(
                "Unable to load Admin Dashboard."
            );

        }

    }
);


/* ======================================================
   LOGOUT
====================================================== */

document.getElementById(
    "logoutButton"
).addEventListener(
    "click",
    async function() {


        try {

            await signOut(
                auth
            );


            window.location.href =
                "admin.html";


        } catch (error) {

            console.error(
                "LOGOUT ERROR:",
                error
            );

            alert(
                "Logout failed. Please try again."
            );

        }

    }
);


</script>


</body>

</html>
