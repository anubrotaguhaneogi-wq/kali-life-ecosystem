<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#166534">

<title>Admin Dashboard - KALI LIFE ECOSYSTEM</title>


<!-- ======================================================
     AUTHENTICATION SYSTEM
====================================================== -->

<script src="auth.js"></script>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #f1f5f9;

    color:
        #0f172a;
}


/* =========================================================
   HEADER
========================================================= */

header {

    background:
        linear-gradient(
            135deg,
            #166534,
            #15803d
        );

    color:
        #ffffff;

    padding:
        22px 15px;

    text-align:
        center;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.12);
}

header h1 {

    margin: 0;

    font-size: 26px;

    font-weight: 800;
}

header p {

    margin: 7px 0 0;

    color:
        rgba(255,255,255,0.80);

    font-size: 13px;
}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container {

    width: 100%;

    max-width: 720px;

    margin:
        30px auto;

    padding:
        0 15px 35px;
}


/* =========================================================
   ADMIN CARD
========================================================= */

.card {

    background:
        #ffffff;

    padding:
        25px;

    margin-bottom:
        22px;

    border:
        1px solid
        #e2e8f0;

    border-radius:
        16px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.07);
}

.card h2 {

    margin:
        0 0 20px;

    color:
        #166534;

    font-size:
        21px;
}


/* =========================================================
   INFORMATION
========================================================= */

.info {

    display:
        grid;

    gap:
        10px;
}

.info-row {

    padding:
        12px 13px;

    background:
        #f8fafc;

    border-radius:
        8px;

    font-size:
        14px;

    color:
        #475569;
}

.info-row strong {

    color:
        #0f172a;
}


/* =========================================================
   ROLE BADGE
========================================================= */

.role-badge {

    display:
        inline-block;

    margin-top:
        5px;

    padding:
        6px 12px;

    border-radius:
        20px;

    background:
        #dcfce7;

    color:
        #166534;

    font-size:
        12px;

    font-weight:
        800;
}


/* =========================================================
   DASHBOARD BUTTONS
========================================================= */

.button-grid {

    display:
        grid;

    gap:
        12px;
}

.dashboard-button {

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    min-height:
        52px;

    padding:
        14px 18px;

    border:
        none;

    border-radius:
        10px;

    background:
        #16a34a;

    color:
        #ffffff;

    text-decoration:
        none;

    font-size:
        15px;

    font-weight:
        800;

    text-align:
        center;

    cursor:
        pointer;

    box-shadow:
        0 4px 12px
        rgba(22,163,74,0.16);

    transition:
        0.2s;
}

.dashboard-button:hover {

    background:
        #15803d;

    transform:
        translateY(-1px);
}

.dashboard-button:active {

    transform:
        scale(0.98);
}


/* =========================================================
   SECONDARY BUTTON
========================================================= */

.secondary {

    background:
        #475569;
}

.secondary:hover {

    background:
        #334155;
}


/* =========================================================
   LOGOUT
========================================================= */

.logout {

    background:
        #dc2626;

    margin-top:
        5px;
}

.logout:hover {

    background:
        #b91c1c;
}


/* =========================================================
   HIDDEN
========================================================= */

.hidden {

    display:
        none !important;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    text-align:
        center;

    color:
        #64748b;

    font-size:
        11px;

    margin-top:
        20px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    header h1 {

        font-size:
            21px;
    }

    .container {

        margin-top:
            20px;

        padding:
            0 10px 25px;
    }

    .card {

        padding:
            19px;

        border-radius:
            13px;
    }

    .card h2 {

        font-size:
            19px;
    }

    .dashboard-button {

        min-height:
            50px;

        font-size:
            14px;
    }

}

</style>

</head>


<body>


<!-- ======================================================
     LOGIN PROTECTION
====================================================== -->

<script>

if (
    !checkAdminAccess()
) {

    throw new Error(
        "Admin access required."
    );

}

</script>


<!-- ======================================================
     HEADER
====================================================== -->

<header>

    <h1>
        🔐 ADMIN DASHBOARD
    </h1>

    <p>
        KALI LIFE ECOSYSTEM
    </p>

</header>


<div class="container">


    <!-- ==================================================
         ADMIN INFORMATION
    ================================================== -->

    <div class="card">

        <h2>
            Welcome,
            <span id="welcomeName">
                Admin
            </span>
        </h2>


        <div class="info">


            <div class="info-row">

                <strong>
                    Name:
                </strong>

                <span id="adminName">
                    -
                </span>

            </div>


            <div class="info-row">

                <strong>
                    Mobile:
                </strong>

                <span id="adminMobile">
                    -
                </span>

            </div>


            <div class="info-row">

                <strong>
                    Email:
                </strong>

                <span id="adminEmail">
                    -
                </span>

            </div>


            <div class="info-row">

                <strong>
                    Role:
                </strong>

                <span
                    id="adminRole"
                    class="role-badge">

                    -

                </span>

            </div>


        </div>

    </div>


    <!-- ==================================================
         SUPER ADMIN CONTROLS
    ================================================== -->

    <div
        id="superAdminCard"
        class="card hidden">

        <h2>
            ⚙️ Super Admin Control
        </h2>


        <div class="button-grid">


            <a
                class="dashboard-button"
                href="create-admin.html">

                ➕ Create Admin

            </a>


            <a
                class="dashboard-button"
                href="admin-list.html">

                👥 Admin List

            </a>


            <a
                class="dashboard-button"
                href="reports.html">

                📊 Reports

            </a>


        </div>

    </div>


    <!-- ==================================================
         ADMIN BUSINESS CONTROLS
    ================================================== -->

    <div class="card">

        <h2>
            📋 Business Management
        </h2>


        <div class="button-grid">


            <a
                class="dashboard-button"
                href="purchase.html">

                🛒 Purchase

            </a>


            <a
                class="dashboard-button"
                href="sales.html">

                💰 Sales

            </a>


            <a
                class="dashboard-button"
                href="reports.html">

                📊 Reports

            </a>


        </div>

    </div>


    <!-- ==================================================
         COMMON CONTROLS
    ================================================== -->

    <div class="card">

        <div class="button-grid">


            <a
                class="dashboard-button secondary"
                href="index.html">

                🏠 Home

            </a>


            <button
                type="button"
                id="logoutButton"
                class="dashboard-button logout">

                🚪 Logout

            </button>


        </div>

    </div>


    <div class="footer">

        © KALI LIFE ECOSYSTEM

    </div>

</div>


<!-- ======================================================
     DASHBOARD LOGIC
====================================================== -->

<script>


/* ======================================================
   CURRENT USER
====================================================== */

const currentUser =
    getCurrentUser();


/* ======================================================
   DISPLAY USER INFORMATION
====================================================== */

document.getElementById(
    "welcomeName"
).textContent =
    currentUser.name ||
    "Admin";


document.getElementById(
    "adminName"
).textContent =
    currentUser.name ||
    "-";


document.getElementById(
    "adminMobile"
).textContent =
    currentUser.mobile ||
    "-";


document.getElementById(
    "adminEmail"
).textContent =
    currentUser.email ||
    "-";


document.getElementById(
    "adminRole"
).textContent =
    currentUser.role ||
    "-";


/* ======================================================
   SUPER ADMIN CONTROLS
====================================================== */

if (
    currentUser.role ===
    "Super Admin"
) {

    document.getElementById(
        "superAdminCard"
    ).classList.remove(
        "hidden"
    );

}


/* ======================================================
   LOGOUT
====================================================== */

document.getElementById(
    "logoutButton"
).addEventListener(
    "click",
    function () {

        logout();

    }
);

</script>


</body>

</html>
