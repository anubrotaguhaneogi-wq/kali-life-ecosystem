<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#eef3f8;padding:15px;}
.box{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:12px;}
.hidden{display:none;}
h2{text-align:center;color:#006400;margin-bottom:4px;}
.ver{text-align:center;font-size:12px;color:#8a99a8;margin-bottom:10px;}
label{display:block;font-weight:bold;margin:12px 0 4px;}
input{width:100%;padding:12px;font-size:16px;border:1px solid #c9d3de;border-radius:8px;}
input[readonly]{background:#f1f4f7;}
.row{display:flex;gap:10px;}
.row>div{flex:1;}
.total{display:flex;justify-content:space-between;margin-top:10px;padding:12px;background:#e9f4ec;border-radius:8px;font-weight:bold;}
button{width:100%;margin-top:18px;padding:14px;font-size:17px;font-weight:bold;color:#fff;background:#006400;border:0;border-radius:8px;}
button:disabled{opacity:.6;}
#msg{margin-top:14px;padding:12px;border-radius:8px;font-weight:bold;font-size:15px;text-align:center;display:none;word-break:break-word;}
#msg.ok{display:block;background:#dcfce7;color:#166534;}
#msg.err{display:block;background:#fee2e2;color:#b91c1c;}
h3{margin:25px 0 8px;}
.sum{display:flex;gap:10px;margin-bottom:8px;}
.sum div{flex:1;background:#e9f4ec;border-radius:8px;padding:10px;font-size:13px;}
.sum b{display:block;font-size:16px;margin-top:3px;}
.item{padding:10px 0;border-top:1px solid #dde3ea;}
.item small{display:block;color:#5b6b63;margin-top:2px;}
#status{text-align:center;padding:30px;color:#5b6b63;}
</style>
</head>
<body>

<div id="status" class="box">Loading... (sales-emi v3)</div>

<div class="box hidden" id="page">
<h2>Sales Entry</h2>
<div class="ver">sales-emi v3</div>

<label>Sold By</label>
<input type="text" id="soldBy" readonly>

<label>Role / Commission</label>
<input type="text" id="roleView" readonly>

<label>Customer Name *</label>
<input type="text" id="customerName" placeholder="Customer name" autocomplete="off">

<label>Item Name *</label>
<input type="text" id="itemName" placeholder="Item name" autocomplete="off">

<div class="row">
  <div>
    <label>Quantity *</label>
    <input type="number" id="quantity" inputmode="decimal" value="1">
  </div>
  <div>
    <label>Price (per piece) *</label>
    <input type="number" id="sellPrice" inputmode="decimal" placeholder="Price">
  </div>
</div>

<div class="total"><span>Total</span><span id="totalView">₹0</span></div>
<div class="total"><span>Commission</span><span id="commView">₹0</span></div>

<button type="button" id="saveSale">Save Sale</button>
<div id="msg"></div>

<h3>My Sales</h3>
<div class="sum">
  <div>Total Sold<b id="sumSold">₹0</b></div>
  <div>Commission<b id="sumComm">₹0</b></div>
</div>
<div id="list">Loading...</div>
</div>

<script>
// Plain script: shows a message on screen if the main script never starts
setTimeout(function () {
  if (!window.__fbLoaded) {
    var s = document.getElementById("status");
    if (s) s.textContent = "Firebase did not load. Check internet or try another browser. (sales-emi v3)";
  }
}, 7000);
</script>

<script type="module">
window.__fbLoaded = true;

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, getDoc, doc, query, where }
  from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDqXcxTrI22Ju1Rj9mtbUSCjGkT7B_OxZo",
  authDomain: "kali-life-ecosystem.firebaseapp.com",
  projectId: "kali-life-ecosystem",
  storageBucket: "kali-life-ecosystem.firebasestorage.app",
  messagingSenderId: "734170546737",
  appId: "1:734170546737:web:26f79e1b4b19ebabfe0b10",
  measurementId: "G-LBEY0W7RX3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Commission % on total sale, by role
const RATES = { "super admin": 5, "core admin": 10, "departmental admin": 20 };

const $ = (id) => document.getElementById(id);
const num = (id) => parseFloat($(id).value) || 0;
const money = (n) => "₹" + (Math.round(n * 100) / 100).toLocaleString("en-IN");
let user = null;
let role = "";
let rate = 0;

function show(text, ok) {
  const m = $("msg");
  m.textContent = text;
  m.className = ok ? "ok" : "err";
}

function calc() {
  const total = num("quantity") * num("sellPrice");
  const comm = total * rate / 100;
  $("totalView").textContent = money(total);
  $("commView").textContent = money(comm);
  return { total, comm };
}
["quantity", "sellPrice"].forEach(id => $(id).addEventListener("input", calc));

onAuthStateChanged(auth, async (u) => {
  if (!u) { location.href = "login.html"; return; }
  try {
    const snap = await getDoc(doc(db, "users", u.uid));
    const d = snap.exists() ? snap.data() : {};
    role = String(d.roleType || d.role || "").trim().toLowerCase();
    const active = String(d.status || "").trim().toLowerCase() === "active";
    if (!(role in RATES) || !active) {
      $("status").textContent = "Access Denied. Only active admins can enter sales. (role: " +
        (role || "none") + ", status: " + (d.status || "none") + ")";
      return;
    }
    user = u;
    rate = RATES[role];
    $("soldBy").value = d.name || u.displayName || u.email || u.uid;
    $("roleView").value = (d.roleType || d.role || role) + " - " + rate + "%";
    $("status").classList.add("hidden");
    $("page").classList.remove("hidden");
    calc();
    loadList();
  } catch (e) {
    $("status").textContent = "Could not verify access: " + (e.code || "") + " " + e.message;
  }
});

async function loadList() {
  try {
    const snap = await getDocs(query(collection(db, "sales"), where("soldBy", "==", user.uid)));
    const rows = snap.docs.map(d => d.data()).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    let sold = 0, comm = 0;
    const list = $("list");
    list.innerHTML = "";
    if (!rows.length) list.textContent = "No sales yet.";
    rows.forEach(r => {
      sold += r.totalSale || 0;
      comm += r.commission || 0;
      const div = document.createElement("div");
      div.className = "item";
      const t = document.createElement("div");
      t.textContent = r.itemName + " x " + r.quantity + " = " + money(r.totalSale);
      const s = document.createElement("small");
      s.textContent = "To " + r.customerName + " | Commission " + money(r.commission || 0) + " | " + r.dateText;
      div.append(t, s);
      list.appendChild(div);
    });
    $("sumSold").textContent = money(sold);
    $("sumComm").textContent = money(comm);
  } catch (e) {
    $("list").textContent = "List not loaded: " + e.message;
  }
}

$("saveSale").addEventListener("click", async () => {
  const customerName = $("customerName").value.trim();
  const itemName = $("itemName").value.trim();
  const quantity = num("quantity");
  const sellPrice = num("sellPrice");

  if (!customerName) return show("Enter customer name", false);
  if (!itemName) return show("Enter item name", false);
  if (!(quantity > 0)) return show("Enter quantity", false);
  if (!(sellPrice > 0)) return show("Enter price", false);
  if (!user) return show("Please login again", false);

  const { total, comm } = calc();
  const btn = $("saveSale");
  btn.disabled = true;
  btn.textContent = "Saving...";
  show("Saving...", true);
  try {
    const now = new Date();
    await addDoc(collection(db, "sales"), {
      customerName,
      itemName,
      quantity,
      sellPrice,
      totalSale: total,
      commissionRate: rate,
      commission: comm,
      soldBy: user.uid,
      soldByName: $("soldBy").value,
      soldByRole: role,
      createdAt: now.getTime(),
      dateText: now.toLocaleDateString("en-IN")
    });
    show("Sale saved successfully!", true);
    $("customerName").value = "";
    $("itemName").value = "";
    $("quantity").value = "1";
    $("sellPrice").value = "";
    calc();
    loadList();
  } catch (e) {
    show("NOT saved: " + (e.code || "") + " " + e.message, false);
  } finally {
    btn.disabled = false;
    btn.textContent = "Save Sale";
  }
});
</script>
</body>
</html>
