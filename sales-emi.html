<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KALI LIFE ECOSYSTEM - Sales EMI System</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef3f8;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:#ffffff;
padding:25px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#006400;
margin-bottom:10px;
}

h2{
text-align:center;
color:#0055aa;
margin-bottom:25px;
}

</style>

</head>

<body>

<div class="container">

<h1>KALI LIFE ECOSYSTEM</h1>

<h2>Sales & EMI System</h2>
<label>Invoice Date & Time</label>
<input type="datetime-local" id="invoiceDateTime" readonly>

<label>Invoice Number</label>
<input type="text" id="invoiceNumber" readonly>

<label>Customer ID</label>
<input type="text" id="customerId" readonly>

<hr>

<h3>Customer Information</h3>

<label>Customer Name *</label>
<input type="text" id="customerName" placeholder="Enter Customer Name">

<label>Father / Husband Name</label>
<input type="text" id="fatherName" placeholder="Enter Father / Husband Name">

<label>Mobile Number *</label>
<input type="tel" id="customerMobile" placeholder="Enter Mobile Number">

<label>WhatsApp Number</label>
<input type="tel" id="customerWhatsapp" placeholder="Enter WhatsApp Number">

<label>Email</label>
<input type="email" id="customerEmail" placeholder="Enter Email">

<label>Full Address *</label>
<textarea id="customerAddress" rows="3" placeholder="Enter Full Address"></textarea>

<label>District</label>
<input type="text" id="district" placeholder="Enter District">

<label>State</label>
<input type="text" id="state" placeholder="Enter State">

<label>PIN Code</label>
<input type="text" id="pinCode" placeholder="Enter PIN Code">

<hr>

<h3>Customer KYC</h3>

<label>Aadhaar Number *</label>
<input type="text" id="aadhaarNumber" placeholder="Enter Aadhaar Number">

<label>PAN Number</label>
<input type="text" id="panNumber" placeholder="Enter PAN Number">

<label>Customer Photo</label>
<input type="file" id="customerPhoto">

<label>Aadhaar Copy</label>
<input type="file" id="aadhaarCopy">

<label>PAN Copy</label>
<input type="file" id="panCopy">
<hr>

<h3>Product Information</h3>

<label>Product Name *</label>
<input type="text" id="productName" placeholder="Enter Product Name">

<label>Quantity *</label>
<input type="number" id="quantity" placeholder="Enter Quantity">

<label>Selling Price (Per Piece) *</label>
<input type="number" id="sellingPrice" placeholder="Enter Selling Price">

<label>Discount</label>
<input type="number" id="discount" placeholder="Enter Discount">

<label>Transportation Charge</label>
<input type="number" id="transportCharge" placeholder="Enter Transportation Charge">

<hr>

<h3>Billing Information</h3>

<label>Grand Total</label>
<input type="number" id="grandTotal" readonly>

<label>Down Payment (Minimum 40%)</label>
<input type="number" id="downPayment" placeholder="Minimum 40% Required">

<label>Remaining Amount</label>
<input type="number" id="dueAmount" readonly>

<label>Payment Mode</label>
<select id="paymentMode">
<option value="">Select Payment Mode</option>
<option value="cash">Full Cash Payment</option>
<option value="emi">12 Weeks EMI</option>
</select>

<label>Weekly EMI Amount</label>
<input type="number" id="weeklyEmi" readonly>

<label>Remarks</label>
<textarea id="remarks" rows="4" placeholder="Remarks"></textarea>

<button type="button" id="saveSales">Save Sales & EMI</button>
  
<hr>

<h3>EMI Schedule</h3>

<label>EMI Start Date</label>
<input type="date" id="emiStartDate">

<label>Total Installments</label>
<input type="text" id="totalInstallments" value="12 Weeks" readonly>

<label>EMI Status</label>
<input type="text" id="emiStatus" value="Pending" readonly>

<div id="emiScheduleTable"></div>

<br>

<button type="button" id="printInvoice">
Print Invoice
</button>

<button type="button" id="printAgreement">
Print EMI Agreement
</button>
