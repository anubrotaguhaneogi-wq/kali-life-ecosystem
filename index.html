        /* হেডার - স্টিকি ও গ্লাস ইফেক্ট */
        .navbar {

            padding: 60px 10%; text-align: center; background: linear-gradient(180deg, #050505 0%, #0d1a14 100%);

        /* সার্ভিস গ্রিড - আধুনিক কার্ড */
        .services-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; padding: 50px 5%; }
        .card {

            border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.4s; text-align: center;
        }
        .card:hover { transform: translateY(-15px); background: rgba(0, 255, 136, 0.05); border-color: #00ff88; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 15px; margin-bottom: 20px; }

        /* ভিডিও সেকশন */
        .video-wrapper { padding: 50px; text-align: center; }
        iframe { border-radius: 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.8); }

        .contact-btn {
